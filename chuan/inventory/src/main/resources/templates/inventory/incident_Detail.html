<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運事件問題-檢視</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>

    <style>
        .table th {
            text-align: left;
            /* 標題內容居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
        }


        .event-content-textarea {
            width: 100%;
            /* 填滿 td */
            height: 120px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-td {
            width: 50%;
            /* 填滿 td */
            height: 80px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-date {
            width: 100%;
            /* 填滿 td */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .form-control.select {
            background-color: white;
        }

        .custom-btn {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        .custom-btn:hover {
            color: white;
            /* 字體保持白色 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            /* 發光效果 */
            background-color: #18a383;
            /* 懸停時略微變化背景色 */
            border-color: #18a383;
        }

        td button {
            display: block;
            /* 按鈕變為區塊元素 */
            margin-bottom: 5px;
            /* 按鈕之間的間距 */
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <!-- Content Start -->
    <div class="content">
        <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
        <div class="cotainer-fluid pt-4 px-4 fs-6 fw-bold ">
            <div class="bg-light rounded p-4">
                <table class="table text-dark">
                    <tr>
                        <th>事件編號 incidentId </th>
                        <td th:text="${incidentDto.incidentId}" id="incidentId"></td>
                    </tr>
                    <tr>
                        <th>歸屬 belongingType </th>
                        <td th:text="${incidentDto.belongingType}"></td>
                    </tr>
                    <tr>
                        <th>反應人 reporter </th>
                        <td th:text="${incidentDto.reporter}"></td>
                    </tr>
                    <tr>
                        <th>工作事項 task </th>
                        <td th:text="${incidentDto.task}"></td>
                    </tr>
                    <tr>
                        <th>回報數 reportCount </th>
                        <td th:text="${incidentDto.reportCount}"></td>
                    </tr>
                    <tr>
                        <th>重要性 importance </th>
                        <td th:text="${incidentDto.importance}"></td>
                    </tr>
                    <tr>
                        <th>預設處理部門/處理人 department/handler </th>
                        <td th:text="${incidentDto.department + ' / ' + incidentDto.handler}"></td>
                    </tr>
                    <tr>
                        <th>當前處理狀態 status </th>
                        <td th:text="${incidentDto.status}"></td>
                    </tr>
                    <tr>
                        <th>最後回報時間 lastReportTime </th>
                        <td th:text="${incidentDto.lastReportTime}"></td>
                    </tr>
                    <tr>
                        <th>反應日期 reportDate </th>
                        <td th:text="${incidentDto.reportDate}"></td>
                    </tr>
                    <!-- <tr>
                        <th>事件內容 eventContent </th>
                        <td>
                            <textarea th:text="${incident.eventContent}"
                                class="form-control event-content-textarea text-dark"></textarea>
                        </td>
                    </tr> -->
                    <tr>
                        <th>事件內容 eventContent </th>
                        <td th:text="${incidentDto.eventContent}"></td>
                    </tr>

                </table>
                <table class="table text-dark">
                    <thead>
                        <tr>
                            <th>回報時間</th>
                            <th style="text-align: center;">回報人</th>
                            <th style="text-align: center;">處理進度</th>
                            <th style="text-align: center;">執行日期</th>
                            <th style="text-align: center;">執行人</th>
                            <th style="text-align: center;">內容</th>
                            <th>操作</th>
                            <th>上傳附件</th>
                        </tr>
                    </thead>
                    <tbody id="report-tbody">
                        <tr th:if="${#lists.isEmpty(incidentDto.reports)}">
                            <td> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td class="event-content-td">
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr th:each="report : ${incidentDto.reports}" th:id="'report-row-' + ${report.reportId}">
                            <td th:text="${report.reportTimeString}" style="text-align: center;"></td>
                            <td th:text="${report.reporter}" style="text-align: center;"></td>
                            <td th:text="${report.progress}" style="text-align: center;"></td>
                            <td th:text="${report.executionDateString}" style="text-align: center;"></td>
                            <td th:text="${report.executor}" style="text-align: center;"></td>
                            <td th:text="${report.content}" class="event-content-td">
                            </td>
                            <td>
                                <button class="btn btn-primary btn-sm edit-btn" th:data-id="${report.reportId}"
                                    th:data-reporter="${report.reporter}" th:data-progress="${report.progress}"
                                    th:data-executionDate="${report.executionDateString}"
                                    th:data-executor="${report.executor}"
                                    th:data-content="${report.content}">編輯</button>
                            </td>
                            <td>上傳附件</td>
                        </tr>
                    </tbody>
                </table>
                <!-- 新增按鈕 -->
                <button class=" btn btn-sm custom-btn " onclick="addReportRow()">回報事件</button>
                <a th:href="@{/templates/inventory/update_incident(incidentId=${incidentDto.incidentId})}"
                    class="btn btn-primary btn-sm" role="button">
                    編輯事件
                </a>
                <button class="btn btn-danger btn-sm" id="deleteIncident">刪除</button>

            </div>
        </div>
    </div>
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>
        function addReportRow() {
            const tbody = document.getElementById("report-tbody");
            const newRow = document.createElement("tr");

            newRow.innerHTML = `
            <td></td>
            <td>
            <select class="form-control select text-dark" id="reporter">
                <option value="select">請選擇</option>
                <option value="回報人1">回報人1</option>
                <option value="回報人2">回報人2</option>
                <option value="回報人3">回報人3</option>
                <option value="回報人4">回報人4</option>
                <option value="回報人5">回報人5</option>
            </select>
            </td>
            <td> 
                <select class="form-control select text-dark" id="progress">
                <option value="select">請選擇</option>
                <option value="未開始">未開始</option>
                <option value="待處理">待處理</option>
                <option value="處理中">處理中</option>
                <option value="已轉交他人">已轉交他人</option>
                <option value="延期">延期</option>
                <option value="待結案">待結案</option>
                <option value="退件">退件</option>
                <option value="已結案">已結案</option>
                </select></td>
            <td><input type="date" class="form-control event-content-date" id="executionDate" /></td>
            <td>
                <select class="form-control select text-dark" id="executor">
                <option value="select">請選擇</option>
                <option value="執行人1">執行人1</option>
                <option value="執行人2">執行人2</option>
                <option value="執行人3">執行人3</option>
                </select>
            </td>
            <td><textarea class="form-control event-content-textarea" placeholder="內容" id="content"></textarea></td>
            <td>
                <div>
                <button class="btn btn-primary btn-sm mb-1" id="uploadButton">上傳</button>
                </div>
                <div>
                <button class="btn btn-danger btn-sm" onclick="removeRow(this)">刪除</button>
                </div>
            <td><input type="file" class="form-control" /></td>
        `;
            tbody.appendChild(newRow);
        }

        function removeRow(button) {
            const row = button.closest('tr'); // 找到按鈕所在的 <tr>
            row.remove(); // 移除該行
        }
        $(document).ready(function () {
            // 綁定動態元素的事件
            $(document).on("click", "#uploadButton", function () {
                console.log("enter");
                // 收集資料
                var reporter = $(this).closest('tr').find('#reporter').val();
                console.log(reporter + "test");
                var progress = $(this).closest('tr').find('#progress').val();
                var executionDate = $(this).closest('tr').find('#executionDate').val();
                var executor = $(this).closest('tr').find('#executor').val();
                var content = $(this).closest('tr').find('#content').val();
                // var fileInput = $(this).closest('tr').find('#fileInput')[0].files[0];
                // 檢查必填欄位
                if (reporter == "select" || progress == "select") {
                    Swal.fire({
                        icon: "error",
                        title: "Oops...",
                        text: "請選擇必要欄位",
                    });
                    return;
                }

                // 封裝成物件
                var formDataObject = {
                    incidentId: $("#incidentId").text(),
                    reporter: reporter,
                    progress: progress,
                    executionDate: executionDate,
                    executor: executor,
                    content: content
                };
                console.log(formDataObject);
                $.ajax({
                    url: '/chyunn/incident/incident_inster_report',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(formDataObject),
                    success: function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: '上傳成功！',
                            showCancelButton: false,
                        }).then((result) => {
                            location.reload();
                        })
                    },
                    error: function (error) {
                        Swal.fire({
                            icon: "error",
                            title: "Oops...",
                            text: "上傳失敗",
                        });
                        console.error(error);
                    }
                });
            });
            $(document).on('click', '.edit-btn', function () {
                var reportId = $(this).data('id');  // 獲取報告的 ID
                var reporter = $(this).data('reporter');  // 獲取報告人
                var progress = $(this).data('progress');  // 獲取進度
                var executionDate = $(this).data('executiondate');  // 獲取執行日期
                var executor = $(this).data('executor');  // 獲取執行人
                var content = $(this).data('content');  // 獲取內容
                console.log(reportId)
                var row = $('#report-row-' + reportId);  // 查找對應的表格行
                row.find('td:nth-child(2)').html(`
                <select class="form-control select text-dark">
                <option value="回報人1" ${'回報人1' == reporter ? 'selected' : ''}>回報人1</option>
                <option value="回報人2" ${'回報人2' == reporter ? 'selected' : ''}>回報人2</option>
                <option value="回報人3" ${'回報人3' == reporter ? 'selected' : ''}>回報人3</option>
                </select>
                `);
                // 更新 progress 欄位
                row.find('td:nth-child(3)').html(`
               <select class="form-control select text-dark">
               <option value="未開始" ${'未開始' == progress ? 'selected' : ''}>未開始</option>
               <option value="待處理" ${'待處理' == progress ? 'selected' : ''}>待處理</option>
               <option value="處理中" ${'處理中' == progress ? 'selected' : ''}>處理中</option>
               <option value="已轉交他人" ${'已轉交他人' == progress ? 'selected' : ''}>已轉交他人</option>
               <option value="延期" ${'延期' == progress ? 'selected' : ''}>延期</option>
               <option value="待結案" ${'待結案' == progress ? 'selected' : ''}>待結案</option>
               <option value="退件" ${'退件' == progress ? 'selected' : ''}>退件</option>
               <option value="已結案" ${'已結案' == progress ? 'selected' : ''}>已結案</option>
               </select>
               `);

                // 更新 executionDate 欄位
                row.find('td:nth-child(4)').html(`<input type="date" class="form-control text-dark" value="${executionDate}" />`);

                // 更新 executor 欄位
                row.find('td:nth-child(5)').html(`
               <select class="form-control select text-dark">
               <option value="執行人1" ${'執行人1' == executor ? 'selected' : ''}>執行人1</option>
               <option value="執行人2" ${'執行人2' == executor ? 'selected' : ''}>執行人2</option>
               <option value="執行人3" ${'執行人3' == executor ? 'selected' : ''}>執行人3</option>
               </select>
               `);

                // 更新 content 欄位
                row.find('td:nth-child(6)').html(`<textarea class="form-control text-dark">${content}</textarea>`);

                // 更新按鈕
                row.find('td:nth-child(7)').html(`
                <div>
                <button class="btn btn-primary btn-sm save-btn" data-id="${reportId}">保存</button>
                <br>
                <button class="btn btn-danger btn-sm delete-btn" data-id="${reportId}">刪除</button>
                </div>
                `);
            });


            $(document).on('click', '.delete-btn', function () {
                var reportId = $(this).data('id');  // 獲取報告的 ID
                console.log('刪除報告 ID: ' + reportId);
                Swal.fire({
                    title: "確定要刪除?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "刪除"
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/chyunn/incident/incident_delete_report',
                            type: 'DELETE',
                            data: {
                                reportId: reportId,
                                incidentId: $("#incidentId").text()
                            },
                            success: function (response) {
                                if (response.code === 200) {
                                    // 刪除成功後，移除對應的行
                                    Swal.fire({
                                        icon: 'success',
                                        title: '刪除成功！',
                                        showCancelButton: false,
                                    }).then((result) => {
                                        location.reload();
                                    });
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: '刪除失敗',
                                        text: response.message || '發生錯誤，請稍後再試。',
                                    });
                                }
                            },
                            error: function (xhr, status, error) {
                                Swal.fire({
                                    icon: 'error',
                                    title: '請求失敗',
                                    text: '發生錯誤，請稍後再試。',
                                });
                            }
                        });
                    }
                })
            });
            // 保存按鈕點擊事件
            $(document).on('click', '.save-btn', function () {
                var reportId = $(this).data('id');  // 獲取報告的 ID
                var row = $('#report-row-' + reportId);  // 查找對應的表格行

                // 獲取表單數據
                var reporter = row.find('td:nth-child(2) select').val();
                var progress = row.find('td:nth-child(3) select').val();
                var executionDate = row.find('td:nth-child(4) input').val();
                var executor = row.find('td:nth-child(5) select').val();
                var content = row.find('td:nth-child(6) textarea').val();

                var formDataObject = {
                    incidentId: $("#incidentId").text(),
                    reportId: reportId,
                    reporter: reporter,
                    progress: progress,
                    executionDate: executionDate,
                    executor: executor,
                    content: content
                };
                $.ajax({
                    url: '/chyunn/incident/incident_update_report',
                    type: 'PUT',
                    contentType: 'application/json',  // 告訴後端你發送的是 JSON 格式
                    data: JSON.stringify(formDataObject),  // 將物件轉換為 JSON 字串
                    success: function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: '保存成功！',
                            showCancelButton: false,
                        }).then((result) => {
                            location.reload();
                        })
                    },
                    error: function (error) {
                        Swal.fire({
                            icon: "error",
                            title: "Oops...",
                            text: "保存失敗",
                        });
                        console.error(error);
                    }
                });

            });

            $("#deleteIncident").click(function (event) {
                //取消預設動作
                event.preventDefault();
                Swal.fire({
                    title: "確定要刪除?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "刪除"
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/chyunn/incident/incident_delete',
                            type: 'DELETE',
                            data: {
                                incidentId: $("#incidentId").text()
                            },
                            success: function (response) {
                                if (response.code === 200) {
                                    // 刪除成功後，移除對應的行
                                    Swal.fire({
                                        icon: 'success',
                                        title: '刪除成功！',
                                        showCancelButton: false,
                                    }).then((result) => {
                                        window.location.href = '/chyunn/incident/select_incident';
                                    });
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: '刪除失敗',
                                        text: response.message || '發生錯誤，請稍後再試。',
                                    });
                                }
                            },
                            error: function (xhr, status, error) {
                                Swal.fire({
                                    icon: 'error',
                                    title: '請求失敗',
                                    text: '發生錯誤，請稍後再試。',
                                });
                            }
                        });
                    }
                })
            });

        })

    </script>
</body>

</html>
