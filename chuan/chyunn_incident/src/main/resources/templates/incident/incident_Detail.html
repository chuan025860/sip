<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運事件問題-檢視</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>

    <style>
        .table th {
            text-align: left;
            /* 標題內容居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
        }


        .event-content-textarea {
            width: 100%;
            /* 填滿 td */
            height: 120px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-td {
            width: 50%;
            /* 填滿 td */
            height: 80px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-date {
            width: 100%;
            /* 填滿 td */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .form-control.select {
            background-color: white;
        }

        .custom-btn {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        .custom-btn:hover {
            color: white;
            /* 字體保持白色 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            /* 發光效果 */
            background-color: #18a383;
            /* 懸停時略微變化背景色 */
            border-color: #18a383;
        }

        .custom-textarea {
            height: 150px;
            /* 調整高度 */
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <!-- Content Start -->
    <div class="content">
        <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
        <div class="cotainer-fluid pt-4 px-4 fs-6 fw-bold ">
            <div class="bg-light rounded p-3">
                <table class="table table-bordered text-dark" style="border-color: #ddd;"> <!-- 加入邊框 -->
                    <thead class="bg-secondary text-white"> <!-- 標題背景色 -->
                        <tr>
                            <th colspan="4" class="text-left">事件詳情</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
                            <th>事件編號</th>
                            <td th:text="${incidentDto.incidentId}" id="incidentId"></td>
                            <th>歸屬</th>
                            <td th:text="${incidentDto.belongingType}"></td>
                        </tr>
                        <tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
                            <th>事件相關客戶</th>
                            <td th:text="${incidentDto.customer}"></td>
                            <th>事件相關車輛</th>
                            <td th:text="${incidentDto.car}"></td>
                        </tr>
                        <tr>
                            <th>反應日期</th>
                            <td th:text="${incidentDto.reportDate}"></td>
                            <th>最後回報時間</th>
                            <td th:text="${incidentDto.lastReportTime}"></td>
                        </tr>
                        <tr style="background-color: #f9f9f9;">
                            <th>反應人</th>
                            <td th:text="${incidentDto.reporter}" id="reporter"></td>
                            <th>回報數</th>
                            <td th:text="${incidentDto.reportCount}"></td>
                        </tr>
                        <tr>
                            <th>工作事項</th>
                            <td th:text="${incidentDto.task}"></td>
                            <th>重要性</th>
                            <td th:text="${incidentDto.importance}"></td>
                        </tr>
                        <tr style="background-color: #f9f9f9;">
                            <th>處理部門/處理人</th>
                            <td th:text="${incidentDto.department + ' / ' + incidentDto.handler}"></td>
                            <th>當前處理狀態</th>
                            <td th:text="${incidentDto.status}"></td>
                        </tr>
                        <tr>
                            <th>事件內容</th>
                            <td colspan="3" th:text="${incidentDto.eventContent}" style="word-break: break-word;"></td>
                            <!-- 長內容換行 -->
                        </tr>
                    </tbody>
                </table>
                <table class="table text-dark">
                    <thead>
                        <tr>
                            <th style="text-align: center;">回報時間</th>
                            <th style="text-align: center;">回報人</th>
                            <th style="text-align: center;">處理進度</th>
                            <th style="text-align: center;">執行日期</th>
                            <th style="text-align: center;">執行人</th>
                            <th style="text-align: center;">內容</th>
                            <th>操作</th>
                            <th>上傳附件</th>
                        </tr>
                    </thead>
                    <tbody id="report-tbody">
                        <tr th:if="${#lists.isEmpty(incidentDto.reports)}">
                            <td> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td class="event-content-td">
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr th:each="report : ${incidentDto.reports}" th:id="'report-row-' + ${report.reportId}">
                            <td th:text="${report.reportTimeString}" style="text-align: center;"></td>
                            <td th:text="${report.reporter}" style="text-align: center;"></td>
                            <td th:text="${report.progress}" style="text-align: center;"></td>
                            <td th:text="${report.executionDateString}" style="text-align: center;"></td>
                            <td th:text="${report.executor}" style="text-align: center;"></td>
                            <td th:text="${report.content}" class="event-content-td">
                            </td>
                            <td>
                                <button class="btn btn-primary btn-sm edit-btn" th:data-id="${report.reportId}"
                                    th:data-reporter="${report.reporter}" th:data-progress="${report.progress}"
                                    th:data-executionDate="${report.executionDateString}"
                                    th:data-executor="${report.executor}" th:data-content="${report.content}"
                                    style="display: none;"
                                    th:if="${!incidentDto.invalid && incidentDto.status != '已結案'}">編輯</button>
                            </td>
                            <td>上傳附件</td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex align-items-center">
                    <!-- 左側按鈕 -->
                    <div>
                        <button class="btn btn-sm custom-btn me-2"
                            th:if="${!incidentDto.invalid && incidentDto.status != '已結案'}"
                            onclick="addReportRow()">回報事件</button>
                        <a th:href="@{/incident/update_incident(incidentId=${incidentDto.incidentId})}"
                            class="btn btn-primary btn-sm me-2 btn-edit-incident"
                            th:if="${!incidentDto.invalid && incidentDto.status != '已結案'}" role="button"
                            style="display: none;">
                            編輯事件
                        </a>
                    </div>

                    <!-- 右側按鈕 -->
                    <button class="btn btn-danger btn-sm ms-auto" id="deleteIncident"
                        th:if="${!incidentDto.invalid && incidentDto.status != '已結案'}">作廢</button>
                </div>

            </div>
        </div>
    </div>
    <input type="hidden" th:value="${lastReporter}" id="lastReporter">
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>
        function addReportRow() {
            // 彈出 SweetAlert 表單
            Swal.fire({
                title: '回報事件',
                html: `
            <div class="form-group mb-3">
            <label for="swal-reporter" class="text-dark text-start d-block">回報人</label>
            <select id="swal-reporter" class="form-control text-dark" required>
                <option value="">請選擇</option>
                <option value="BA489">BA489</option>
                <option value="BA488">BA488</option>
                <option value="回報人3">回報人3</option>
                <option value="回報人4">回報人4</option>
                <option value="回報人5">回報人5</option>
            </select>
            </div>
            <div class="form-group mb-3">
            <label for="swal-progress" class="text-dark text-start d-block">處理進度</label>
            <select id="swal-progress" class="form-control text-dark" required>
                <option value="">請選擇</option>
                <option value="未開始">未開始</option>
                <option value="待處理">待處理</option>
                <option value="處理中">處理中</option>
                <option value="已轉交他人">已轉交他人</option>
                <option value="延期">延期</option>
                <option value="待結案">待結案</option>
                <option value="退件">退件</option>
                <option value="已結案">已結案</option>
            </select>
            </div>
            <div class="form-group mb-3">
            <label for="swal-executionDate" class="text-dark text-start d-block">執行日期</label>
            <input type="date" id="swal-executionDate" class="form-control text-dark selectedDate" required />
            </div>
            <div class="form-group mb-3">
            <label for="swal-executor" class="text-dark text-start d-block">執行人</label>
            <select id="swal-executor" class="form-control text-dark" required>
                <option value="">請選擇</option>
                <option value="執行人1">執行人1</option>
                <option value="執行人2">執行人2</option>
                <option value="執行人3">執行人3</option>
            </select>
            </div>
            <div class="form-group mb-3">
            <label for="swal-content" class="text-dark text-start d-block">內容</label>
            <textarea id="swal-content" class="form-control text-dark custom-textarea" placeholder="內容" required></textarea>
            </div>
            `,

                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '新增',
                cancelButtonText: '取消',
                width: 800,
                didOpen: () => {
                    // 在 SweetAlert 完全打開後初始化 flatpickr
                    flatpickr("#swal-executionDate", {
                        dateFormat: "Y-m-d",
                        defaultDate: [new Date()],
                    });
                },
                preConfirm: () => {
                    const reporter = document.getElementById('swal-reporter').value;
                    const progress = document.getElementById('swal-progress').value;
                    const executionDate = document.getElementById('swal-executionDate').value;
                    const executor = document.getElementById('swal-executor').value;
                    const content = document.getElementById('swal-content').value;
                    const incidentId = $("#incidentId").text();
                    // 檢查是否有空欄位
                    if (!reporter || !progress || !executionDate || !executor || !content) {
                        Swal.showValidationMessage('請填寫所有必填欄位');
                        return false;
                    }

                    return {
                        incidentId,
                        reporter,
                        progress,
                        executionDate,
                        executor,
                        content,
                    };
                },
            }).then((result) => {
                if (result.isConfirmed) {
                    const formData = result.value;
                    console.log(formData);
                    // 第二個 SweetAlert 彈窗：確認內容
                    Swal.fire({
                        title: '確認回報內容',
                        html: `
                    <p style="text-align: left;"><strong>回報人：</strong> ${formData.reporter}</p>
                    <p style="text-align: left;"><strong>處理進度：</strong> ${formData.progress}</p>
                    <p style="text-align: left;"><strong>執行日期：</strong> ${formData.executionDate}</p>
                    <p style="text-align: left;"><strong>執行人：</strong> ${formData.executor}</p>
                    <p style="text-align: left;"><strong>內容：</strong> ${formData.content}</p>
                    `,
                        showCancelButton: true,
                        confirmButtonText: '確定送出',
                        cancelButtonText: '取消',
                        width: 600,
                    }).then((confirmResult) => {
                        if (confirmResult.isConfirmed) {
                            // 確定後，發送 AJAX 請求到後端
                            $.ajax({
                                url: '/chyunn/incident/incident_inster_report',
                                type: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify(formData),
                                success: (response) => {
                                    if (response.code === 200) {
                                        Swal.fire({
                                            icon: 'success',
                                            title: '上傳成功！',
                                            showCancelButton: false,
                                        }).then((result) => {
                                            location.reload();
                                        })
                                    } else {
                                        Swal.fire({
                                            icon: 'error',
                                            title: '回報送出失敗',
                                            text: '發生錯誤',
                                        });
                                    }

                                },
                                error: (error) => {
                                    Swal.fire('失敗', '回報送出失敗，發生錯誤', 'error');
                                },
                            });
                        }
                    });
                }
            });
        }

        $(document).ready(function () {
            var reporter = $("#reporter").text();
            console.log(reporter)
            var loginID = $("#loginID").text();
            console.log("Session Login ID:", loginID);
            var lastReporter = $("#lastReporter").val();

            var lastReportRow = $("#report-tbody tr").last(); // 找到最後一行
            var lastReportReporter = lastReportRow.find("td:nth-child(2)").text(); // 第二列是 reporter
            console.log(lastReportReporter)

            // 如果 lastReporter 為空，則比較 reporter 和 loginID
            if (!lastReporter) {
                if (reporter === loginID) {
                    // 顯示編輯按鈕
                    $(".btn-edit-incident").show();
                }
            } else {
                if (lastReporter === lastReportReporter) {
                    console.log("test")
                    // 顯示最後一個回報的編輯按鈕
                    lastReportRow.find(".edit-btn").show();
                } else {
                    $(".edit-btn").hide(); // 隱藏編輯按鈕
                }
            }



            $(document).on('click', '.edit-btn', function () {
                var reportId = $(this).data('id');  // 獲取報告的 ID
                var reporter = $(this).data('reporter');  // 獲取報告人
                var progress = $(this).data('progress');  // 獲取進度
                var executionDate = $(this).data('executiondate');  // 獲取執行日期
                var executor = $(this).data('executor');  // 獲取執行人
                var content = $(this).data('content');  // 獲取內容
                console.log(reportId)

                // 彈出 SweetAlert 表單並填充資料
                Swal.fire({
                    title: '更新回報事件',
                    html: `
                <div class="form-group mb-3">
                <label for="swal-reporter" class="text-dark text-start d-block">回報人</label>
                <select id="swal-reporter" class="form-control text-dark" required>
                    <option value="">請選擇</option>
                    <option value="BA489" ${reporter === "BA489" ? 'selected' : ''}>BA489</option>
                    <option value="BA488" ${reporter === "BA488" ? 'selected' : ''}>BA488</option>
                    <option value="回報人3" ${reporter === "回報人3" ? 'selected' : ''}>回報人3</option>
                    <option value="回報人4" ${reporter === "回報人4" ? 'selected' : ''}>回報人4</option>
                    <option value="回報人5" ${reporter === "回報人5" ? 'selected' : ''}>回報人5</option>
                </select>
                </div>
                <div class="form-group mb-3">
                <label for="swal-progress" class="text-dark text-start d-block">處理進度</label>
                <select id="swal-progress" class="form-control text-dark" required>
                    <option value="">請選擇</option>
                    <option value="未開始" ${progress === "未開始" ? 'selected' : ''}>未開始</option>
                    <option value="待處理" ${progress === "待處理" ? 'selected' : ''}>待處理</option>
                    <option value="處理中" ${progress === "處理中" ? 'selected' : ''}>處理中</option>
                    <option value="已轉交他人" ${progress === "已轉交他人" ? 'selected' : ''}>已轉交他人</option>
                    <option value="延期" ${progress === "延期" ? 'selected' : ''}>延期</option>
                    <option value="待結案" ${progress === "待結案" ? 'selected' : ''}>待結案</option>
                    <option value="退件" ${progress === "退件" ? 'selected' : ''}>退件</option>
                    <option value="已結案" ${progress === "已結案" ? 'selected' : ''}>已結案</option>
                </select>
                </div>
                <div class="form-group mb-3">
                <label for="swal-executionDate" class="text-dark text-start d-block">執行日期</label>
                <input type="date" id="swal-executionDate" class="form-control text-dark selectedDate" value="${executionDate}" required />
                </div>
                <div class="form-group mb-3">
                <label for="swal-executor" class="text-dark text-start d-block">執行人</label>
                <select id="swal-executor" class="form-control text-dark" required>
                    <option value="">請選擇</option>
                    <option value="執行人1" ${executor === "執行人1" ? 'selected' : ''}>執行人1</option>
                    <option value="執行人2" ${executor === "執行人2" ? 'selected' : ''}>執行人2</option>
                    <option value="執行人3" ${executor === "執行人3" ? 'selected' : ''}>執行人3</option>
                </select>
                </div>
                <div class="form-group mb-3">
                <label for="swal-content" class="text-dark text-start d-block">內容</label>
                <textarea id="swal-content" class="form-control text-dark custom-textarea" placeholder="內容" required>${content}</textarea>
                </div>
                `,
                    focusConfirm: false,
                    showCancelButton: true,
                    confirmButtonText: '更新',
                    cancelButtonText: '取消',
                    width: 800,
                    didOpen: () => {
                        // 在 SweetAlert 完全打開後初始化 flatpickr
                        flatpickr("#swal-executionDate", {
                            dateFormat: "Y-m-d",
                            defaultDate: [new Date()],
                        });
                    },
                    preConfirm: () => {
                        return {
                            incidentId: $("#incidentId").text(),
                            reportId: reportId,
                            reporter: document.getElementById('swal-reporter').value,
                            progress: document.getElementById('swal-progress').value,
                            executionDate: document.getElementById('swal-executionDate').value,
                            executor: document.getElementById('swal-executor').value,
                            content: document.getElementById('swal-content').value,
                        };
                    },
                }).then((result) => {
                    if (result.isConfirmed) {
                        const formData = result.value;
                        // 第二個 SweetAlert 彈窗：確認內容
                        Swal.fire({
                            title: '確認更新內容',
                            html: `
                    <p style="text-align: left;"><strong>回報人：</strong> ${formData.reporter}</p>
                    <p style="text-align: left;"><strong>處理進度：</strong> ${formData.progress}</p>
                    <p style="text-align: left;"><strong>執行日期：</strong> ${formData.executionDate}</p>
                    <p style="text-align: left;"><strong>執行人：</strong> ${formData.executor}</p>
                    <p style="text-align: left;"><strong>內容：</strong> ${formData.content}</p>
                    `,
                            showCancelButton: true,
                            confirmButtonText: '確定送出',
                            cancelButtonText: '取消',
                            width: 600,
                        }).then((confirmResult) => {
                            if (confirmResult.isConfirmed) {
                                $.ajax({
                                    url: '/chyunn/incident/incident_update_report',
                                    type: 'PUT',
                                    contentType: 'application/json',
                                    data: JSON.stringify(formData),
                                    success: function (response) {
                                        if (response.code === 200) {
                                            Swal.fire({
                                                icon: 'success',
                                                title: '更新成功！',
                                                showCancelButton: false,
                                            }).then((result) => {
                                                location.reload();
                                            })
                                        } else {
                                            Swal.fire({
                                                icon: 'error',
                                                title: '更新失敗',
                                                text: '發生錯誤',
                                            });
                                        }
                                    },
                                    error: function (error) {
                                        Swal.fire({
                                            icon: "error",
                                            title: "Oops...",
                                            text: "保存失敗",
                                        });
                                        console.error(error);
                                    }
                                });
                            }
                        });
                    }
                });
            });

            $("#deleteIncident").click(function (event) {
                //取消預設動作
                event.preventDefault();
                Swal.fire({
                    title: "確定要作廢?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "作廢"
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/chyunn/incident/incident_invalid',
                            type: 'PUT',
                            data: {
                                incidentId: $("#incidentId").text()
                            },
                            success: function (response) {
                                if (response.code === 200) {
                                    // 刪除成功後，移除對應的行
                                    Swal.fire({
                                        icon: 'success',
                                        title: '作廢成功！',
                                        showCancelButton: false,
                                    }).then((result) => {
                                        window.location.href = '/chyunn/incident/select_incident';
                                    });
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: '作廢失敗',
                                        text: response.message || '發生錯誤，請稍後再試。',
                                    });
                                }
                            },
                            error: function (xhr, status, error) {
                                Swal.fire({
                                    icon: 'error',
                                    title: '請求失敗',
                                    text: '發生錯誤，請稍後再試。',
                                });
                            }
                        });
                    }
                })
            });

        })

    </script>
</body>

</html>
