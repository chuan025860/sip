<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運事件問題-編輯事件</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>

    <style>
        .table th {
            text-align: left;
            /* 水平居中 */
            vertical-align: middle;
            /* 垂直居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
        }

        .table td {
            vertical-align: middle;
            /* 垂直居中 */
        }

        .tbody th {
            text-align: left;
            /* 標題內容居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
            padding-top: 11px;
            /* 只影響 th 的上邊距 */
        }

        .flatpickr-input {
            background-color: #fff !important;
            color: #000 !important;
        }

        .form-control.select {
            background-color: white;
        }

        .custom-btn {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        .custom-btn:hover {
            color: white;
            /* 字體保持白色 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            /* 發光效果 */
            background-color: #18a383;
            /* 懸停時略微變化背景色 */
            border-color: #18a383;
        }

        /* 設定 CKEditor 的編輯區域高度 */
        .ck-editor__editable {
            min-height: 400px !important;
            /* 讓編輯區至少有 400px 高 */
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
        <div class="cotainer-fluid pt-4 px-4 fs-6 fw-bold ">
            <div class="bg-light rounded p-3">
                <!-- <div>test</div>
                <div class="main-container">
                    <div class="editor-container editor-container_classic-editor" id="editor-container">
                        <div class="editor-container__editor">
                            <div id="editor"></div>
                        </div>
                    </div>
                </div> -->
                <table class="table table-bordered " style="border-color: #ddd;"> <!-- 加入邊框 -->
                    <thead class="bg-secondary text-white text-dark"> <!-- 標題背景色 -->
                        <tr>
                            <th colspan="4" class="text-left">更新事件</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="text-dark" style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
                            <th>事件編號</th>
                            <td th:text="${incidentDto.incidentId}" id="incidentId"></td>
                            <th>歸屬 &nbsp;/ &nbsp;製表人</th>
                            <td>
                                <select id="belongingType" name="belongingType" class="form-select  text-dark d-inline"
                                    required style="width: 170px;">
                                    <!-- 預設選項，根據條件加上 `selected` -->
                                    <option value="內部" th:selected="${incidentDto.belongingType == '內部'}">內部</option>
                                    <option value="外部" th:selected="${incidentDto.belongingType == '外部'}">外部</option>
                                </select>
                                <input type="text" class="form-control text-dark d-inline" id="creator"
                                    style="width: 170px; background-color: #fff;" th:value="${incidentDto.creator}"
                                    readonly />
                            </td>
                        </tr>
                        <tr class="text-dark" style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
                            <th>事件相關客戶</th>
                            <td>customer</td>
                            <th>事件相關車輛</th>
                            <td>car</td>
                        </tr>
                        <tr class="text-dark">
                            <th>反應日期</th>
                            <td><input type="text" th:value="${incidentDto.reportDate}" class="form-control text-dark"
                                    id="reportDate" style="width: 170px;" /></td>
                            <th>最後回報時間</th>
                            <td th:text="${incidentDto.lastReportTime}" id="lastReportTime"></td>
                        </tr>
                        <tr class="text-dark" style="background-color: #f9f9f9;">
                            <th>反應人</th>
                            <td><input type="text" class="form-control text-dark" id="reporter"
                                    style="width: 170px; background-color: #fff;" th:value="${incidentDto.reporter}" />
                            </td>
                            <th>回報數</th>
                            <td th:text="${incidentDto.reportCount}"></td>
                        </tr>
                        <tr class="text-dark">
                            <th>工作事項</th>
                            <td><select id="task" name="task" class="form-select text-dark" required
                                    style="width: 170px;">
                                    <option value="需要業務接洽" th:selected="${incidentDto.task == '需要業務接洽'}">需要業務接洽</option>
                                    <option value="需要服務人員接洽" th:selected="${incidentDto.task == '需要服務人員接洽'}">需要服務人員接洽
                                    </option>
                                    <option value="需要工務部處理" th:selected="${incidentDto.task == '需要工務部處理'}">需要工務部處理
                                    </option>
                                    <option value="需要資訊部處理" th:selected="${incidentDto.task == '需要資訊部處理'}">需要資訊部處理
                                    </option>
                                    <option value="上級長官指示處理" th:selected="${incidentDto.task == '上級長官指示處理'}">上級長官指示處理
                                    </option>
                                    <option value="其他不明確事件" th:selected="${incidentDto.task == '其他不明確事件'}">其他不明確事件
                                    </option>
                                    <option value="系統測試用" th:selected="${incidentDto.task == '系統測試用'}">系統測試用</option>
                                </select></td>
                            <th>重要性</th>
                            <td><select id="importance" name="importance" class="form-select  text-dark" required
                                    style="width: 170px;">
                                    <option value="特急件" th:selected="${incidentDto.importance == '特急件'}">特急件</option>
                                    <option value="急件" th:selected="${incidentDto.importance == '急件'}">急件</option>
                                    <option value="重要" th:selected="${incidentDto.importance == '重要'}">重要</option>
                                    <option value="普通" th:selected="${incidentDto.importance == '普通'}">普通</option>
                                </select></td>
                        </tr>
                        <tr class="text-dark" style="background-color: #f9f9f9;">
                            <th>處理部門/處理人</th>
                            <td>
                                <select name="department" class="form-select text-dark d-inline" text-dark
                                    style="width: 170px;" id="department">
                                    <option value="工務部" th:selected="${'工務部' == incidentDto.department}">工務部</option>
                                    <option value="行政部" th:selected="${'行政部' == incidentDto.department}">行政部</option>
                                    <option value="資訊部" th:selected="${'資訊部' == incidentDto.department}">資訊部</option>
                                    <option value="營業部" th:selected="${'營業部' == incidentDto.department}">營業部</option>
                                    <option value="財會部" th:selected="${'財會部' == incidentDto.department}">財會部</option>
                                    <option value="稽核部" th:selected="${'稽核部' == incidentDto.department}">稽核部</option>
                                    <option value="土資" th:selected="${'土資' == incidentDto.department}">土資</option>
                                </select>
                                <input type="text" class="form-control text-dark d-inline" id="handler"
                                    style="width: 170px; background-color: #fff;" th:value="${incidentDto.handler}" />

                            </td>
                            <th>處理狀態</th>
                            <td> <select class="form-control select text-dark" id="status" style="width: 170px;">
                                    <option value="未開始" th:selected="${'未開始' == incidentDto.status}">未開始</option>
                                    <option value="待處理" th:selected="${'待處理' == incidentDto.status}">待處理</option>
                                    <option value="處理中" th:selected="${'處理中' == incidentDto.status}">處理中</option>
                                    <option value="已轉交他人" th:selected="${'已轉交他人' == incidentDto.status}">已轉交他人</option>
                                    <option value="延期" th:selected="${'延期' == incidentDto.status}">延期</option>
                                    <option value="待結案" th:selected="${'待結案' == incidentDto.status}">待結案</option>
                                    <option value="退件" th:selected="${'退件' == incidentDto.status}">退件</option>
                                    <option value="已結案" th:selected="${'已結案' == incidentDto.status}">已結案</option>
                                </select></td>
                        </tr>
                        <tr>
                            <th class="text-dark">事件主旨</th>
                            <td colspan="3"><input type="text" class="form-control text-dark" id="eventPurpose"
                                    style="width: 690px; background-color: #fff;"
                                    th:value="${incidentDto.eventPurpose}" />
                            </td>
                        </tr>
                        <tr>
                            <th class="text-dark">事件內容</th>
                            <td colspan="3" class="text-dark">
                                <textarea th:utext="${incidentDto.eventContent}" id="eventContent"></textarea>
                                <span id="eventContent-error"></span> <!-- 錯誤訊息顯示區域 -->
                            </td>
                            <!-- 長內容換行 -->
                        </tr>
                        <tr>
                            <th class="text-dark">檢視/上傳附件(限制10MB)</th>
                            <td colspan="3">
                                <small class="text-muted"> 可上傳 Microsoft Office 文件（Word, Excel,
                                    PowerPoint）、PDF、圖片（JPG/PNG）、壓縮檔（ZIP/RAR），單檔最大 10MB</small>
                                <ul class="list-group" id="attachmentList">
                                    <li th:each="file : ${incidentDto.incidentFileDtos}"
                                        class="list-group-item d-flex justify-content-between align-items-center">
                                        <a th:href="@{'/uploads/incident_' + ${incidentDto.incidentId} + '/' + ${file.fileName}}"
                                            th:text="${file.fileName}" target="_blank" class="text-primary"></a>
                                        <!-- 刪除按鈕 -->
                                        <button type="button"
                                            class="btn btn-danger btn-md rounded-circle delete-attachment"
                                            th:attr="data-file=${file.fileId}"
                                            style="width: 35px; height: 35px; font-size: 18px; padding: 5px;">&times;</button>
                                    </li>
                                </ul>
                                <span
                                    th:if="${incidentDto.incidentFileDtos == null or #lists.isEmpty(incidentDto.incidentFileDtos)}"
                                    class="text-muted">無附件</span>

                                <!-- 上傳附件區域 -->
                                <div class="mt-2">
                                    <input type="file" id="attachment" class="form-control text-dark" multiple
                                        accept=".doc, .docx, .xls, .xlsx, .ppt, .pptx, .pdf, .jpg, .jpeg, .png, .zip, .rar">
                                    <div class="mt-2">
                                        <ul id="fileList" class="list-group"></ul> <!-- 檔案名稱顯示區域 -->
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div>
                    <button class="btn btn-secondary btn-sm" id="returnButton">返回</button>
                    <button class="btn btn-sm btn-primary" id="update">點擊更新事件</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <div th:replace="~{backStageNavbar/ckeditor}"></div>
    <script>
        // 從 HTML 中取出 reportDate 的值，設定 flatpickr 預設日期
        var reportDateValue = document.getElementById("reportDate").value;
        console.log(reportDateValue)
        var dateStartPicker = flatpickr("#reportDate", {
            dateFormat: "Y-m-d",
            defaultDate: [reportDateValue], // 使用從資料庫取得的日期
        });

        $(document).ready(function () {
            $('#returnButton').click(function () {
                // 跳轉到事件明細頁面，帶上 incidentId
                window.location.href = '/chyunn/incident/incident_Detail?incidentId=' + $('#incidentId').text();
            });

            document.getElementById("update").addEventListener("click", function () {
                // 構建請求的數據對象
                const incidentId = document.getElementById("incidentId").innerText;
                const belongingType = document.getElementById("belongingType").value;
                const reporter = document.getElementById("reporter").value;
                const task = document.getElementById("task").value;
                const importance = document.getElementById("importance").value;
                const department = document.getElementById("department").value;;
                const handler = document.getElementById("handler").value;;
                const status = document.getElementById("status").value;
                const reportDate = document.getElementById("reportDate").value;
                const creator = document.getElementById("creator").value;
                const eventPurpose = document.getElementById("eventPurpose").value;
                let eventContent = '';
                // ✅ 確保 CKEditor 初始化成功後，才能讀取內容
                if (window.editorInstance) {
                    eventContent = window.editorInstance.getData().trim(); // ✅ 取得 CKEditor 內的內容
                    console.log(eventContent)
                } else {
                    console.error("CKEditor 尚未初始化");
                }

                // 如果內容為空，顯示錯誤訊息
                if (eventContent.length === 0) {
                    $("#eventContent-error").text("事件內容為必填").css("color", "red");
                    return; // 阻止表單提交
                } else {
                    $("#eventContent-error").text(""); // 清除錯誤訊息
                }

                //創一個formData裝incident、圖片img
                const formData = new FormData();
                // 附件處理
                let files = $("#attachment")[0].files;
                for (let i = 0; i < files.length; i++) {
                    formData.append("files", files[i]);
                }
                // 將所有數據組裝為 JSON
                const incident = {
                    incidentId,
                    belongingType,
                    reporter,
                    task,
                    importance,
                    department,
                    handler,
                    status,
                    reportDate,
                    eventContent,
                    creator,
                    eventPurpose
                };
                formData.append("incidentJson", JSON.stringify(incident));
                const token = localStorage.getItem('authToken');  // 從 localStorage 獲取 token
                $.ajax({
                    url: '/chyunn/incident/incident_update',
                    type: 'PUT',
                    data: formData,
                    headers: {
                        'Authorization': token
                    },
                    processData: false, //防止jquery將data變成query String(查詢字串)
                    contentType: false, // 不要設置內容類型，讓瀏覽器自動設置
                    success: function (response) {
                        if (response.code === 200) {
                            Swal.fire({
                                icon: 'success',
                                title: '更新成功！',
                                showCancelButton: false,
                            }).then((result) => {
                                window.location.href = "/chyunn/incident/incident_Detail?incidentId=" + incidentId;
                            })
                        } else {
                            Swal.fire({
                                icon: "error",
                                title: "Oops...",
                                text: "上傳失敗",
                            });
                        }
                    },
                    error: function (xhr, status, error) {
                        if (xhr.status === 401) {
                            localStorage.removeItem('authToken');
                            window.location.href = "/chyunn/login"; // 跳轉到登入頁
                        }
                        let errorMessage = "發生錯誤";
                        try {
                            // 嘗試解析 JSON 回應，避免解析錯誤
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            // 若解析失敗，直接使用原始 responseText
                            errorMessage = xhr.responseText || errorMessage;
                        }
                        Swal.fire({
                            icon: 'error',
                            title: '操做失敗',
                            text: errorMessage,
                        });
                    }
                });
            });

            // 附件刪除功能
            $(document).on("click", ".delete-attachment", function () {
                let fileId = $(this).attr("data-file");
                let listItem = $(this).closest("li");

                Swal.fire({
                    title: "確定要刪除附件?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "刪除附件"
                }).then((result) => {
                    if (result.isConfirmed) {
                        const token = localStorage.getItem('authToken');  // 從 localStorage 獲取 token
                        $.ajax({
                            url: '/chyunn/incident/delete_file',
                            type: 'DELETE',
                            data: {
                                fileId: fileId
                            },
                            headers: {
                                'Authorization': token
                            },
                            success: function (response) {
                                if (response.code === 200) {
                                    // 刪除成功後，移除對應的行
                                    Swal.fire({
                                        icon: 'success',
                                        title: '附件已刪除',
                                        showCancelButton: false,
                                    })
                                    listItem.remove();
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: '刪除失敗',
                                        text: '發生錯誤，請稍後再試。',
                                    });
                                }
                            },
                            error: function (xhr, status, error) {
                                if (xhr.status === 401) {
                                    localStorage.removeItem('authToken');
                                    window.location.href = "/chyunn/login"; // 跳轉到登入頁
                                }
                                let errorMessage = "發生錯誤";
                                try {
                                    // 嘗試解析 JSON 回應，避免解析錯誤
                                    let response = JSON.parse(xhr.responseText);
                                    errorMessage = response.message || errorMessage;
                                } catch (e) {
                                    // 若解析失敗，直接使用原始 responseText
                                    errorMessage = xhr.responseText || errorMessage;
                                }
                                Swal.fire({
                                    icon: 'error',
                                    title: '刪除失敗',
                                    text: errorMessage,
                                });
                            }
                        });
                    }
                })
            });

            // 上傳附件的UI
            let selectedFiles = []; // 存儲已選擇的檔案
            $("#attachment").on("change", function (event) {
                let fileList = $("#fileList");
                fileList.empty(); // 清空列表
                selectedFiles = Array.from(event.target.files); // 轉成陣列

                updateFileList();
            });

            function updateFileList() {
                let fileList = $("#fileList");
                fileList.empty();

                $.each(selectedFiles, function (index, file) {
                    let listItem = $("<li>")
                        .addClass("list-group-item d-flex justify-content-between align-items-center")
                        .text(file.name);

                    let deleteButton = $("<button>")
                        .addClass("btn btn-danger btn-md rounded-circle")
                        .css({ "width": "35px", "height": "35px", "font-size": "18px", "padding": "5px" })
                        .html("&times;")
                        .on("click", function () {
                            selectedFiles.splice(index, 1); // 移除檔案
                            updateFileInput();
                            updateFileList();
                        });

                    listItem.append(deleteButton);
                    fileList.append(listItem);
                });
            }

            function updateFileInput() {
                let dataTransfer = new DataTransfer();
                selectedFiles.forEach(file => dataTransfer.items.add(file));
                $("#attachment")[0].files = dataTransfer.files;
            }
        });

    </script>
</body>

</html>
