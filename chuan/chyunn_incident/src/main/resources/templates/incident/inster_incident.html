<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
	<meta charset="UTF-8">
	<title>群運事件問題-新增事件</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
	<div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
	<style>
		.table th {
			text-align: left;
			/* 水平居中 */
			vertical-align: middle;
			/* 垂直居中 */
			width: 120px;
			/* 固定寬度，可根據需要調整 */
			white-space: nowrap;
			/* 防止文字換行 */
		}

		.table td {
			vertical-align: middle;
			/* 垂直居中 */
		}

		.tbody th {
			text-align: left;
			/* 標題內容居中 */
			width: 120px;
			/* 固定寬度，可根據需要調整 */
			white-space: nowrap;
			/* 防止文字換行 */
			padding-top: 11px;
			/* 只影響 th 的上邊距 */
		}

		.flatpickr-input {
			background-color: #fff !important;
			color: #000 !important;
		}

		.custom-btn {
			background-color: #1ab394;
			border-color: #1ab394;
			color: white;
		}

		.custom-btn:hover {
			color: white;
			/* 字體保持白色 */
			text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
			/* 發光效果 */
			background-color: #18a383;
			/* 懸停時略微變化背景色 */
			border-color: #18a383;
		}

		/* 設定 CKEditor 的編輯區域高度 */
		.ck-editor__editable {
			min-height: 400px !important;
			/* 讓編輯區至少有 400px 高 */
		}
	</style>
</head>

<body>
	<div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
	<!-- <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div> -->
	<!-- Content Start -->
	<div class="content" style="width: auto; margin-top: 100px;">
		<div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
		<form id="insterIncident">
			<table class="table table-bordered text-dark" style="border-color: #ddd; ">
				<thead class="bg-secondary text-white"> <!-- 標題背景色 -->
					<tr>
						<th colspan="4" class="text-left">新增事件</th>
					</tr>
				</thead>
				<tbody class="tbody">
					<tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
						<th>歸屬</th>
						<td style="width: 400px;">
							<select id="belongingType" name="belongingType" class="form-select  text-dark" required
								style="width: 170px;">
								<!-- 預設選項，根據條件加上 `selected` -->
								<option value="內部">內部</option>
								<option value="外部">外部</option>
							</select>
						</td>
						<th>製表人</th>
						<td>
							<input type="text" class="form-control text-dark" id="creator"
								style="width: 170px; background-color: #fff;" readonly />
						</td>
					</tr>
					<tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
						<th>事件相關客戶</th>
						<td><input type="text" class="form-control text-dark" id="customer" style="width: 170px;"
								value="" />
						</td>
						<th>事件相關車輛</th>
						<td><input type="text" class="form-control text-dark" id="car" style="width: 170px;" value="" />
						</td>
					</tr>
					<tr>
						<th>反應日期</th>
						<td><input type="date" class="form-control text-dark" id="reportDate" style="width: 170px;" />
						</td>
						<th>反應人</th>
						<td>
							<input type="text" class="form-control text-dark" id="reporter"
								style="width: 170px; background-color: #fff;" value="" />
						</td>
					</tr>
					<tr>
						<th>工作事項</th>
						<td><select id="task" name="task" class="form-select text-dark" required style="width: 170px;">
								<option value="需要業務接洽">需要業務接洽</option>
								<option value="需要服務人員接洽">需要服務人員接洽
								</option>
								<option value="需要工務部處理">需要工務部處理
								</option>
								<option value="需要資訊部處理">需要資訊部處理
								</option>
								<option value="上級長官指示處理">上級長官指示處理
								</option>
								<option value="其他不明確事件">其他不明確事件
								</option>
								<option value="系統測試用">系統測試用</option>
							</select></td>
						<th>重要性</th>
						<td><select id="importance" name="importance" class="form-select  text-dark" required
								style="width: 170px;">
								<option value="普通">普通</option>
								<option value="重要">重要</option>
								<option value="急件">急件</option>
								<option value="特急件">特急件</option>
							</select></td>
					</tr>
					<tr style="background-color: #f9f9f9;">
						<th>處理部門/處理人</th>
						<td>
							<select name="department" class="form-select text-dark d-inline" style="width: 170px;"
								id="department">
								<option value="工務部">工務部</option>
								<option value="行政部">行政部</option>
								<option value="資訊部">資訊部</option>
								<option value="營業部">營業部</option>
								<option value="財會部">財會部</option>
								<option value="稽核部">稽核部</option>
								<option value="土資">土資</option>
							</select>
							<input type="text" class="form-control text-dark d-inline" id="handler"
								style="width: 170px; background-color: #fff;" value="" />
						</td>
						<th>處理狀態</th>
						<td> <select class="form-select text-dark" id="status" style="width: 170px;">
								<option value="未開始">未開始</option>
								<option value="待處理">待處理</option>
								<option value="處理中">處理中</option>
								<!-- <option value="已轉交他人">已轉交他人</option> -->
								<option value="延期">延期</option>
								<option value="待結案(待收款)">待結案(待收款)</option>
								<option value="退件">退件</option>
								<option value="已結案">已結案</option>
							</select></td>
					</tr>
					<tr>
						<th>事件主旨</th>
						<td colspan="3"><input type="text" class="form-control text-dark" id="eventPurpose"
								style="width: 690px; background-color: #fff;" placeholder="請輸入事件主旨" /></td>
					</tr>
					<tr>
						<th>事件內容</th>
						<td colspan="3">
							<textarea id="eventContent" class="form-control text-dark" style="color: black;"
								placeholder="請輸入事件內容">
							</textarea>
							<span id="eventContent-error"></span> <!-- 錯誤訊息顯示區域 -->
						</td>
					</tr>
					<tr>
						<th>上傳附件(限制10MB)</th>
						<td colspan="3">
							<small class="text-muted"> 可上傳 Microsoft Office 文件（Word, Excel,
								PowerPoint）、PDF、圖片（JPG/PNG）、壓縮檔（ZIP/RAR），單檔最大 10MB</small>
							<input type="file" id="attachment" class="form-control text-dark" multiple
								accept=".doc, .docx, .xls, .xlsx, .ppt, .pptx, .pdf, .jpg, .jpeg, .png, .zip, .rar">
							<div class="mt-2">
								<ul id="fileList" class="list-group"></ul> <!-- 檔案名稱顯示區域 -->
							</div>
						</td>
					</tr>
				</tbody>
			</table>

			<div>
				<button class="btn btn-secondary btn-sm" id="returnButton">返回</button>
				<button id="submit" type="submit" class="btn btn-sm custom-btn">新增事件</button>
			</div>
		</form>
	</div>

	<!-- Footer --><!-- Back to Top -->
	<div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
	<!-- scriptNavbar -->
	<div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
	<div th:replace="~{backStageNavbar/ckeditor}"></div>
	<script>

		var dateStartPicker = flatpickr("#reportDate", {
			dateFormat: "Y-m-d",
			defaultDate: [new Date()],
		});

		$(document).ready(function () {
			$('#returnButton').click(function () {
				event.preventDefault()
				window.location.href = '/chyunn/incident/select_incident';
			});
			//新增事件AJAX	
			$("#submit").click(function (event) {

				//取消預設動作
				event.preventDefault();
				var form = document.getElementById('insterIncident');
				// 手動驗證表單
				if (form.checkValidity()) {
					let eventContent = '';
					// ✅ 確保 CKEditor 初始化成功後，才能讀取內容
					if (window.editorInstance) {
						eventContent = window.editorInstance.getData().trim(); // ✅ 取得 CKEditor 內的內容
						console.log(eventContent)
					} else {
						console.error("CKEditor 尚未初始化");
					}

					//創一個formData裝incident、附件
					const formData = new FormData();
					// 附件處理
					let files = $("#attachment")[0].files;
					for (let i = 0; i < files.length; i++) {
						formData.append("files", files[i]);
					}

					const incident = {
						customer: $("#customer").val(),
						car: $("#car").val(),
						belongingType: $("#belongingType").val(),
						status: $("#status").val(),
						reporter: $("#reporter").val(),
						task: $("#task").val(),
						eventPurpose: $("#eventPurpose").val(),
						eventContent: eventContent,
						importance: $("#importance").val(),
						department: $("#department").val(),
						handler: $("#handler").val(),
						reportDate: $("#reportDate").val(),
						creator: $("#creator").val(),
					};
					const token = localStorage.getItem('authToken');  // 從 localStorage 獲取 token
					formData.append("incidentJson", JSON.stringify(incident));
					$.ajax({
						url: "/chyunn/incident/inster_incident",
						type: "POST",
						data: formData,
						headers: {
							'Authorization': token
						},
						processData: false, //防止jquery將data變成query String(查詢字串)
						contentType: false, // 不要設置內容類型，讓瀏覽器自動設置
						success: function (response) {
							if (response.code === 200) {
								Swal.fire({
									icon: 'success',
									title: '上傳成功！',
									showCancelButton: false,
								}).then((result) => {
									window.location.href = "/chyunn/incident/incident_Detail?incidentId=" + response.data.incident.incidentId;
								})
							} else {
								Swal.fire({
									icon: "error",
									title: "Oops...",
									text: "上傳失敗",
								});
							}
						},
						error: function (xhr, status, error) {
							// 處理後端返回的錯誤
							let errorMessage = "上傳失敗";  // 預設錯誤訊息
							// 當收到 400 錯誤時，解析後端錯誤訊息
							if (xhr.status === 400) {
								try {
									let errorResponse = JSON.parse(xhr.responseText);
									if (errorResponse.message) {
										errorMessage = errorResponse.message;  // 顯示後端返回的錯誤消息
									}
								} catch (e) {
									console.log("無法解析錯誤響應");
								}
							}
							if (xhr.status === 401) {
								localStorage.removeItem('authToken');
								window.location.href = "/chyunn/login"; // 跳轉到登入頁
							}
							// 顯示 SweetAlert 提示框
							Swal.fire({
								icon: "error",
								title: "Oops...",
								text: errorMessage,
							});
						}
					});
				} else {
					console.log("表單驗證失敗，不能提交");
					// 如果表單無效，強制觸發瀏覽器的驗證提示 開啟required功能
					form.reportValidity();
				}
			});

			// 上傳附件的UI
			let selectedFiles = []; // 存儲已選擇的檔案
			$("#attachment").on("change", function (event) {
				let fileList = $("#fileList");
				fileList.empty(); // 清空列表
				selectedFiles = Array.from(event.target.files); // 轉成陣列

				updateFileList();
			});

			function updateFileList() {
				let fileList = $("#fileList");
				fileList.empty();

				$.each(selectedFiles, function (index, file) {
					let listItem = $("<li>")
						.addClass("list-group-item d-flex justify-content-between align-items-center")
						.text(file.name);

					let deleteButton = $("<button>")
						.addClass("btn btn-danger btn-md rounded-circle")
						.css({ "width": "35px", "height": "35px", "font-size": "18px", "padding": "5px" })
						.html("&times;")
						.on("click", function () {
							selectedFiles.splice(index, 1); // 移除檔案
							updateFileInput();
							updateFileList();
						});

					listItem.append(deleteButton);
					fileList.append(listItem);
				});
			}

			function updateFileInput() {
				let dataTransfer = new DataTransfer();
				selectedFiles.forEach(file => dataTransfer.items.add(file));
				$("#attachment")[0].files = dataTransfer.files;
			}
		});

	</script>
</body>

</html>
