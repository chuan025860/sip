<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
	<meta charset="UTF-8">
	<title>群運事件問題-新增事件</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
	<style>
		.table th {
			text-align: left;
			/* 標題內容居中 */
			width: 120px;
			/* 固定寬度，可根據需要調整 */
			white-space: nowrap;
			/* 防止文字換行 */
		}

		.flatpickr-input {
			background-color: #fff !important;
			color: #000 !important;
		}

		.custom-btn {
			background-color: #1ab394;
			border-color: #1ab394;
			color: white;
			width: 80px;
			height: 35px;
		}

		.custom-btn:hover {
			color: white;
			/* 字體保持白色 */
			text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
			/* 發光效果 */
			background-color: #18a383;
			/* 懸停時略微變化背景色 */
			border-color: #18a383;
		}
	</style>
</head>

<body>
	<div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
	<!-- Content Start -->
	<div class="content">
		<div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
		<form id="insterIncident">
			<table class="table table-bordered text-dark" style="border-color: #ddd; ">
				<!-- 加入邊框 -->
				<thead class="bg-secondary text-white"> <!-- 標題背景色 -->
					<tr>
						<th colspan="4" class="text-left">新增事件</th>
					</tr>
				</thead>
				<tbody>
					<tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
						<th>歸屬</th>
						<td style="width: 400px;">
							<select id="belongingType" name="belongingType" class="form-select  text-dark" required
								style="width: 170px;">
								<!-- 預設選項，根據條件加上 `selected` -->
								<option value="內部">內部</option>
								<option value="外部">外部</option>
							</select>
						</td>
					</tr>
					<tr style="background-color: #f9f9f9;"> <!-- 淡灰底色 -->
						<th>事件相關客戶</th>
						<td><input type="text" class="form-control text-dark" id="customer" style="width: 170px;"
								value="customer" />
						</td>
						<th>事件相關車輛</th>
						<td><input type="text" class="form-control text-dark" id="car" style="width: 170px;"
								value="car" />
						</td>
					</tr>
					<tr>
						<th>反應日期</th>
						<td><input type="date" class="form-control text-dark" id="reportDate" style="width: 170px;" />
						</td>
					</tr>
					<tr style="background-color: #f9f9f9;">
						<th>反應人</th>
						<td>
							<input type="text" class="form-control text-dark" id="reporter"
								style="width: 170px; background-color: #fff;" th:value="${session.loginID}" readonly />
						</td>
					</tr>
					<tr>
						<th>工作事項</th>
						<td><select id="task" name="task" class="form-select text-dark" required style="width: 170px;">
								<option value="需要業務接洽">需要業務接洽</option>
								<option value="需要服務人員接洽">需要服務人員接洽
								</option>
								<option value="需要工務部處理">需要工務部處理
								</option>
								<option value="需要資訊部處理">需要資訊部處理
								</option>
								<option value="上級長官指示處理">上級長官指示處理
								</option>
								<option value="其他不明確事件">其他不明確事件
								</option>
								<option value="系統測試用">系統測試用</option>
							</select></td>
						<th>重要性</th>
						<td><select id="importance" name="importance" class="form-select  text-dark" required
								style="width: 170px;">
								<option value="特急件">特急件</option>
								<option value="急件">急件</option>
								<option value="重要">重要</option>
								<option value="普通">普通</option>
							</select></td>
					</tr>
					<tr style="background-color: #f9f9f9;">
						<th>處理部門/處理人</th>
						<td>
							<select name="department" class="form-select text-dark" text-dark style="width: 170px;"
								id="department">
								<option value="工務部">工務部</option>
								<option value="行政部">行政部</option>
								<option value="資訊部">資訊部</option>
								<option value="營業部">營業部</option>
								<option value="財會部">財會部</option>
								<option value="稽核部">稽核部</option>
								<option value="土資">土資</option>
							</select>
							<select name="handler" class="form-select text-dark" text-dark style="width: 170px;"
								id="handler">
								<option value="處理人1">處理人1</option>
								<option value="處理人2">處理人2</option>
								<option value="處理人3">處理人3</option>
							</select>
						</td>
						<th>處理狀態</th>
						<td> <select class="form-select text-dark" id="status" style="width: 170px;">
								<option value="未開始">未開始</option>
								<option value="待處理">待處理</option>
								<option value="處理中">處理中</option>
								<option value="已轉交他人">已轉交他人</option>
								<option value="延期">延期</option>
								<option value="待結案">待結案</option>
								<option value="退件">退件</option>
								<option value="已結案">已結案</option>
							</select></td>
					</tr>
					<tr>
						<th>事件內容</th>
						<td colspan="3">
							<textarea id="eventContent" class="form-control event-content-textarea text-dark"
								style="height: 200px;"></textarea>
						</td>

					</tr>
				</tbody>
			</table>
			<button id="submit" type="submit" class="btn btn-sm custom-btn">新增事件</button>
		</form>
	</div>

	<!-- Footer --><!-- Back to Top -->
	<div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
	<!-- scriptNavbar -->
	<div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
	<script>
		var dateStartPicker = flatpickr("#reportDate", {
			dateFormat: "Y-m-d",
			defaultDate: [new Date()],
		});

		$(document).ready(function () {
			$("#submit").click(function (event) {
				//取消預設動作
				event.preventDefault();
				var form = document.getElementById('insterIncident');
				// 手動驗證表單
				if (form.checkValidity()) {
					// 創建要傳遞的物件
					const incident = {
						customer: $("#customer").val(),
						car: $("#car").val(),
						belongingType: $("#belongingType").val(),
						reporter: $("#reporter").val(),
						task: $("#task").val(),
						eventContent: $("#eventContent").val(),
						importance: $("#importance").val(),
						department: $("#department").val(),
						handler: $("#handler").val(),
						reportDate: $("#reportDate").val(),
					};
					$.ajax({
						url: "/chyunn/incident/inster_incident",
						type: "POST",
						data: JSON.stringify(incident), // 將 incident 物件轉換成 JSON 格式
						contentType: "application/json", // 設置 contentType 為 application/json
						processData: false, // 防止 jQuery 自動處理 data
						headers: {
							'X-CSRF-TOKEN': $('input[name=_csrf]').val()
						},
						success: function (response) {

							if (response.code === 200) {
								Swal.fire({
									icon: 'success',
									title: '上傳成功！',
									showCancelButton: false,
								}).then((result) => {
									window.location.href = "/chyunn/incident/incident_Detail?incidentId=" + response.data.incident.incidentId;
								})
							} else {
								Swal.fire({
									icon: "error",
									title: "Oops...",
								});
							}
						},
						error: function () {
							console.log("上傳失敗");
							Swal.fire({
								icon: "error",
								title: "Oops...",
								text: "請填入完整資料、圖片",
							});
						}
					});
				} else {
					console.log("表單驗證失敗，不能提交");
					// 如果表單無效，強制觸發瀏覽器的驗證提示 開啟required功能
					form.reportValidity();
				}
			});
		});
	</script>
</body>

</html>
