<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運事件問題-編輯事件</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>

    <style>
        .table th {
            text-align: left;
            /* 標題內容居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
        }


        .event-content-textarea {
            width: 100%;
            /* 填滿 td */
            height: 120px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-td {
            width: 50%;
            /* 填滿 td */
            height: 80px;
            /* 自動調整高度 */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .event-content-date {
            width: 100%;
            /* 填滿 td */
            word-wrap: break-word;
            /* 長字自動換行 */
            overflow-wrap: break-word;
            /* 更強的兼容性 */
        }

        .form-control.select {
            background-color: white;
        }

        .custom-btn {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        .custom-btn:hover {
            color: white;
            /* 字體保持白色 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            /* 發光效果 */
            background-color: #18a383;
            /* 懸停時略微變化背景色 */
            border-color: #18a383;
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <!-- Content Start -->
    <div class="content">
        <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
        <div class="cotainer-fluid pt-4 px-4 fs-6 fw-bold ">
            <div class="bg-light rounded p-4">
                <table class="table text-dark">
                    <tr>
                        <th>事件編號 incidentId </th>
                        <td th:text="${incidentDto.incidentId}" id="incidentId"></td>
                    </tr>
                    <tr>
                        <th>歸屬 belongingType </th>
                        <td>
                            <select id="belongingType" name="belongingType" class="form-select  text-dark" required
                                style="width: 170px;">
                                <!-- 預設選項，根據條件加上 `selected` -->
                                <option value="內部" th:selected="${incidentDto.belongingType == '內部'}">內部</option>
                                <option value="外部" th:selected="${incidentDto.belongingType == '外部'}">外部</option>
                            </select>
                        </td>
                        <!-- <td th:text="${incidentDto.belongingType}"></td> -->
                    </tr>
                    <tr>
                        <th>反應人 reporter </th>
                        <td><input type="text" th:value="${incidentDto.reporter}" class="form-control text-dark"
                                id="reporter" style="width: 170px;" /></td>
                        <!-- <td th:text="${incidentDto.reporter}"></td> -->
                    </tr>
                    <tr>
                        <th>工作事項 task </th>
                        <td><select id="task" name="task" class="form-select text-dark" required style="width: 170px;">
                                <option value="需要業務接洽" th:selected="${incidentDto.task == '需要業務接洽'}">需要業務接洽</option>
                                <option value="需要服務人員接洽" th:selected="${incidentDto.task == '需要服務人員接洽'}">需要服務人員接洽
                                </option>
                                <option value="需要工務部處理" th:selected="${incidentDto.task == '需要工務部處理'}">需要工務部處理</option>
                                <option value="需要資訊部處理" th:selected="${incidentDto.task == '需要資訊部處理'}">需要資訊部處理</option>
                                <option value="上級長官指示處理" th:selected="${incidentDto.task == '上級長官指示處理'}">上級長官指示處理
                                </option>
                                <option value="其他不明確事件" th:selected="${incidentDto.task == '其他不明確事件'}">其他不明確事件</option>
                                <option value="系統測試用" th:selected="${incidentDto.task == '系統測試用'}">系統測試用</option>
                            </select></td>
                        <!-- <td th:text="${incidentDto.task}"></td> -->
                    </tr>
                    <tr>
                        <th>回報數 reportCount </th>
                        <td th:text="${incidentDto.reportCount}"></td>
                    </tr>
                    <tr>
                        <th>重要性 importance </th>
                        <td><select id="importance" name="importance" class="form-select  text-dark" required
                                style="width: 170px;">
                                <option value="特急件" th:selected="${incidentDto.importance == '特急件'}">特急件</option>
                                <option value="急件" th:selected="${incidentDto.importance == '急件'}">急件</option>
                                <option value="重要" th:selected="${incidentDto.importance == '重要'}">重要</option>
                                <option value="普通" th:selected="${incidentDto.importance == '普通'}">普通</option>
                            </select></td>
                        <!-- <td th:text="${incidentDto.importance}"></td> -->
                    </tr>
                    <tr>
                        <th>預設處理部門/處理人 department/handler </th>
                        <td>
                            <select name="department" class="form-select text-dark" text-dark style="width: 170px;"
                                id="department">
                                <option value="工務部" th:selected="${'工務部' == incidentDto.department}">工務部</option>
                                <option value="行政部" th:selected="${'行政部' == incidentDto.department}">行政部</option>
                                <option value="資訊部" th:selected="${'資訊部' == incidentDto.department}">資訊部</option>
                                <option value="營業部" th:selected="${'營業部' == incidentDto.department}">營業部</option>
                                <option value="財會部" th:selected="${'財會部' == incidentDto.department}">財會部</option>
                                <option value="稽核部" th:selected="${'稽核部' == incidentDto.department}">稽核部</option>
                                <option value="土資" th:selected="${'土資' == incidentDto.department}">土資</option>
                            </select>
                            <select name="handler" class="form-select text-dark" text-dark style="width: 170px;"
                                id="handler">
                                <option value="處理人1" th:selected="${'處理人1' == incidentDto.handler}">處理人1</option>
                                <option value="處理人2" th:selected="${'處理人2' == incidentDto.handler}">處理人2</option>
                                <option value="處理人3" th:selected="${'處理人3' == incidentDto.handler}">處理人3</option>
                            </select>
                        </td>
                        <!-- <td th:text="${incidentDto.department + ' / ' + incidentDto.handler}"></td> -->
                    </tr>
                    <tr>
                        <th>處理狀態 status </th>
                        <td> <select class="form-control select text-dark" id="status" style="width: 170px;">
                                <option value="未開始" th:selected="${'未開始' == incidentDto.status}">未開始</option>
                                <option value="待處理" th:selected="${'待處理' == incidentDto.status}">待處理</option>
                                <option value="處理中" th:selected="${'處理中' == incidentDto.status}">處理中</option>
                                <option value="已轉交他人" th:selected="${'已轉交他人' == incidentDto.status}">已轉交他人</option>
                                <option value="延期" th:selected="${'延期' == incidentDto.status}">延期</option>
                                <option value="待結案" th:selected="${'待結案' == incidentDto.status}">待結案</option>
                                <option value="退件" th:selected="${'退件' == incidentDto.status}">退件</option>
                                <option value="已結案" th:selected="${'已結案' == incidentDto.status}">已結案</option>
                            </select></td>
                        <!-- <td th:text="${incidentDto.status}"></td> -->
                    </tr>
                    <tr>
                        <th>最後回報時間 lastReportTime </th>
                        <td th:text="${incidentDto.lastReportTime}"></td>
                    </tr>
                    <tr>
                        <th>反應日期 reportDate </th>
                        <td><input type="date" th:value="${incidentDto.reportDate}" class="form-control text-dark"
                                id="reportDate" style="width: 170px;" /></td>
                        <!-- <td th:text="${incidentDto.reportDate}"></td> -->
                    </tr>
                    <tr>
                        <th>事件內容 eventContent </th>
                        <td>
                            <textarea th:text="${incidentDto.eventContent}" id="eventContent"
                                class="form-control event-content-textarea text-dark"></textarea>
                        </td>
                    </tr>
                    <!-- <tr>
                        <th>事件內容 eventContent </th>
                        <td th:text="${incidentDto.eventContent}"></td>
                    </tr> -->

                </table>
                <table class="table text-dark">
                    <thead>
                        <tr>
                            <th style="text-align: center;">回報時間</th>
                            <th style="text-align: center;">回報人</th>
                            <th style="text-align: center;">處理進度</th>
                            <th style="text-align: center;">執行日期</th>
                            <th style="text-align: center;">執行人</th>
                            <th style="text-align: center;">內容</th>
                            <th>操作</th>
                            <th>上傳附件</th>
                        </tr>
                    </thead>
                    <tbody id="report-tbody">
                        <tr th:if="${#lists.isEmpty(incidentDto.reports)}">
                            <td> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td style="text-align: center;"> </td>
                            <td class="event-content-td">
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr th:each="report : ${incidentDto.reports}" th:id="'report-row-' + ${report.reportId}">
                            <td th:text="${report.reportTimeString}" style="text-align: center;"></td>
                            <input type="hidden" th:value="${report.reportId}" id="reportId">
                            <input type="hidden" th:value="${report.reportTime}" id="reportTime">
                            <td style="text-align: center;">
                                <select class="form-control select text-dark" id="reporter">
                                    <option value="回報人1" th:selected="${'回報人1' == report.reporter}">回報人1</option>
                                    <option value="回報人2" th:selected="${'回報人2' == report.reporter}">回報人2</option>
                                    <option value="回報人3" th:selected="${'回報人3' == report.reporter}">回報人3</option>
                                </select>
                            </td>
                            <td style="text-align: center;">
                                <select class="form-control select text-dark" id="progress">
                                    <option value="未開始" th:selected="${'未開始' == report.progress}">未開始</option>
                                    <option value="待處理" th:selected="${'待處理' == report.progress}">待處理</option>
                                    <option value="處理中" th:selected="${'處理中' == report.progress}">處理中</option>
                                    <option value="已轉交他人" th:selected="${'已轉交他人' == report.progress}">已轉交他人</option>
                                    <option value="延期" th:selected="${'延期' == report.progress}">延期</option>
                                    <option value="待結案" th:selected="${'待結案' == report.progress}">待結案</option>
                                    <option value="退件" th:selected="${'退件' == report.progress}">退件</option>
                                    <option value="已結案" th:selected="${'已結案' == report.progress}">已結案</option>
                                </select>
                            </td>
                            <td style="text-align: center;">
                                <input type="date" th:value="${report.executionDateString}"
                                    class="form-control text-dark" />
                            </td>
                            <td style="text-align: center;">
                                <select class="form-control select text-dark" id="executor">
                                    <option value="執行人1" th:selected="${'執行人1' == report.executor}">執行人1</option>
                                    <option value="執行人2" th:selected="${'執行人2' == report.executor}">執行人2</option>
                                    <option value="執行人3" th:selected="${'執行人3' == report.executor}">執行人3</option>
                                </select>
                            </td>
                            <td class="event-content-td">
                                <textarea class="form-control event-content-textarea text-dark" placeholder="內容"
                                    id="content" th:text="${report.content}"></textarea>
                            </td>
                            <td>
                                <button class="btn btn-danger btn-sm delete-btn"
                                    th:data-id="${report.reportId}">刪除</button>
                            </td>
                            <td>上傳附件</td>
                        </tr>
                    </tbody>
                </table>
                <!-- 新增按鈕 -->
                <button class="btn btn-sm custom-btn" onclick="addReportRow()">回報事件</button>
                <button class="btn btn-sm btn-primary" id="update">點擊更新事件</button>
                <button class="btn btn-danger btn-sm" id="deleteIncident">刪除</button>

            </div>
        </div>
    </div>
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>
        function addReportRow() {
            const tbody = document.getElementById("report-tbody");
            const newRow = document.createElement("tr");

            newRow.innerHTML = `
            <td></td>
            <td>
            <select class="form-control select text-dark" id="reporter">
                <option value="select">請選擇</option>
                <option value="回報人1">回報人1</option>
                <option value="回報人2">回報人2</option>
                <option value="回報人3">回報人3</option>
                <option value="回報人4">回報人4</option>
                <option value="回報人5">回報人5</option>
            </select>
            </td>
            <td> 
                <select class="form-control select text-dark" id="progress">
                <option value="select">請選擇</option>
                <option value="未開始">未開始</option>
                <option value="待處理">待處理</option>
                <option value="處理中">處理中</option>
                <option value="已轉交他人">已轉交他人</option>
                <option value="延期">延期</option>
                <option value="待結案">待結案</option>
                <option value="退件">退件</option>
                <option value="已結案">已結案</option>
                </select></td>
            <td><input type="date" class="form-control event-content-date" id="executionDate" /></td>
            <td>
                <select class="form-control select text-dark" id="executor">
                <option value="select">請選擇</option>
                <option value="執行人1">執行人1</option>
                <option value="執行人2">執行人2</option>
                <option value="執行人3">執行人3</option>
                </select>
            </td>
            <td><textarea class="form-control event-content-textarea" placeholder="內容" id="content"></textarea></td>
            <td>
                <div>
                <button class="btn btn-primary btn-sm mb-1" id="uploadButton">上傳</button>
                </div>
                <div>
                <button class="btn btn-danger btn-sm" onclick="removeRow(this)">刪除</button>
                </div>
            <td><input type="file" class="form-control" /></td>
        `;
            tbody.appendChild(newRow);
        }

        function removeRow(button) {
            const row = button.closest('tr'); // 找到按鈕所在的 <tr>
            row.remove(); // 移除該行
        }
        $(document).ready(function () {
            // 綁定動態元素的事件
            $(document).on("click", "#uploadButton", function () {
                console.log("enter");
                // 收集資料
                var reporter = $(this).closest('tr').find('#reporter').val();
                console.log(reporter + "test");
                var progress = $(this).closest('tr').find('#progress').val();
                var executionDate = $(this).closest('tr').find('#executionDate').val();
                var executor = $(this).closest('tr').find('#executor').val();
                var content = $(this).closest('tr').find('#content').val();
                // var fileInput = $(this).closest('tr').find('#fileInput')[0].files[0];
                // 檢查必填欄位
                if (reporter == "select" || progress == "select") {
                    Swal.fire({
                        icon: "error",
                        title: "Oops...",
                        text: "請選擇必要欄位",
                    });
                    return;
                }

                // 封裝成物件
                var formDataObject = {
                    incidentId: $("#incidentId").text(),
                    reporter: reporter,
                    progress: progress,
                    executionDate: executionDate,
                    executor: executor,
                    content: content
                };
                console.log(formDataObject);
                // 使用 AJAX 發送資料
                $.ajax({
                    url: '/chyunn/incident/incident_inster_report',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(formDataObject),
                    success: function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: '上傳成功！',
                            showCancelButton: false,
                        }).then((result) => {
                            location.reload();
                        })
                    },
                    error: function (error) {
                        Swal.fire({
                            icon: "error",
                            title: "Oops...",
                            text: "上傳失敗",
                        });
                        console.error(error);
                    }
                });
            });


            $(document).on('click', '.delete-btn', function () {
                var reportId = $(this).data('id');  // 獲取報告的 ID
                console.log(reportId)
                Swal.fire({
                    title: "確定要刪除?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "刪除"
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/chyunn/incident/incident_delete_report',
                            type: 'DELETE',
                            data: {
                                reportId: reportId,
                                incidentId: $("#incidentId").text()
                            },
                            success: function (response) {
                                console.log(response)
                                Swal.fire({
                                    title: "Deleted!",
                                    text: "deleted. success",
                                    icon: "success"
                                }).then((result) => {
                                    location.reload();
                                });
                            },
                            error: function (error) {
                                console.log(error)
                                Swal.fire({
                                    icon: "error",
                                    title: "Oops...",
                                    text: "刪除失敗",
                                });
                            }
                        });

                    }
                });
            });

            document.getElementById("update").addEventListener("click", function () {
                // 構建請求的數據對象
                const incidentId = document.getElementById("incidentId").innerText;
                const belongingType = document.getElementById("belongingType").value;
                const reporter = document.getElementById("reporter").value;
                const task = document.getElementById("task").value;
                const importance = document.getElementById("importance").value;
                const department = document.getElementById("department").value;;
                const handler = document.getElementById("handler").value;;
                const status = document.getElementById("status").value;
                const reportDate = document.getElementById("reportDate").value;
                const eventContent = document.getElementById("eventContent").value;

                // 收集報告數據
                const reports = [];

                document.querySelectorAll("#report-tbody tr").forEach((row, index) => {
                    const reportId = row.querySelector("#reportId")?.value;
                    const reporter = row.querySelector("#reporter")?.value;
                    const progress = row.querySelector("#progress")?.value;
                    const executionDate = row.querySelector("input[type='date']")?.value;
                    const executor = row.querySelector("#executor")?.value;
                    const content = row.querySelector("textarea#content")?.value;
                    const reportTime = row.querySelector("#reportTime")?.value;
                    reports.push({
                        reportId: reportId,
                        reporter: reporter,
                        progress: progress,
                        executionDate: executionDate,
                        executor: executor,
                        content: content,
                        reportTime: reportTime
                    });
                });

                // 將所有數據組裝為 JSON
                const requestData = {
                    incidentId,
                    belongingType,
                    reporter,
                    task,
                    importance,
                    department,
                    handler,
                    status,
                    reportDate,
                    eventContent,
                    reports
                };
                console.log(requestData)
                $.ajax({
                    url: '/chyunn/incident/incident_update_all',
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(requestData),
                    success: function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: '更新成功！',
                            showCancelButton: false,
                        }).then((result) => {
                            location.reload();
                        })
                    },
                    error: function (error) {
                        Swal.fire({
                            icon: "error",
                            title: "Oops...",
                            text: "上傳失敗",
                        });
                        console.error(error);
                    }
                });
            });

            $("#deleteIncident").click(function (event) {
                //取消預設動作
                event.preventDefault();
                Swal.fire({
                    title: "確定要刪除?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "刪除"
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/chyunn/incident/incident_delete',
                            type: 'DELETE',
                            data: {
                                incidentId: $("#incidentId").text()
                            },
                            success: function (response) {
                                if (response.code === 200) {
                                    // 刪除成功後，移除對應的行
                                    Swal.fire({
                                        icon: 'success',
                                        title: '刪除成功！',
                                        showCancelButton: false,
                                    }).then((result) => {
                                        window.location.href = '/chyunn/incident/select_incident';
                                    });
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: '刪除失敗',
                                        text: response.message || '發生錯誤，請稍後再試。',
                                    });
                                }
                            },
                            error: function (xhr, status, error) {
                                Swal.fire({
                                    icon: 'error',
                                    title: '請求失敗',
                                    text: '發生錯誤，請稍後再試。',
                                });
                            }
                        });
                    }
                })
            });
        });

    </script>
</body>

</html>
