<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-行事曆</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* === 標題區（Title）樣式 === */
        .fc-toolbar-title {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* === 工具列排版優化（Header Toolbar）=== */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .fc-toolbar-chunk:first-child {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            /* prev/next 與 title 間距 */
            white-space: nowrap;
            /* 防止 title 換行 */
        }

        /* === 工具列按鈕樣式 === */
        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        .fc-button:hover {
            background-color: #555555;
            border-color: #555555;
        }

        /* === 事件樣式 === */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        /* === 當天樣式 === */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* === 邊框樣式統一 === */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* === 超連結與日期字色（統一綠色）=== */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        /* 整個 flatpickr 日曆區塊背景 */
        .flatpickr-calendar {
            background-color: #ffffff;
            border: 1px solid #d9f3ed;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 全站預設內文字 */
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            color: #333;
        }

        /* 標題區塊 */
        .calendar-header h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #2c3e50;
            margin: 0;
        }

        /* FullCalendar 整體字體 */
        #calendar {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 工具列標題 */
        .fc .fc-toolbar-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.25rem;
        }

        /* 星期欄位 */
        .fc .fc-col-header-cell-cushion {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 時間格子標籤 */
        .fc .fc-timegrid-slot-label-cushion {
            font-size: 0.875rem;
            font-weight: 400;
        }
    </style>
</head>

        </div>

    <script>
        let originalEvents = [];    // 存放從後端抓回來的完整事件清單
        let calendar;               // FullCalendar 實例

        document.addEventListener('DOMContentLoaded', () => {
            loadEventsFromServer();
        });
        function loadEventsFromServer() {
            $.ajax({
                url: '/chyunn/resource/events',
                method: 'POST',
                dataType: 'json',
                success: res => {
                    originalEvents = res.data;
                    initCalendar();            // 不帶參數，事件在 initCalendar 裡透過 filter 來決定
                },
                error: xhr => console.error('載入行事曆事件失敗', xhr)
            });
        }
        function initCalendar() {
            var calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-tw',
                initialView: 'timeGridWeek',
                height: 'auto',
                slotMinTime: '08:00:00',
                slotMaxTime: '24:00:00',
                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                allDayText: '全天',
                headerToolbar: {
                    start: 'title resourceAddBtn createEventBtn',
                    center: '',
                    end: 'displaySettingsBtn dayGridMonth,timeGridWeek,timeGridDay prev,next'
                },
                customButtons: {
                    createEventBtn: {
                        text: '新增行事曆',
                        click: function () {
                            Swal.fire({
                                icon: 'success',
                                title: '上傳成功！',
                                showCancelButton: false,
                            });
                        }
                    },
                    resourceAddBtn: {
                        text: '資源借用',
                        click: openResourceModal
                    },
                    displaySettingsBtn: {
                        text: '行事曆顯示設定',
                        click: () => openDisplaySettings(calendar)

                    },
                },
                buttonText: {
                    today: '今天',
                    month: '月',
                    week: '週',
                    day: '日',
                    list: '列表'
                },
                eventDisplay: 'block',
                dayMaxEventRows: true,
                dayMaxEvents: false,
                events: []  // 先不丟，下一行會用 filterEvents()
            });
            calendar.render();

            // 取得 sessionStorage 裡的篩選設定（如果有），並第一次套用
            filterEvents();
        }

        function filterEvents() {
            // 從 sessionStorage 拿上次的設定，若沒有則 selected 為空陣列
            const saved = sessionStorage.getItem('calFilters');
            const selected = saved ? JSON.parse(saved) : [];

            // 若沒任何篩選，就直接顯示所有
            if (selected.length === 0) {
                calendar.setOption('events', originalEvents);
                return;
            }

            const filtered = originalEvents.filter(ev => {
                console.log(ev.creator);
                return selected.includes(ev.owner) ||
                    selected.includes(ev.category);
            });
            calendar.setOption('events', filtered);
        }

                didOpen: () => {
                    // 1. 初始化 syncGroup（父子 checkbox 聯動）
                    const syncGroup = (parentId, childSel) => {
                        const p = document.getElementById(parentId);
                        const children = Array.from(document.querySelectorAll(childSel));
                        p.addEventListener('change', () => {
                            children.forEach(c => { c.checked = p.checked; c.indeterminate = false; });
                        });
                        children.forEach(c => {
                            c.addEventListener('change', () => {
                                const all = children.every(x => x.checked);
                                const none = children.every(x => !x.checked);
                                p.checked = all;
                                p.indeterminate = !(all || none);
                            });
                        });
                    };
                    syncGroup('chk-myroot', '#cal-tree .chk-my');
                    syncGroup('chk-resroot', '#cal-tree .chk-res');

                    // 2. 若 sessionStorage 有舊設定，就把各 checkbox 還原
                    const saved = sessionStorage.getItem('calFilters');
                    if (saved) {
                        const selected = JSON.parse(saved);
                        document.querySelectorAll('#cal-tree .form-check-input').forEach(chk => {
                            if (chk.value) {
                                chk.checked = selected.includes(chk.value);
                            }
                        });
                    }
                },
                preConfirm: () => {
                    // 收集有 value 而且被勾的 checkbox
                    const selected = Array.from(
                        document.querySelectorAll('#cal-tree .form-check-input:checked')
                    )
                        .map(chk => chk.value)
                        .filter(v => v);
                    // 存進 sessionStorage
                    sessionStorage.setItem('calFilters', JSON.stringify(selected));
                    return selected;
                }
            }).then(res => {
                if (res.isConfirmed) {
                    // 套用剛剛儲存好的篩選
                    filterEvents();
                }
            });
        }

        function openResourceModal() {
            const creator = $("#username-h6").text();
            const loginId = $("#loginId").val();

            Swal.fire({
                title: '&nbsp;&nbsp;資源借用申請',
                html: `
                   <div class="container text-start">
            <div class="mb-3">
              <label class="form-label">內容</label>
              <input type="text" id="content" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">時間</label>
              <div class="row">
                <div class="col-md-6 mb-2">
                  <input type="text" id="start-time" class="form-control" placeholder="開始時間">
                </div>
                <div class="col-md-6">
                  <input type="text" id="end-time" class="form-control" placeholder="結束時間">
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">類別</label>
              <select id="category" class="form-select">
                <option value="會議室">會議室</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">項目</label>
              <select id="item" class="form-select">
                <option value="">請選擇</option>
                <option value="群運營運中心一樓小會議室(116)">群運營運中心一樓小會議室(116)</option>
                <option value="群運營運中心二樓洽談室(202)">群運營運中心二樓洽談室(202)</option>
                <option value="群運安明一樓會議室">群運安明一樓會議室</option>
                <option value="群運營運中心二樓交誼廳">群運營運中心二樓交誼廳</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">位置</label>
              <input type="text" id="location" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">備註</label>
              <input type="text" id="note" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">建立者</label>
              <input type="text" class="form-control" value="${creator}" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">參與人員</label>
              <input type="text" id="participants" class="form-control">
            </div>
          </div>
                `,
                allowOutsideClick: false,
                showCloseButton: true,
                allowEscapeKey: false,
                allowEnterKey: false,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '送出',
                cancelButtonText: '取消',
                width: 800,
                customClass: {
                    title: 'text-start w-100 px-4'
                },
                didOpen: () => {
                    flatpickr("#start-time", {
                        enableTime: true,
                        dateFormat: "Y-m-d H:i",
                        time_24hr: true,
                        locale: "zh_tw"
                    });
                    flatpickr("#end-time", {
                        enableTime: true,
                        dateFormat: "Y-m-d H:i",
                        time_24hr: true,
                        locale: "zh_tw"
                    });
                },
                preConfirm: () => {
                    const content = document.getElementById('content').value.trim();
                    const startTime = document.getElementById('start-time').value;
                    const endTime = document.getElementById('end-time').value;
                    const category = document.getElementById('category').value;
                    const item = document.getElementById('item').value;

                    if (!content) {
                        Swal.showValidationMessage('請填寫內容');
                        return false;
                    }
                    if (!startTime || !endTime) {
                        Swal.showValidationMessage('請填寫完整的開始與結束時間');
                        return false;
                    }
                    if (new Date(endTime) < new Date(startTime)) {
                        Swal.showValidationMessage('結束時間不能早於開始時間');
                        return false;
                    }
                    if (!category) {
                        Swal.showValidationMessage('請選擇類別');
                        return false;
                    }
                    if (!item) {
                        Swal.showValidationMessage('請選擇項目');
                        return false;
                    }

                    return {
                        content,
                        startTime,
                        endTime,
                        category,
                        item,
                        location: document.getElementById('location').value,
                        note: document.getElementById('note').value,
                        participants: document.getElementById('participants').value,
                        creator: document.getElementById('loginId').value
                    };
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const data = result.value;
                    console.log('資源申請資料：', data);

                    $.ajax({
                        url: '/chyunn/resource/resource-borrow',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function (res) {
                            Swal.fire('已送出！', '資源借用已提交。', 'success');
                            // Optional: 重新載入日曆資料
                            loadEventsFromServer();
                        },
                        error: function (xhr) {
                            Swal.fire('錯誤', '提交失敗：' + xhr.responseText, 'error');
                        }
                    });
                }
            });
        }
