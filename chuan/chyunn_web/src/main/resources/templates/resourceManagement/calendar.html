<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-行事曆</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* === 標題區（Title）樣式 === */
        .fc-toolbar-title {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* === 工具列排版優化（Header Toolbar）=== */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .fc-toolbar-chunk:first-child {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            /* prev/next 與 title 間距 */
            white-space: nowrap;
            /* 防止 title 換行 */
        }

        /* === 工具列按鈕樣式 === */
        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        .fc-button:hover {
            background-color: #555555;
            border-color: #555555;
        }

        /* === 事件樣式 === */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        /* === 當天樣式 === */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* === 邊框樣式統一 === */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* === 超連結與日期字色（統一綠色）=== */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        /* 整個 flatpickr 日曆區塊背景 */
        .flatpickr-calendar {
            background-color: #ffffff;
            border: 1px solid #d9f3ed;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 全站預設內文字 */
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            color: #333;
        }

        /* 標題區塊 */
        .calendar-header h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #2c3e50;
            margin: 0;
        }

        /* FullCalendar 整體字體 */
        #calendar {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 工具列標題 */
        .fc .fc-toolbar-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.25rem;
        }

        /* 星期欄位 */
        .fc .fc-col-header-cell-cushion {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 時間格子標籤 */
        .fc .fc-timegrid-slot-label-cushion {
            font-size: 0.875rem;
            font-weight: 400;
        }

        .flatpickr-input {
            background-color: #fff !important;

        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">

        <div class="d-flex justify-content-between align-items-center mb-3 calendar-header" style="margin-top: 30px;">
            <h4>行事曆</h4>
        </div>

        <div id="calendar"></div>
    </div>

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>

        let originalEvents = [];    // 存放從後端抓回來的完整事件清單
        let calendar;               // FullCalendar 實例

        document.addEventListener('DOMContentLoaded', () => {
            loadEventsFromServer();
        });
        function loadEventsFromServer() {
            $.ajax({
                url: '/chyunn/resource/events',
                method: 'POST',
                dataType: 'json',
                success: res => {
                    console.log(res.data)
                    originalEvents = res.data;
                    initCalendar();            // 不帶參數，事件在 initCalendar 裡透過 filter 來決定
                },
                error: xhr => console.error('載入行事曆事件失敗', xhr)
            });
        }
        function initCalendar() {
            var calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-tw',
                initialView: 'timeGridWeek',
                height: 'auto',
                slotMinTime: '08:00:00',
                slotMaxTime: '24:00:00',
                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                allDayText: '全天/跨日',
                headerToolbar: {
                    start: 'title resourceAddBtn createEventBtn',
                    center: '',
                    end: 'displaySettingsBtn dayGridMonth,timeGridWeek,timeGridDay prev,next'
                },
                customButtons: {
                    createEventBtn: {
                        text: '新增行事曆',
                        click: function () {
                            Swal.fire({
                                icon: 'success',
                                title: '上傳成功！',
                                showCancelButton: false,
                            });
                        }
                    },
                    resourceAddBtn: {
                        text: '資源借用',
                        click: openResourceModal
                    },
                    displaySettingsBtn: {
                        text: '行事曆顯示設定',
                        click: () => openDisplaySettings(calendar)

                    },
                },
                buttonText: {
                    today: '今天',
                    month: '月',
                    week: '週',
                    day: '日',
                    list: '列表'
                },
                eventDisplay: 'block',
                dayMaxEventRows: true,
                dayMaxEvents: false,
                events: [],// 先不丟，下一行會用 filterEvents()
                eventClick: function (info) {
                    const event = info.event.extendedProps;
                    const eventId = info.event.id;
                    const currentUser = event.currentUser;
                    const creatorId = event.creatorId;
                    const currentRole = event.currentRole;

                    // 是否可以編輯 / 刪除
                    const canEdit = currentUser === creatorId || currentRole === 'ROLE_ADMIN';

                    let html = `
        <div class="text-start">
            <p><strong>編號：</strong> ${eventId}</p>
            <p><strong>起始：</strong> ${info.event.start.toLocaleString()}</p>
            <p><strong>結束：</strong> ${info.event.end ? info.event.end.toLocaleString() : '—'}</p>
            <p><strong>類別：</strong> ${event.category || '—'}</p>
            <p><strong>項目：</strong> ${event.item || '—'}</p>
            <p><strong>地點：</strong> ${event.location || '—'}</p>
            <p><strong>參與人員：</strong> ${event.participants || '—'}</p>
            <p><strong>備註：</strong> ${event.note || '—'}</p>
            <p><strong>建立人：</strong> ${event.creator || '—'}</p>
        </div>`;

                    Swal.fire({
                        title: info.event.title,
                        html: html,
                        width: 600,
                        showCancelButton: canEdit,
                        showDenyButton: canEdit,
                        reverseButtons: true, // 反轉按鈕順序
                        cancelButtonText: '編輯',
                        denyButtonText: '刪除',
                        confirmButtonText: '關閉',
                        customClass: {
                            htmlContainer: 'text-start'
                        }
                    }).then(result => {
                        if (result.isDenied) {
                            // 點選刪除
                            Swal.fire({
                                title: '確認刪除？',
                                text: `確定要刪除「${info.event.title}」的紀錄嗎？此操作無法復原！`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#d33',
                                cancelButtonColor: '#3085d6',
                                confirmButtonText: '是，刪除',
                                cancelButtonText: '取消'
                            }).then(confirmResult => {

                            });
                        } else if (result.dismiss === Swal.DismissReason.cancel) {
                            $.getJSON(`/chyunn/resource/getResource?id=${eventId}`, function (event) {
                                console.log(event)
                                // 2) 用 Swal.fire 彈出一個可以編輯的表單
                                Swal.fire({
                                    title: '編輯 #' + eventId,
                                    html: `
<div class="container-fluid text-start">
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">內容：</label>
    <div class="col-sm-9">
      <input id="swal-content" class="form-control" value="${event.content || ''}">
    </div>
  </div>
<div class="row mb-3">
    <div class="col-sm-3"></div>
    <div class="col-sm-9">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="swal-allDay">
        <label class="form-check-label" for="swal-allDay">全天</label>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">時間：</label>
    <div class="col-sm-9">
      <div class="input-group">
        <input id="swal-start" type="text" class="form-control" value="${event.startTime}">
        <span class="input-group-text">～</span>
        <input id="swal-end"   type="text" class="form-control" value="${event.endTime}">
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">類別：</label>
    <div class="col-sm-9">
         <select id="swal-category" class="form-select">
  <option value="">請選擇</option>
  <option value="ROOM" ${event.category === 'ROOM' ? 'selected' : ''}>會議室</option>
  <option value="VEHICLE" ${event.category === 'VEHICLE' ? 'selected' : ''}>租借車輛</option>
  <option value="OTHER" ${event.category === 'OTHER' ? 'selected' : ''}>其他</option>
</select>
    </div>
  </div>

<div class="row mb-3" id="row-item">
    <label class="col-sm-3 col-form-label">項目：</label>
    <div class="col-sm-9">
      <!-- select 版 預設顯示 -->
      <select id="swal-item-select" class="form-select">
        <!-- 其他程式碼會填充這裡 -->
      </select>
      <!-- input 版，預設隱藏 -->
      <input  id="swal-item-input"  class="form-control" 
              placeholder="請輸入其他項目" style="display:none;"
              value="${(event.finalItem || '')}">
    </div>
  </div>


  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">位置：</label>
    <div class="col-sm-9">
      <input id="swal-location" class="form-control" value="${event.location || ''}">
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">備註：</label>
    <div class="col-sm-9">
      <input id="swal-note" class="form-control" value="${event.note || ''}">
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">參與人員：</label>
    <div class="col-sm-9">
      <input id="swal-participants" class="form-control" value="${event.participants || ''}">
    </div>
  </div>
    <div id="swal-item-error" class="text-danger mt-1" style="display: none;">
        <div style="
    background-color: #f8d7da;
    border: 1px solid #f5c2c7;
    color: #842029;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
  ">
    <i class="bi bi-x-octagon-fill me-2"></i>
    <span id="swal-item-error-text"></span>
  </div></div>
</div>
  `,
                                    width: 600,
                                    allowOutsideClick: false, // 禁止點擊背景關閉
                                    allowEscapeKey: false, // 禁止按下 ESC 鍵關閉
                                    allowEnterKey: false, // 禁止按下 Enter 鍵關閉
                                    showCloseButton: true,
                                    showConfirmButton: true,
                                    confirmButtonText: '儲存',
                                    focusConfirm: false,
                                    didOpen: () => {
                                        const $select = $('#swal-item-select');
                                        const $input = $('#swal-item-input');
                                        let category = $('#swal-category').val();
                                        const start = event.startTime;
                                        const end = event.endTime;
                                        const finalItem = event.finalItem;
                                        const finalItemId = event.finalItemId;
                                        console.log(category)
                                        if (category === 'OTHER') {
                                            $select.hide();
                                            $input.show().val(finalItem || '');
                                        } else {
                                            $select.show();
                                            $input.hide();

                                            // 初次載入 + 插入已選項目
                                            $.ajax({
                                                url: '/chyunn/resource/available',
                                                data: {
                                                    category: category,
                                                    start: start.replace(' ', 'T'),
                                                    end: end.replace(' ', 'T')
                                                }
                                            }).done(list => {
                                                $select.empty();

                                                // 插入原來的項目（即使它不在清單中）
                                                if (finalItem) {
                                                    $select.append(`<option value="${finalItemId}" selected>${finalItem}</option>`);
                                                } else {
                                                    $select.append('<option value="">請選擇項目</option>');
                                                }

                                                // 插入後端回傳清單
                                                list.forEach(i => {
                                                    if (i.id != finalItem && i.name !== finalItem) {
                                                        $select.append(`<option value="${i.id}">${i.name}</option>`);
                                                    }
                                                });
                                            });
                                        }
                                        let isRefreshing = false;
                                        $('#swal-start, #swal-end, #swal-category').on('change', () => {
                                            if (isRefreshing) return; // 防止重複觸發
                                            isRefreshing = true;
                                            $('#swal-item-error').hide();
                                            const currentCategory = $('#swal-category').val();
                                            const $select = $('#swal-item-select');
                                            const $input = $('#swal-item-input');
                                            const $selectVal = $('#swal-item-select').val();
                                            const currentInputVal = $input.val();
                                            if (currentCategory === 'OTHER') {
                                                $select.hide();
                                                // 若已有輸入值就保留，否則預設用 finalItem
                                                $input.show().val(currentInputVal || b.finalItem || '');
                                                isRefreshing = false;
                                                return;
                                            }

                                            $select.show();
                                            $input.hide();

                                            let s = $('#swal-start').val();
                                            let e = $('#swal-end').val();

                                            if ($('#swal-allDay').is(':checked')) {
                                                if (s.length === 10) s += ' 00:00:00';
                                                if (e.length === 10) e += ' 23:59:59';
                                            }

                                            $.ajax({
                                                url: '/chyunn/resource/check-available',
                                                data: {
                                                    category: currentCategory,
                                                    id: eventId,
                                                    start: s.replace(' ', 'T'),
                                                    end: e.replace(' ', 'T'),
                                                    excludeRequestId: eventId
                                                }
                                            }).done(() => {
                                                // 無衝突 → 載入項目清單並保留原選項
                                                $.ajax({
                                                    url: '/chyunn/resource/available',
                                                    data: {
                                                        category: currentCategory,
                                                        start: s.replace(' ', 'T'),
                                                        end: e.replace(' ', 'T')
                                                    }
                                                }).done(list => {
                                                    $select.empty();

                                                    if (finalItem) {
                                                        $select.append(`<option value="${finalItemId}" selected>${finalItem}</option>`);
                                                    } else {
                                                        $select.append('<option value="" disabled selected>請選擇項目</option>');
                                                    }

                                                    list.forEach(i => {
                                                        if (i.id != finalItem && i.name !== finalItem) {
                                                            $select.append(`<option value="${i.id}">${i.name}</option>`);
                                                        }
                                                    });
                                                    isRefreshing = false; // 結束時清除 flag
                                                });
                                            }).fail(xhr => {
                                                // 資源衝突或錯誤
                                                $select.val('');
                                                $select.empty().append('<option value="" disabled selected>請選擇其他項目</option>');

                                                if (xhr.status === 409) {
                                                    $('#swal-item-error-text').text(`項目【${finalItem}】在此時段已被占用，請選擇其他項目`);
                                                    $('#swal-item-error').show();
                                                }

                                                if (xhr.status === 400 || xhr.status === 409) {
                                                    $.ajax({
                                                        url: '/chyunn/resource/available',
                                                        data: {
                                                            category: currentCategory,
                                                            start: s.replace(' ', 'T'),
                                                            end: e.replace(' ', 'T')
                                                        }
                                                    }).done(list => {
                                                        list.forEach(i => {
                                                            $select.append(`<option value="${i.id}">${i.name}</option>`);
                                                        });
                                                    });
                                                    isRefreshing = false; // 結束時清除 flag
                                                } else {
                                                    isRefreshing = false; // 結束時清除 flag
                                                }
                                            });
                                        });


                                        function buildPickers(allDay, defaultStart, defaultEnd) {
                                            if (window.fpStart) window.fpStart.destroy();
                                            if (window.fpEnd) window.fpEnd.destroy();

                                            const dateFormat = allDay ? 'Y-m-d' : 'Y-m-d H:i';
                                            const enableTime = !allDay;

                                            window.fpStart = flatpickr('#swal-start', {
                                                enableTime: enableTime,
                                                dateFormat: dateFormat,
                                                locale: 'zh_tw',
                                                defaultDate: allDay ? defaultStart.split(' ')[0] : defaultStart,
                                                onChange: function (selectedDates) {
                                                    if (selectedDates.length > 0 && window.fpEnd) {
                                                        const startDate = selectedDates[0];
                                                        const endDate = window.fpEnd.selectedDates[0];

                                                        window.fpEnd.set('minDate', startDate);

                                                        if (endDate && startDate >= endDate) {
                                                            // 自動補 1 小時
                                                            const newEnd = new Date(startDate.getTime() + 60 * 60 * 1000);
                                                            window.fpEnd.setDate(newEnd, true);
                                                        }
                                                    }
                                                }
                                            });

                                            window.fpEnd = flatpickr('#swal-end', {
                                                enableTime: enableTime,
                                                dateFormat: dateFormat,
                                                locale: 'zh_tw',
                                                defaultDate: allDay ? defaultEnd.split(' ')[0] : defaultEnd
                                            });
                                        }
                                        buildPickers(event.allDay, event.startTime, event.endTime);
                                        $('#swal-allDay').prop('checked', event.allDay).on('change', function () {
                                            const isAllDay = $(this).is(':checked');
                                            const s = $('#swal-start').val();
                                            const e = $('#swal-end').val();
                                            buildPickers(isAllDay, s, e);
                                        });


                                    },
                                    preConfirm: () => {
                                        const allDay = $('#swal-allDay').is(':checked');
                                        const startRaw = $('#swal-start').val();
                                        const endRaw = $('#swal-end').val();

                                        // 解析成 Date 物件，全天僅取 yyyy-MM-dd
                                        const startDate = allDay
                                            ? new Date(startRaw + 'T00:00:00')
                                            : new Date(startRaw.replace(' ', 'T'));
                                        const endDate = allDay
                                            ? new Date(endRaw + 'T00:00:00')
                                            : new Date(endRaw.replace(' ', 'T'));

                                        if (endDate < startDate) {
                                            Swal.showValidationMessage('結束時間必須晚於開始時間');
                                            return false; // 阻止關閉並顯示錯誤
                                        }

                                        const finalItem = $('#swal-item-select').is(':visible')
                                            ? $('#swal-item-select').val()
                                            : $('#swal-item-input').val();
                                        return {
                                            id: eventId,
                                            content: $('#swal-content').val(),
                                            category: $('#swal-category').val(),
                                            finalItem: finalItem,
                                            startTime: $('#swal-start').val(),
                                            endTime: $('#swal-end').val(),
                                            location: $('#swal-location').val(),
                                            note: $('#swal-note').val(),
                                            participants: $('#swal-participants').val(),
                                            allDay: $('#swal-allDay').is(':checked'),
                                        };
                                    }
                                }).then((result) => {
                                    if (result.isConfirmed) {
                                        console.log(result.value)
                                        // // 3) 傳回後端更新
                                        $.ajax({
                                            url: `/chyunn/resource/${eventId}`,
                                            method: 'PUT',
                                            contentType: 'application/json',
                                            data: JSON.stringify(result.value),
                                            success() {
                                                Swal.fire({
                                                    icon: 'success',
                                                    title: '更新成功',
                                                    text: '已儲存修改',
                                                    allowOutsideClick: false, // 禁止點擊背景關閉
                                                    allowEscapeKey: false,    // 禁止 ESC 關閉
                                                    allowEnterKey: false      // 禁止 Enter 關閉
                                                }).then(() => {
                                                    window.location.reload();
                                                });
                                            },
                                            error() {
                                                Swal.fire('錯誤', '儲存失敗', 'error');
                                            }
                                        });
                                    }
                                });
                            });
                        }
                    });
                }
            });
            calendar.render();

            // 取得 localStorage 裡的篩選設定（如果有），並第一次套用
            filterEvents();
        }

        function filterEvents() {
            // 從 localStorage 拿上次的設定，若沒有則 selected 為空陣列
            const saved = localStorage.getItem('calFilters');
            const selected = saved ? JSON.parse(saved) : [];
            console.log(selected)
            // 若沒任何篩選，就直接顯示所有
            // if (selected.length === 0) {
            //     calendar.setOption('events', originalEvents);
            //     return;
            // }

            const filtered = originalEvents.filter(ev => {
                return selected.includes(ev.category);
            });
            console.log(filtered)
            calendar.setOption('events', filtered);
        }

        function openDisplaySettings() {
            Swal.fire({
                title: '行事曆顯示設定',
                html: `
<div id="cal-tree" class="px-0 text-start">
  <!-- 我的行事曆 群組 -->
  <div class="mb-4">
    <div class="form-check d-flex align-items-center mb-2">
      <input class="form-check-input" type="checkbox" id="chk-myroot">
      <label class="form-check-label fw-bold ms-2" for="chk-myroot">我的行事曆</label>
    </div>
    <div class="ps-4">
      <div class="form-check d-flex align-items-center mb-2">
        <input
          class="form-check-input chk-my"
          type="checkbox"
          value=""
          id="chk-sq"
          
        />
        <label class="form-check-label ms-2" for="chk-sq"></label>
      </div>
      <div class="form-check d-flex align-items-center mb-2">
        <input
          class="form-check-input chk-my"
          type="checkbox"
          value=""
          id="chk-asst"
          
        />
        <label class="form-check-label ms-2" for="chk-asst">[]</label>
      </div>
      <div class="form-check d-flex align-items-center mb-2">
        <input
          class="form-check-input chk-my"
          type="checkbox"
          value=""

                didOpen: () => {
                    // 1. 初始化 syncGroup（父子 checkbox 聯動）
                    const syncGroup = (parentId, childSel) => {
                        const p = document.getElementById(parentId);
                        const children = Array.from(document.querySelectorAll(childSel));
                        p.addEventListener('change', () => {
                            children.forEach(c => { c.checked = p.checked; c.indeterminate = false; });
                        });
                        children.forEach(c => {
                            c.addEventListener('change', () => {
                                const all = children.every(x => x.checked);
                                const none = children.every(x => !x.checked);
                                p.checked = all;
                                p.indeterminate = !(all || none);
                            });
                        });
                    };
                    syncGroup('chk-myroot', '#cal-tree .chk-my');
                    syncGroup('chk-resroot', '#cal-tree .chk-res');

                    // 2. 若 localStorage 有舊設定，就把各 checkbox 還原
                    const saved = localStorage.getItem('calFilters');
                    if (saved) {
                        const selected = JSON.parse(saved);
                        document.querySelectorAll('#cal-tree .form-check-input').forEach(chk => {
                            if (chk.value) {
                                chk.checked = selected.includes(chk.value);
                            }
                        });
                    }
                },
                preConfirm: () => {
                    // 收集有 value 而且被勾的 checkbox
                    const selected = Array.from(
                        document.querySelectorAll('#cal-tree .form-check-input:checked')
                    )
                        .map(chk => chk.value)
                        .filter(v => v);
                    // 存進 localStorage
                    localStorage.setItem('calFilters', JSON.stringify(selected));
                    return selected;
                }
            }).then(res => {
                if (res.isConfirmed) {
                    // 套用剛剛儲存好的篩選
                    filterEvents();
                }
            });
        }

                    const fpStart = flatpickr("#start-time", {
                        enableTime: true,

                        locale: "zh_tw",
                        onChange: function (selectedDates) {
                            if (selectedDates.length > 0) {
                                // 當 start-time 選定後，限制 end-time 的最早可選時間
                                fpEnd.set('minDate', selectedDates[0]);
                            }
                        }
                    });

                    const fpEnd = flatpickr("#end-time", {
                        enableTime: true,
                        dateFormat: "Y-m-d H:i",
                        locale: "zh_tw"
                    });

                    // 拿到全天 checkbox
                    const allDayCb = document.getElementById('allDayCheckbox');
                    allDayCb.addEventListener('change', () => {
                        if (allDayCb.checked) {
                            // 如果選全天，就關閉時間，改成只選日期
                            fpStart.set('enableTime', false);
                            fpStart.set('dateFormat', 'Y-m-d');
                            fpEnd.set('enableTime', false);
                            fpEnd.set('dateFormat', 'Y-m-d');
                        } else {
                            // 恢復時間選擇
                            fpStart.set('enableTime', true);
                            fpStart.set('dateFormat', 'Y-m-d H:i');
                            fpEnd.set('enableTime', true);
                            fpEnd.set('dateFormat', 'Y-m-d H:i');
                        }
                    });

                    // 2) 當「類別」、「開始」或「結束」任一改變就重新呼叫後端
                    function refreshItems() {
                        const cat = $("#category").val();
                        let s = $("#start-time").val();
                        let e = $("#end-time").val();
                        if (!cat || !s || !e) return;
                        console.log(s)
                        const start = new Date(s);
                        const end = new Date(e);
                        if (end < start) {
                            return;
                        }
                        // 拿全天勾選狀態
                        const isAllDay = document.getElementById('allDayCheckbox').checked;

                        if (isAllDay) {
                            // 若只選日期，補上時間
                            if (s.length === 10) s += ' 00:00';
                            if (e.length === 10) e += ' 23:59';
                        }
                        $.ajax({
                            url: '/chyunn/resource/available',
                            data: {
                                category: cat,
                                start: s.replace(' ', 'T'),
                                end: e.replace(' ', 'T')
                            }
                        }).done(list => {
                            const $item = $("#item").empty()
                                .append('<option value="" disabled selected>請選擇項目</option>');
                            list.forEach(i => {
                                $item.append(`<option value="${i.id}">${i.name}</option>`);
                            });
                        });
                    }

                    // 3) 綁定事件
                    $("#start-time, #end-time").on("change", () => {
                        // 重設類別和項目
                        $("#category").val("");
                        const $item = $("#item").empty()
                            .append('<option value="">請先選擇類別</option>');
                    });
                    $("#category").on("change", () => {
                        const cat = $("#category").val();
                        console.log(cat)
                        const $item = $("#item").show();          // 確保預設顯示 select
                        const $itemCustom = $("#item-custom").hide().val(""); // 預設隱藏輸入框並清空

                        if (cat === "OTHER") {
                            // 顯示輸入框、隱藏選單
                            $item.hide();
                            $itemCustom.show();
                        } else {
                            refreshItems(); // 類別為 ROOM / VEHICLE 時執行查詢
                        }
                    });

                preConfirm: () => {

                    const startTime = document.getElementById('start-time').value;
                    const endTime = document.getElementById('end-time').value;
                    const category = document.getElementById('category').value;
                    const item = document.getElementById('item').value;
                    const itemOther = document.getElementById('item-custom').value;
                    console.log(item)
                    console.log(itemOther)
                    if (!content) {

                        return false;
                    }
                    if (!startTime || !endTime) {
                        Swal.showValidationMessage('請填寫完整的開始與結束時間');
                        return false;
                    }
                    if (new Date(endTime) < new Date(startTime)) {
                        Swal.showValidationMessage('結束時間不能早於開始時間');
                        return false;
                    }
                    if (!category) {
                        Swal.showValidationMessage('請選擇類別');
                        return false;
                    }
                    let finalItem = '';
                    if (category === 'OTHER') {
                        if (!itemOther) {
                            Swal.showValidationMessage('請輸入其他項目內容');
                            return false;
                        }
                        finalItem = itemOther;
                    } else {
                        if (!item) {
                            Swal.showValidationMessage('請選擇項目');
                            return false;
                        }
                        finalItem = item;

                    return {
                        allDay: allDay,
                        content,
                        startTime,
                        endTime,
                        category,
                        finalItem,
                        location: document.getElementById('location').value,
                        note: document.getElementById('note').value,
                        participants: document.getElementById('participants').value,
                        creator: document.getElementById('loginId').value
                    };
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const data = result.value;
                    console.log('資源申請資料：', data);

                    $.ajax({
                        url: '/chyunn/resource/resource-borrow',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),

                                allowOutsideClick: false, // 禁止點擊背景關閉
                                allowEscapeKey: false,    // 禁止 ESC 關閉
                                allowEnterKey: false      // 禁止 Enter 關閉
                            }).then(() => {
                                window.location.reload();
                            });

                        error: function (xhr) {
                            Swal.fire('錯誤', '提交失敗：' + xhr.responseText, 'error');
                        }
                    });
                }
            });
