<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-資源管理</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* 修改標題文字顏色 */
        .fc .fc-toolbar-title {
            font-size: 1.1rem;
            /* 字體縮小一點 */
        }

        /* header toolbar 排版與間距優化 */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* 選中日期顏色 */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        /* 當天日期高亮顏色 */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* 滿版邊框統一 */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* 藍字（連結、日期）變成綠色 */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        #btnQuery {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        #btnQuery:hover,
        #btnQuery:focus {
            background-color: #189c85;
            border-color: #189c85;
        }

        /* 分頁文字／邊框 主題色 */
        #pagination .page-link {
            color: #1ab394;
            border-color: #1ab394;
        }

        /* 分頁 active 背景 */
        #pagination .page-item.active .page-link {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }

        /* 分頁 hover 效果 */
        #pagination .page-link:hover {
            background-color: rgba(26, 179, 148, 0.1);
        }

        /* 讓 page-link、輸入框、按鈕 padding / font-size / line-height 一致 */
        #pagination .page-link,
        #pagination .input-group-sm .form-control,
        #pagination .input-group-sm .btn-outline-secondary {
            padding: .5rem .75rem;
            line-height: 1.25;
            font-size: 1rem;
        }


        /* btn-query 配色，同 #btnQuery */
        .btn-query {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }

        .btn-query:hover,
        .btn-query:focus {
            background-color: #189c85;
            border-color: #189c85;
            color: #fff;
        }

        .flatpickr-input {
            background-color: #fff !important;

        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div class="d-flex justify-content-between align-items-center mb-3 calendar-header" style="margin-top: 30px;">
            <h4>資源管理</h4>
        </div>
        <!-- 篩選按鈕 -->
        <div class="d-flex align-items-center mb-3">
            <label class="me-2">顯示最近：</label>
            <select id="filterPeriod" class="form-select w-auto me-3">
                <option value="7">一週內</option>
                <option value="14">兩周內</option>
                <option value="21">三周內</option>
                <option value="30" selected>一個月內</option>
            </select>
            <button id="btnAddBorrow" class="btn btn-query ms-2">資源借用</button>
        </div>
        <div class="d-flex align-items-center mb-3">
            <label class="me-2">起始日期：</label>
            <input id="startDate" type="date" class="form-control w-auto me-3">
            <label class="me-2">結束日期：</label>
            <input id="endDate" type="date" class="form-control w-auto me-3">
            <button id="btnQuery" class="btn btn-primary">查 詢</button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>編號</th>
                    <th>內容</th>
                    <th>類別</th>
                    <th>項目</th>
                    <th>借用人</th>
                    <th>位置</th>
                    <th>時間</th>
                    <th>編輯</th>
                    <th>刪除</th>
                </tr>
            </thead>
            <tbody id="borrowTable"></tbody>
        </table>

        <nav>
            <ul id="pagination" class="pagination"></ul>
        </nav>

    </div>


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>
        const fpStart = flatpickr("#startDate", {
            dateFormat: "Y-m-d", locale: "zh_tw"
        });
        const fpEnd = flatpickr("#endDate", {
            dateFormat: "Y-m-d", locale: "zh_tw"
        });
        $(function () {
            // 一載入就用 filterPeriod 的「一個月內」來設 date inputs, 並載入 page0
            initDateInputs();
            loadPage(0);

            // 1. 當 filterPeriod 改變，就把 date inputs 設成「今天 - X 天 至 今天」並呼叫
            $('#filterPeriod').on('change', function () {
                initDateInputs();
                loadPage(0);
            });

            // 2. 當按「查 詢」時，就用使用者手動填的 start/end 去查
            $('#btnQuery').on('click', function () {
                // 如果使用者也修改了 filterPeriod，我們不改它，只以日期為主
                loadPage(0);
            });
        });

        // 載入指定 page 的資料
        function loadPage(page) {
            const start = $('#startDate').val();
            const end = $('#endDate').val();
            console.log(start)
            if (!start || !end) {
                alert('請先選擇起訖日期');
                return;
            }
            const dStart = new Date(start);
            const dEnd = new Date(end);

            if (dEnd < dStart) {
                return Swal.fire('錯誤', '結束日期不能小於開始日期', 'error');
            }
            $.ajax({
                url: '/chyunn/resource/eventsByDate',
                data: { startDate: start, endDate: end, page: page, size: 10 },
                dataType: 'json',
                success: function (pageDTO) {
                    renderTable(pageDTO.content);
                    renderPagination(pageDTO.number, pageDTO.totalPages);
                },
                error: function () {
                    alert('查詢失敗');
                }
            });
        }

        function initDateInputs() {
            const days = +$('#filterPeriod').val();
            const today = new Date();
            const prior = new Date();
            prior.setDate(prior.getDate() + days);
            // yyyy-MM-dd
            const fmt = d => d.toISOString().slice(0, 10);
            $('#startDate').val(fmt(today));
            $('#endDate').val(fmt(prior));
        }

        function renderTable(rows) {
            const $b = $('#borrowTable').empty();

            rows.forEach(b => {
                const canEdit = (b.creatorId === b.currentUser) || (b.currentRole === 'ROLE_ADMIN');
                $b.append(`
<tr>
  <td><input type="checkbox" name="ids" value="${b.id}" class="view" data-id="${b.id}"></td>
  <td>${b.id}</td>
  <td>${b.content}</td>
  <td>${b.category}</td>
  <td>${b.finalItem}</td>
  <td>${b.creator}</td>
  <td>${b.location}</td>
<td>${formatTimeRange(b.startTime, b.endTime)}</td>
 <td>
    ${canEdit
                        ? `<button class="btn btn-sm btn-query edit-btn" data-id="${b.id}">編輯</button>`
                        : `<span class="text-muted">—</span>`
                    }
  </td>
<td>
    ${canEdit
                        ? `<button class="btn btn-sm btn-danger delete-btn" data-id="${b.id}">刪除</button>`
                        : `<span class="text-muted">—</span>`}
  </td>
</tr>`);
            });
        }
        function formatTimeRange(startStr, endStr) {
            const start = new Date(startStr);
            const end = new Date(endStr);

            const pad = n => String(n).padStart(2, '0');

            const startDate = `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`;
            const startTime = `${pad(start.getHours())}:${pad(start.getMinutes())}`;
            const endDate = `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`;
            const endTime = `${pad(end.getHours())}:${pad(end.getMinutes())}`;

            if (startDate === endDate) {
                // 同一天：只顯示一次日期
                return `${startDate} ${startTime} - ${endTime}`;
            } else {
                // 跨日：顯示完整
                return `${startDate} ${startTime} – ${endDate} ${endTime}`;
            }
        }

        // 1) 點整列看檢視
        $(document).on('click', '#borrowTable tr', function (e) {
            // 如果點到編輯按鈕，就不要進來
            if ($(e.target).closest('.edit-btn').length) return;
            if ($(e.target).closest('.delete-btn').length) return;

            const id = $(this).find('.view').val();
            console.log('view id =', id);
            // AJAX 拿完整資料
            $.getJSON(`/chyunn/resource/getResource?id=${id}`, function (b) {
                Swal.fire({
                    title: `檢視 #${id}`,
                    html: `
        <div class="container-fluid text-start">
          <dl class="row">
            <dt class="col-sm-3">內容：</dt>
            <dd class="col-sm-9">${b.content}</dd>
            <dt class="col-sm-3">類別／項目：</dt>
            <dd class="col-sm-9">${b.category} – ${b.finalItem}</dd>
            <dt class="col-sm-3">時間：</dt>
            <dd class="col-sm-9">${b.startTime.replace('T', ' ')} ～ ${b.endTime.replace('T', ' ')}</dd>
            <dt class="col-sm-3">建立者：</dt>
            <dd class="col-sm-9">${b.creator}</dd>
            <dt class="col-sm-3">位置：</dt>
            <dd class="col-sm-9">${b.location || '&nbsp;'}</dd>
            <dt class="col-sm-3">備註：</dt>
            <dd class="col-sm-9">${b.note || '&nbsp;'}</dd>
            <dt class="col-sm-3">參與人員：</dt>
            <dd class="col-sm-9">${b.participants || '&nbsp;'}</dd>
          </dl>
        </div>
      `,
                    width: 600,
                    showCloseButton: true,
                    confirmButtonText: '關閉',
                });
            });
        });
        $(document).on('click', '.delete-btn', function () {
            const id = $(this).data('id');
            Swal.fire({
                title: '確認刪除',
                text: `確定要刪除 #${id} 的借用紀錄嗎？此操作無法復原！`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '是的，刪除',
                cancelButtonText: '取消',
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                reverseButtons: true
            }).then(result => {

            });
        })
        $(document).on('click', '.edit-btn', function () {
            const id = $(this).data('id');
            // 1) 先透過 AJAX 拿回該筆的完整資料
            $.getJSON(`/chyunn/resource/getResource?id=${id}`, function (b) {
                // 2) 用 Swal.fire 彈出一個可以編輯的表單
                Swal.fire({
                    title: '編輯 #' + id,
                    html: `
<div class="container-fluid text-start">
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">內容：</label>
    <div class="col-sm-9">
      <input id="swal-content" class="form-control" value="${b.content || ''}">
    </div>
  </div>
<div class="row mb-3">
    <div class="col-sm-3"></div>
    <div class="col-sm-9">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="swal-allDay">
        <label class="form-check-label" for="swal-allDay">全天</label>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">時間：</label>
    <div class="col-sm-9">
      <div class="input-group">
        <input id="swal-start" type="text" class="form-control" value="${b.startTime}">
        <span class="input-group-text">～</span>
        <input id="swal-end"   type="text" class="form-control" value="${b.endTime}">
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">類別：</label>
    <div class="col-sm-9">
         <select id="swal-category" class="form-select">
  <option value="">請選擇</option>
  <option value="ROOM" ${b.category === 'ROOM' ? 'selected' : ''}>會議室</option>
  <option value="VEHICLE" ${b.category === 'VEHICLE' ? 'selected' : ''}>租借車輛</option>
  <option value="OTHER" ${b.category === 'OTHER' ? 'selected' : ''}>其他</option>
</select>
    </div>
  </div>

<div class="row mb-3" id="row-item">
    <label class="col-sm-3 col-form-label">項目：</label>
    <div class="col-sm-9">
      <!-- select 版 預設顯示 -->
      <select id="swal-item-select" class="form-select">
        <!-- 其他程式碼會填充這裡 -->
      </select>
      <!-- input 版，預設隱藏 -->
      <input  id="swal-item-input"  class="form-control" 
              placeholder="請輸入其他項目" style="display:none;"
              value="${(b.finalItem || '')}">
    </div>
  </div>


  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">位置：</label>
    <div class="col-sm-9">
      <input id="swal-location" class="form-control" value="${b.location || ''}">
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">備註：</label>
    <div class="col-sm-9">
      <input id="swal-note" class="form-control" value="${b.note || ''}">
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">參與人員：</label>
    <div class="col-sm-9">
      <input id="swal-participants" class="form-control" value="${b.participants || ''}">
    </div>
  </div>
    <div id="swal-item-error" class="text-danger mt-1" style="display: none;">
        <div style="
    background-color: #f8d7da;
    border: 1px solid #f5c2c7;
    color: #842029;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
  ">
    <i class="bi bi-x-octagon-fill me-2"></i>
    <span id="swal-item-error-text"></span>
  </div></div>
</div>
  `,
                    width: 600,
                    allowOutsideClick: false, // 禁止點擊背景關閉
                    allowEscapeKey: false, // 禁止按下 ESC 鍵關閉
                    allowEnterKey: false, // 禁止按下 Enter 鍵關閉
                    showCloseButton: true,
                    showConfirmButton: true,
                    confirmButtonText: '儲存',
                    focusConfirm: false,
                    didOpen: () => {
                        const $select = $('#swal-item-select');
                        const $input = $('#swal-item-input');
                        let category = $('#swal-category').val();
                        const start = b.startTime;
                        const end = b.endTime;
                        console.log(category)
                        if (category === 'OTHER') {
                            $select.hide();
                            $input.show().val(b.finalItem || '');
                        } else {
                            $select.show();
                            $input.hide();

                            // 初次載入 + 插入已選項目
                            $.ajax({
                                url: '/chyunn/resource/available',
                                data: {
                                    category: category,
                                    start: start.replace(' ', 'T'),
                                    end: end.replace(' ', 'T')
                                }
                            }).done(list => {
                                $select.empty();

                                // 插入原來的項目（即使它不在清單中）
                                if (b.finalItem) {
                                    $select.append(`<option value="${b.finalItemId}" selected>${b.finalItem}</option>`);
                                } else {
                                    $select.append('<option value="">請選擇項目</option>');
                                }

                                // 插入後端回傳清單
                                list.forEach(i => {
                                    if (i.id != b.finalItem && i.name !== b.finalItem) {
                                        $select.append(`<option value="${i.id}">${i.name}</option>`);
                                    }
                                });
                            });
                        }
                        let isRefreshing = false;
                        $('#swal-start, #swal-end, #swal-category').on('change', () => {
                            if (isRefreshing) return; // 防止重複觸發
                            isRefreshing = true;
                            $('#swal-item-error').hide();
                            const currentCategory = $('#swal-category').val();
                            const $select = $('#swal-item-select');
                            const $input = $('#swal-item-input');
                            const $selectVal = $('#swal-item-select').val();
                            const currentInputVal = $input.val();
                            if (currentCategory === 'OTHER') {
                                $select.hide();

                                // 若已有輸入值就保留，否則預設用 finalItem
                                $input.show().val(currentInputVal || b.finalItem || '');
                                isRefreshing = false;
                                return;
                            }

                            $select.show();
                            $input.hide();

                            let s = $('#swal-start').val();
                            let e = $('#swal-end').val();

                            if ($('#swal-allDay').is(':checked')) {
                                if (s.length === 10) s += ' 00:00:00';
                                if (e.length === 10) e += ' 23:59:59';
                            }

                            $.ajax({
                                url: '/chyunn/resource/check-available',
                                data: {
                                    category: currentCategory,
                                    id: b.id,
                                    start: s.replace(' ', 'T'),
                                    end: e.replace(' ', 'T'),
                                    excludeRequestId: b.id
                                }
                            }).done(() => {
                                // 無衝突 → 載入項目清單並保留原選項
                                $.ajax({
                                    url: '/chyunn/resource/available',
                                    data: {
                                        category: currentCategory,
                                        start: s.replace(' ', 'T'),
                                        end: e.replace(' ', 'T')
                                    }
                                }).done(list => {
                                    $select.empty();

                                    if (b.finalItem) {
                                        $select.append(`<option value="${b.finalItemId}" selected>${b.finalItem}</option>`);
                                    } else {
                                        $select.append('<option value="" disabled selected>請選擇項目</option>');
                                    }

                                    list.forEach(i => {
                                        if (i.id != b.finalItem && i.name !== b.finalItem) {
                                            $select.append(`<option value="${i.id}">${i.name}</option>`);
                                        }
                                    });
                                    isRefreshing = false; // 結束時清除 flag
                                });
                            }).fail(xhr => {
                                // 資源衝突或錯誤
                                $select.val('');
                                $select.empty().append('<option value="" disabled selected>請選擇其他項目</option>');

                                if (xhr.status === 409) {
                                    $('#swal-item-error-text').text(`項目【${b.finalItem}】在此時段已被占用，請選擇其他項目`);
                                    $('#swal-item-error').show();
                                }

                                if (xhr.status === 400 || xhr.status === 409) {
                                    $.ajax({
                                        url: '/chyunn/resource/available',
                                        data: {
                                            category: currentCategory,
                                            start: s.replace(' ', 'T'),
                                            end: e.replace(' ', 'T')
                                        }
                                    }).done(list => {
                                        list.forEach(i => {
                                            $select.append(`<option value="${i.id}">${i.name}</option>`);
                                        });
                                    });
                                    isRefreshing = false; // 結束時清除 flag
                                } else {
                                    isRefreshing = false; // 結束時清除 flag
                                }
                            });
                        });


                        function buildPickers(allDay, defaultStart, defaultEnd) {
                            if (window.fpStart) window.fpStart.destroy();
                            if (window.fpEnd) window.fpEnd.destroy();

                            const dateFormat = allDay ? 'Y-m-d' : 'Y-m-d H:i';
                            const enableTime = !allDay;

                            window.fpStart = flatpickr('#swal-start', {
                                enableTime: enableTime,
                                dateFormat: dateFormat,
                                locale: 'zh_tw',
                                defaultDate: allDay ? defaultStart.split(' ')[0] : defaultStart,
                                onChange: function (selectedDates) {
                                    if (selectedDates.length > 0 && window.fpEnd) {
                                        const startDate = selectedDates[0];
                                        const endDate = window.fpEnd.selectedDates[0];

                                        window.fpEnd.set('minDate', startDate);

                                        if (endDate && startDate >= endDate) {
                                            // 自動補 1 小時
                                            const newEnd = new Date(startDate.getTime() + 60 * 60 * 1000);
                                            window.fpEnd.setDate(newEnd, true);
                                        }
                                    }
                                }
                            });

                            window.fpEnd = flatpickr('#swal-end', {
                                enableTime: enableTime,
                                dateFormat: dateFormat,
                                locale: 'zh_tw',
                                defaultDate: allDay ? defaultEnd.split(' ')[0] : defaultEnd
                            });
                        }
                        buildPickers(b.allDay, b.startTime, b.endTime);
                        $('#swal-allDay').prop('checked', b.allDay).on('change', function () {
                            const isAllDay = $(this).is(':checked');
                            const s = $('#swal-start').val();
                            const e = $('#swal-end').val();
                            buildPickers(isAllDay, s, e);
                        });


                    },
                    preConfirm: () => {
                        const allDay = $('#swal-allDay').is(':checked');
                        const startRaw = $('#swal-start').val();
                        const endRaw = $('#swal-end').val();

                        // 解析成 Date 物件，全天僅取 yyyy-MM-dd
                        const startDate = allDay
                            ? new Date(startRaw + 'T00:00:00')
                            : new Date(startRaw.replace(' ', 'T'));
                        const endDate = allDay
                            ? new Date(endRaw + 'T00:00:00')
                            : new Date(endRaw.replace(' ', 'T'));

                        if (endDate < startDate) {
                            Swal.showValidationMessage('結束時間必須晚於開始時間');
                            return false; // 阻止關閉並顯示錯誤
                        }

                        const finalItem = $('#swal-item-select').is(':visible')
                            ? $('#swal-item-select').val()
                            : $('#swal-item-input').val();
                        return {
                            id: id,
                            content: $('#swal-content').val(),
                            category: $('#swal-category').val(),
                            finalItem: finalItem,
                            startTime: $('#swal-start').val(),
                            endTime: $('#swal-end').val(),
                            location: $('#swal-location').val(),
                            note: $('#swal-note').val(),
                            participants: $('#swal-participants').val(),
                            allDay: $('#swal-allDay').is(':checked'),
                        };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        console.log(result.value)
                        // // 3) 傳回後端更新
                        $.ajax({
                            url: `/chyunn/resource/${id}`,
                            method: 'PUT',
                            contentType: 'application/json',
                            data: JSON.stringify(result.value),
                            success() {
                                Swal.fire({
                                    icon: 'success',
                                    title: '更新成功',
                                    text: '已儲存修改',
                                    allowOutsideClick: false, // 禁止點擊背景關閉
                                    allowEscapeKey: false,    // 禁止 ESC 關閉
                                    allowEnterKey: false      // 禁止 Enter 關閉
                                }).then(() => {
                                    window.location.reload();
                                });
                            },
                            error() {
                                Swal.fire('錯誤', '儲存失敗', 'error');
                            }
                        });
                    }
                });
            });
        });

        $('#btnAddBorrow').on('click', openResourceModal);

        function openResourceModal() {
            const creator = $("#username-h6").text();
            const loginId = $("#loginId").val();

            Swal.fire({
                title: '&nbsp;&nbsp;資源借用申請',
                html: `
                   <div class="container text-start">
                    
            <div class="mb-3">
              <label class="form-label">內容</label>
              <input type="text" id="content" class="form-control">
            </div>
              <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="allDayCheckbox">
              <label class="form-check-label" for="allDayCheckbox">全天</label>
            </div>
            <div class="mb-3">
              <label class="form-label">時間</label>
              <div class="row">
                <div class="col-md-6 mb-2">
                  <input type="text" id="start-time" class="form-control" placeholder="開始時間">
                </div>
                <div class="col-md-6">
                  <input type="text" id="end-time" class="form-control" placeholder="結束時間">
                </div>
              </div>
            </div>
           <div class="mb-3">
            <label class="form-label">類別</label>
            <select id="category" class="form-select">
            <option value="">請選擇</option>
            <option value="ROOM">會議室</option>
            <option value="VEHICLE">租借車輛</option>
            <option value="OTHER">其他</option>
            </select>
            </div>
            <div class="mb-3">
            <label class="form-label">項目</label>
            <select id="item" class="form-select">
            <option value="">請先選擇類別</option>
            <select>
                 <input type="text" id="item-custom" class="form-control mt-2" placeholder="請輸入其他項目" style="display: none;">
            </div>
            <div class="mb-3">
              <label class="form-label">位置</label>
              <input type="text" id="location" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">備註</label>
              <input type="text" id="note" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">借用人</label>
              <input type="text" class="form-control" value="${creator}" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">參與人員</label>
              <input type="text" id="participants" class="form-control">
            </div>
          </div>
                `,
                allowOutsideClick: false,
                showCloseButton: true,
                allowEscapeKey: false,
                allowEnterKey: false,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '送出',
                cancelButtonText: '取消',
                width: 800,
                customClass: {
                    title: 'text-start w-100 px-4'
                },
                didOpen: () => {
                    const fpStart = flatpickr("#start-time", {
                        enableTime: true,
                        dateFormat: "Y-m-d H:i",
                        locale: "zh_tw",
                        onChange: function (selectedDates) {
                            if (selectedDates.length > 0) {
                                // 當 start-time 選定後，限制 end-time 的最早可選時間
                                fpEnd.set('minDate', selectedDates[0]);
                            }
                        }
                    });

                    const fpEnd = flatpickr("#end-time", {
                        enableTime: true,
                        dateFormat: "Y-m-d H:i",
                        locale: "zh_tw"
                    });

                    // 拿到全天 checkbox
                    const allDayCb = document.getElementById('allDayCheckbox');
                    allDayCb.addEventListener('change', () => {
                        if (allDayCb.checked) {
                            // 如果選全天，就關閉時間，改成只選日期
                            fpStart.set('enableTime', false);
                            fpStart.set('dateFormat', 'Y-m-d');
                            fpEnd.set('enableTime', false);
                            fpEnd.set('dateFormat', 'Y-m-d');
                        } else {
                            // 恢復時間選擇
                            fpStart.set('enableTime', true);
                            fpStart.set('dateFormat', 'Y-m-d H:i');
                            fpEnd.set('enableTime', true);
                            fpEnd.set('dateFormat', 'Y-m-d H:i');
                        }
                    });

                    // 2) 當「類別」、「開始」或「結束」任一改變就重新呼叫後端
                    function refreshItems() {
                        const cat = $("#category").val();
                        let s = $("#start-time").val();
                        let e = $("#end-time").val();
                        if (!cat || !s || !e) return;
                        console.log(s)
                        const start = new Date(s);
                        const end = new Date(e);
                        if (end < start) {
                            return;
                        }
                        // 拿全天勾選狀態
                        const isAllDay = document.getElementById('allDayCheckbox').checked;

                        if (isAllDay) {
                            // 若只選日期，補上時間
                            if (s.length === 10) s += ' 00:00';
                            if (e.length === 10) e += ' 23:59';
                        }
                        $.ajax({
                            url: '/chyunn/resource/available',
                            data: {
                                category: cat,
                                start: s.replace(' ', 'T'),
                                end: e.replace(' ', 'T')
                            }
                        }).done(list => {
                            const $item = $("#item").empty()
                                .append('<option value="" disabled selected>請選擇項目</option>');
                            list.forEach(i => {
                                $item.append(`<option value="${i.id}">${i.name}</option>`);
                            });
                        });
                    }

                    // 3) 綁定事件
                    $("#start-time, #end-time").on("change", () => {
                        // 重設類別和項目
                        $("#category").val("");
                        const $item = $("#item").empty()
                            .append('<option value="">請先選擇類別</option>');
                    });
                    $("#category").on("change", () => {
                        const cat = $("#category").val();
                        console.log(cat)
                        const $item = $("#item").show();          // 確保預設顯示 select
                        const $itemCustom = $("#item-custom").hide().val(""); // 預設隱藏輸入框並清空

                        if (cat === "OTHER") {
                            // 顯示輸入框、隱藏選單
                            $item.hide();
                            $itemCustom.show();
                        } else {
                            refreshItems(); // 類別為 ROOM / VEHICLE 時執行查詢
                        }
                    });
                },
                preConfirm: () => {
                    const allDay = document.getElementById('allDayCheckbox').checked;
                    const content = document.getElementById('content').value.trim();
                    const startTime = document.getElementById('start-time').value;
                    const endTime = document.getElementById('end-time').value;
                    const category = document.getElementById('category').value;
                    const item = document.getElementById('item').value;
                    const itemOther = document.getElementById('item-custom').value;
                    console.log(item)
                    console.log(itemOther)
                    if (!content) {
                        Swal.showValidationMessage('請填寫內容');
                        return false;
                    }
                    if (!startTime || !endTime) {
                        Swal.showValidationMessage('請填寫完整的開始與結束時間');
                        return false;
                    }
                    if (new Date(endTime) < new Date(startTime)) {
                        Swal.showValidationMessage('結束時間不能早於開始時間');
                        return false;
                    }
                    if (!category) {
                        Swal.showValidationMessage('請選擇類別');
                        return false;
                    }
                    let finalItem = '';
                    if (category === 'OTHER') {
                        if (!itemOther) {
                            Swal.showValidationMessage('請輸入其他項目內容');
                            return false;
                        }
                        finalItem = itemOther;
                    } else {
                        if (!item) {
                            Swal.showValidationMessage('請選擇項目');
                            return false;
                        }
                        finalItem = item;
                    }

                    return {
                        allDay: allDay,
                        content,
                        startTime,
                        endTime,
                        category,
                        finalItem,
                        location: document.getElementById('location').value,
                        note: document.getElementById('note').value,
                        participants: document.getElementById('participants').value,
                        creator: document.getElementById('loginId').value
                    };
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const data = result.value;
                    console.log('資源申請資料：', data);

                    $.ajax({
                        url: '/chyunn/resource/resource-borrow',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function (res) {
                            Swal.fire({
                                icon: 'success',
                                title: '已送出！',
                                text: '資源借用已提交。',
                                allowOutsideClick: false, // 禁止點擊背景關閉
                                allowEscapeKey: false,    // 禁止 ESC 關閉
                                allowEnterKey: false      // 禁止 Enter 關閉
                            }).then(() => {
                                window.location.reload();
                            });
                        },
                        error: function (xhr) {
                            Swal.fire('錯誤', '提交失敗：' + xhr.responseText, 'error');
                        }
                    });
                }
            });
        }

        function renderPagination(current, total) {
            const windowSize = 10;
            // 1‐based 的當前頁
            const cur1 = current + 1;
            // 起始頁 = cur1 或 (total-windowSize+1) 中較小的那個，保證能顯示完整視窗
            const startPage = Math.min(cur1, Math.max(1, total - windowSize + 1));
            // 結束頁 = 起始頁 + windowSize - 1，但不超過 total
            const endPage = Math.min(startPage + windowSize - 1, total);
            const $p = $('#pagination').empty();

            // 「« 上一頁」
            $p.append(`
    <li class="page-item${current === 0 ? ' disabled' : ''}">
      <a href="#" class="page-link"
         onclick="if(${current}>0) loadPage(${current}-1);return false;">
        «
      </a>
    </li>
  `);

            // 頁碼視窗：只列出 startPage…endPage
            for (let i = startPage; i <= endPage; i++) {
                const idx = i - 1; // 轉回 0-based
                $p.append(`
      <li class="page-item${idx === current ? ' active' : ''}">
        <a href="#" class="page-link"
           onclick="loadPage(${idx});return false;">
          ${i}
        </a>
      </li>
    `);
            }

            // 「下一頁 »」
            $p.append(`
    <li class="page-item${current === total - 1 ? ' disabled' : ''}">
      <a href="#" class="page-link"
         onclick="if(${current}<${total}-1) loadPage(${current}+1);return false;">
        »
      </a>
    </li>
  `);
        }

    </script>
