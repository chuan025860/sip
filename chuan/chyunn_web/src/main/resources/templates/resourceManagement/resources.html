<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-資源管理</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* 修改標題文字顏色 */
        .fc .fc-toolbar-title {
            font-size: 1.1rem;
            /* 字體縮小一點 */
        }

        /* header toolbar 排版與間距優化 */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* 選中日期顏色 */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        /* 當天日期高亮顏色 */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* 滿版邊框統一 */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* 藍字（連結、日期）變成綠色 */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        #btnQuery {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        #btnQuery:hover,
        #btnQuery:focus {
            background-color: #189c85;
            border-color: #189c85;
        }

        /* 分頁文字／邊框 主題色 */
        #pagination .page-link {
            color: #1ab394;
            border-color: #1ab394;
        }

        /* 分頁 active 背景 */
        #pagination .page-item.active .page-link {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }

        /* 分頁 hover 效果 */
        #pagination .page-link:hover {
            background-color: rgba(26, 179, 148, 0.1);
        }

        /* 讓 page-link、輸入框、按鈕 padding / font-size / line-height 一致 */
        #pagination .page-link,
        #pagination .input-group-sm .form-control,
        #pagination .input-group-sm .btn-outline-secondary {
            padding: .5rem .75rem;
            line-height: 1.25;
            font-size: 1rem;
        }


        /* btn-query 配色，同 #btnQuery */
        .btn-query {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }

        .btn-query:hover,
        .btn-query:focus {
            background-color: #189c85;
            border-color: #189c85;
            color: #fff;
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div class="d-flex justify-content-between align-items-center mb-3 calendar-header" style="margin-top: 30px;">
            <h4>資源管理</h4>
        </div>
        <!-- 篩選按鈕 -->
        <div class="d-flex align-items-center mb-3">
            <label class="me-2">顯示最近：</label>
            <select id="filterPeriod" class="form-select w-auto me-auto">
                <option value="7">一週內</option>
                <option value="14">兩周內</option>
                <option value="21">三周內</option>
                <option value="30" selected>一個月內</option>
            </select>
        </div>
        <div class="d-flex align-items-center mb-3">
            <label class="me-2">起始日期：</label>
            <input id="startDate" type="date" class="form-control w-auto me-3">
            <label class="me-2">結束日期：</label>
            <input id="endDate" type="date" class="form-control w-auto me-3">
            <button id="btnQuery" class="btn btn-primary">查 詢</button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>編號</th>
                    <th>內容</th>
                    <th>類別</th>
                    <th>項目</th>
                    <th>借用人</th>
                    <th>位置</th>
                    <th>時間</th>
                    <th>編輯</th>
                </tr>
            </thead>
            <tbody id="borrowTable"></tbody>
        </table>

        <nav>
            <ul id="pagination" class="pagination"></ul>
        </nav>

    </div>


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>
        // $('#filterPeriod').on('change', function () {
        //     const filterDays = +this.value;  // 7, 30, or 0

        //     $('#borrowTable tr').each(function () {
        //         const diff = +this.dataset.daysOld; // 今天到 startTime 還剩幾天
        //         // 只顯示：全部(0)，或未來 filterDays 內的活動
        //         const show = filterDays === 0 || (diff >= 0 && diff <= filterDays);
        //         $(this).toggle(show);
        //     });
        // });

        $(function () {
            // 一載入就用 filterPeriod 的「一個月內」來設 date inputs, 並載入 page0
            initDateInputs();
            loadPage(0);

            // 1. 當 filterPeriod 改變，就把 date inputs 設成「今天 - X 天 至 今天」並呼叫
            $('#filterPeriod').on('change', function () {
                initDateInputs();
                loadPage(0);
            });

            // 2. 當按「查 詢」時，就用使用者手動填的 start/end 去查
            $('#btnQuery').on('click', function () {
                // 如果使用者也修改了 filterPeriod，我們不改它，只以日期為主
                loadPage(0);
            });
        });

        // 載入指定 page 的資料
        function loadPage(page) {
            const start = $('#startDate').val();
            const end = $('#endDate').val();
            if (!start || !end) {
                alert('請先選擇起訖日期');
                return;
            }
            $.ajax({
                url: '/chyunn/resource/eventsByDate',
                data: { startDate: start, endDate: end, page: page, size: 10 },
                dataType: 'json',
                success: function (pageDTO) {
                    renderTable(pageDTO.content);
                    renderPagination(pageDTO.number, pageDTO.totalPages);
                },
                error: function () {
                    alert('查詢失敗');
                }
            });
        }

        function initDateInputs() {
            const days = +$('#filterPeriod').val();
            const today = new Date();
            const prior = new Date();
            prior.setDate(prior.getDate() + days);
            // yyyy-MM-dd
            const fmt = d => d.toISOString().slice(0, 10);
            $('#startDate').val(fmt(today));
            $('#endDate').val(fmt(prior));
        }

        function renderTable(rows) {
            const $b = $('#borrowTable').empty();
            rows.forEach(b => {
                $b.append(`
<tr>
  <td><input type="checkbox" name="ids" value="${b.id}"></td>
  <td>${b.id}</td>
  <td>${b.content}</td>
  <td>${b.category}</td>
  <td>${b.item}</td>
  <td>${b.creator}</td>
  <td>${b.location}</td>
  <td>${b.startTime.slice(0, 16).replace('T', ' ')} – ${b.endTime.slice(0, 16).replace('T', ' ')}</td>
  <td><a href="/chyunn/resource/edit/${b.id}" class="btn btn-sm btn-query">編輯</a></td>
</tr>`);
            });
        }

        function renderPagination(current, total) {
            const windowSize = 10;
            // 1‐based 的當前頁
            const cur1 = current + 1;
            // 起始頁 = cur1 或 (total-windowSize+1) 中較小的那個，保證能顯示完整視窗
            const startPage = Math.min(cur1, Math.max(1, total - windowSize + 1));
            // 結束頁 = 起始頁 + windowSize - 1，但不超過 total
            const endPage = Math.min(startPage + windowSize - 1, total);
            const $p = $('#pagination').empty();

            // 「« 上一頁」
            $p.append(`
    <li class="page-item${current === 0 ? ' disabled' : ''}">
      <a href="#" class="page-link"
         onclick="if(${current}>0) loadPage(${current}-1);return false;">
        «
      </a>
    </li>
  `);

            // 頁碼視窗：只列出 startPage…endPage
            for (let i = startPage; i <= endPage; i++) {
                const idx = i - 1; // 轉回 0-based
                $p.append(`
      <li class="page-item${idx === current ? ' active' : ''}">
        <a href="#" class="page-link"
           onclick="loadPage(${idx});return false;">
          ${i}
        </a>
      </li>
    `);
            }

            // 「下一頁 »」
            $p.append(`
    <li class="page-item${current === total - 1 ? ' disabled' : ''}">
      <a href="#" class="page-link"
         onclick="if(${current}<${total}-1) loadPage(${current}+1);return false;">
        »
      </a>
    </li>
  `);
        }

    </script>


</body>
