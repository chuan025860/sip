<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-公佈欄</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* 修改標題文字顏色 */
        .fc .fc-toolbar-title {
            font-size: 1.1rem;
            /* 字體縮小一點 */
        }

        /* header toolbar 排版與間距優化 */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* 選中日期顏色 */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        /* 當天日期高亮顏色 */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* 滿版邊框統一 */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* 藍字（連結、日期）變成綠色 */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        .fs-6.lh-lg img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1rem;
            /* 上下間距、置中對齊 */
            object-fit: contain;
            /* 確保圖片不會變形裁切 */
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <!-- Content Start -->
    <div class="content" style="margin-top: 80px; padding: 0 24px;">

        <div class="container-fluid px-0 ">
            <div class="row">
                <div class="col-12">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <!-- 左側：返回按鈕 -->
                        <a th:href="@{'/resource/bulletin'}" class="btn btn-warning btn-md px-3 py-2 rounded shadow-sm"
                            style="margin-top: 2%;">
                            <i class="bi bi-arrow-left-circle me-1"></i> 返回
                        </a>

                        <!-- 右側：編輯、刪除按鈕 -->
                        <div class="d-flex gap-2" style="margin-top: 2%;"
                            th:if="${userRoles != null and (userRoles.contains('ROLE_ADMIN') or userRoles.contains('ROLE_BULLETIN_ADMIN'))}">
                            <a th:href="@{/resource_manage/editBulletin(id=${bulletinPost.id})}"
                                class="btn btn-primary btn-md px-3 py-2 rounded shadow-sm d-flex align-items-center">
                                <i class="bi bi-pencil-square me-2"></i> 編輯
                            </a>
                            <button class="btn btn-danger btn-md px-3 py-2 rounded shadow-sm d-flex align-items-center">
                                <i class="bi bi-trash3 me-2"></i> 刪除
                            </button>
                        </div>
                    </div>

                    <!-- 標題與發佈資訊 -->
                    <h4 class="fw-bold mb-2" th:text="${bulletinPost.title}">公告標題</h4>
                    <div class="text-muted small mb-3">
                        發佈時間：<span
                            th:text="${bulletinPost.publishTimeStr + ' - ' + bulletinPost.endTimeStr}"></span>&nbsp;&nbsp;&nbsp;
                        發佈者：<span th:text="${bulletinPost.creatorName}"></span>
                    </div>

                    <hr>

                    <!-- 文章內容 -->
                    <div th:utext="${bulletinPost.content}" class="fs-6 lh-lg"></div>
                    <!-- 若有附件才顯示整個 tr -->
                    <tr th:if="${bulletinPost.bulletinFileDtos != null and not #lists.isEmpty(bulletinPost.bulletinFileDtos)}"
                        style="background-color: #f9f9f9;">
                        <th>檢視附件</th>
                        <td colspan="3">
                            <ul class="list-group">
                                <li th:each="file : ${bulletinPost.bulletinFileDtos}"
                                    class="list-group-item d-flex justify-content-between align-items-center">
                                    <a th:href="@{'/uploads/BulletinPost_' + ${file.bulletinId} + '/' + ${file.fileName}}"
                                        th:text="${file.fileName}" target="_blank" class="text-primary"></a>
                                    <a th:href="@{'/uploads/BulletinPost_' + ${file.bulletinId} + '/' + ${file.fileName}}"
                                        target="_blank" class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> 檢視
                                    </a>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </div>
            </div>
        </div>
    </div>


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>

    </script>
</body>
