<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-管理-新增使用者</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        /* 左側樹狀 hover 樣式 */
        nav ul li ul li>a {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            color: #333;
        }

        nav ul li ul li>a:hover {
            background: rgba(26, 179, 148, 0.1);
            color: #1ab394;
            text-decoration: none;
        }

        .btn-query {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }

        .btn-query:hover {
            background-color: #189c85;
            border-color: #189c85;
        }

        .sidebar-link strong,
        .sidebar-link i {
            color: #189c85;
        }

        /* 高亮樣式 */
        a.position-item.selected {
            background: rgba(26, 179, 148, 0.1);
            color: #1ab394;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>


    <div class="content container-fluid" style="margin-top:80px;">
        <div class="row">
            <nav style="width: 15%; margin-top: 2%;">
                <div class="d-flex justify-content-between align-items-center mb-3 calendar-header">
                    <h5>部門/職位清單</h5>
                </div>
                <ul class="list-unstyled">
                    <!-- ===== 第一層：部門 ===== -->
                    <li th:each="dept : ${orgTree}">
                        <!-- 部門標題 -->
                        <a class="d-flex justify-content-start align-items-center sidebar-link"
                            data-bs-toggle="collapse" th:href="'#dept' + ${dept.id}" aria-expanded="false">
                            <strong th:text="${dept.name}">部門</strong>
                            <i class="bi bi-chevron-down ms-auto"></i>
                        </a>
                        <!-- 部門內容：職位＋子單位 -->
                        <div class="collapse" th:id="'dept' + ${dept.id}">
                            <ul class="list-unstyled ps-3">
                                <!-- 第一層·項目 A：直屬部門職位 -->
                                <li th:each="p : ${dept.positions}" th:if="${p.subUnit} == null">
                                    <a href="#" class="position-item" th:data-dept="${dept.name}"
                                        th:data-deptid="${dept.id}" th:data-posid="${p.id}" th:data-pos="${p.name}"
                                        th:text="${p.name}">職位名稱</a>
                                </li>
                                <!-- 第一層·項目 B：第二層子單位 -->
                                <li th:each="sub : ${dept.subUnits}">
                                    <!-- 第二層：子單位標題 -->
                                    <a class="d-flex justify-content-start align-items-center ms-2 sidebar-link"
                                        data-bs-toggle="collapse" th:href="'#sub-' + ${sub.id}" aria-expanded="false"
                                        style="font-size:.9em;">
                                        <strong th:text="${sub.name}">子單位</strong>
                                        <i class="bi bi-chevron-down ms-auto"></i>
                                    </a>
                                    <!-- 第二層：子單位內容 -->
                                    <div class="collapse" th:id="'sub-' + ${sub.id}">
                                        <ul class="list-unstyled ps-4 mb-0">
                                            <li th:each="sp : ${sub.positions}" th:if="${sp.subSubUnit} == null">
                                                <a href="#" class="position-item" th:data-dept="${dept.name}"
                                                    th:data-deptid="${dept.id}" th:data-subid="${sub.id}"
                                                    th:data-posid="${sp.id}" th:data-sub="${sub.name}"
                                                    th:data-pos="${sp.name}" th:text="${sp.name}">職位名稱</a>
                                            </li>
                                            <!-- 第二層·項目 B：第三層子子單位 -->
                                            <li th:each="sub2 : ${sub.subSubUnits}">
                                                <!-- 第三層：子子單位標題 -->
                                                <a class="d-flex justify-content-start align-items-center ms-3 sidebar-link"
                                                    data-bs-toggle="collapse"
                                                    th:href="'#sub-' + ${sub.id} + '-' + ${sub2.id}"
                                                    aria-expanded="false" style="font-size:.85em;">
                                                    <strong th:text="${sub2.name}">子子單位</strong>
                                                    <i class="bi bi-chevron-down ms-auto"></i>
                                                </a>
                                                <!-- 第三層：子子單位內容 -->
                                                <div class="collapse" th:id="'sub-' + ${sub.id} + '-' + ${sub2.id}">
                                                    <ul class="list-unstyled ps-5 mb-0">
                                                        <!-- 第三層·項目：子子單位的職位 -->
                                                        <li th:each="sp2 : ${sub2.positions}">
                                                            <a href="#" class="position-item"
                                                                th:data-dept="${dept.name}"
                                                                th:data-sub="${sub.name} + '-' + ${sub2.name}"
                                                                th:data-pos="${sp2.name}" th:text="${sp2.name}"
                                                                th:data-deptid="${dept.id}" th:data-subid="${sub.id}"
                                                                th:data-sub2id="${sub2.id}"
                                                                th:data-posid="${sp2.id}">職位名稱</a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>
            <!-- 右側表單 -->
            <div class="col-9 p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 calendar-header"
                    style="margin-top: 10px;">
                    <h5>新增使用者</h5>
                </div>
                <form>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label>部門</label>
                            <input id="inputDept" class="form-control" readonly />
                        </div>
                        <div class="col-md-4">
                            <label>單位</label>
                            <input id="inputSub" class="form-control" readonly />
                        </div>
                        <div class="col-md-4">
                            <label>職稱</label>
                            <input id="inputPos" class="form-control" readonly />
                        </div>
                        <!-- 新增：姓名 -->
                        <div class="col-md-4">
                            <label for="username">姓名</label>
                            <input id="username" class="form-control" placeholder="請輸入姓名" required />
                        </div>

                        <!-- 新增：工號 -->
                        <div class="col-md-4">
                            <label for="employee_no">工號</label>
                            <input id="employee_no" class="form-control" placeholder="請輸入工號" required />
                        </div>

                        <!-- Email -->
                        <div class="col-md-4">
                            <label for="email">Email</label>
                            <input id="email" type="email" name="email" class="form-control" placeholder="請輸入 Email"
                                required />
                        </div>

                        <!-- 帳號 -->
                        <div class="col-md-4">
                            <label for="account">帳號</label>
                            <input id="account" type="text" name="account" class="form-control" placeholder="請輸入帳號"
                                required />
                        </div>

                        <!-- 密碼 -->
                        <div class="col-md-4">
                            <label for="password">密碼</label>
                            <input id="password" type="password" name="password" class="form-control" required
                                placeholder="請輸入密碼" />
                        </div>
                        <div class="col-md-4">
                            <label for="confirmPassword">確認密碼</label>
                            <input id="confirmPassword" type="password" name="confirmPassword" class="form-control"
                                required placeholder="再次輸入密碼" />
                        </div>

                        <!-- 新增：權限 (多選) -->
                        <div class="col-md-12">
                            <label>權限</label>
                            <table class="table table-bordered">
                                <thead class="table-light">
                                    <tr>
                                        <th>模組</th>
                                        <th class="text-center">初級權限</th>
                                        <th class="text-center">管理權限</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- 事件反應 (模組ID=1) -->
                                    <tr>
                                        <td>事件反應</td>
                                        <td class="text-center">

                                        </td>
                                        <td class="text-center">
                                            <input type="checkbox" name="adminPermissions" value="ROLE_INCIDENT_ADMIN"
                                                id="admin_1" />
                                            <label for="admin_1">管理</label>
                                        </td>
                                    </tr>

                                    <!-- 財產管理 (模組ID=2) -->
                                    <tr>
                                        <td>財產管理</td>
                                        <td class="text-center">
                                            <input type="checkbox" name="basicPermissions" value="ROLE_ASSET_VIEW"
                                                id="basic_2" />
                                            <label for="basic_2">檢視</label>
                                        </td>
                                        <td class="text-center">
                                            <input type="checkbox" name="adminPermissions" value="ROLE_ASSET_ADMIN"
                                                id="admin_2" />
                                            <label for="admin_2">管理</label>
                                        </td>
                                    </tr>

                                    <!-- 使用者帳號 (模組ID=3) -->
                                    <tr>
                                        <td>權限管理</td>
                                        <td class="text-center">
                                        </td>
                                        <td class="text-center">
                                            <input type="checkbox" name="adminPermissions" value="ROLE_USER_ADMIN"
                                                id="admin_3" />
                                            <label for="admin_3">管理</label>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <input id="selectedDeptId" type="hidden" readonly />
                        <input id="selectedSubId" type="hidden" readonly />
                        <input id="selectedSub2Id" type="hidden" readonly />
                        <input id="selectedPositionId" type="hidden" readonly />
                        <!-- 提交按鈕 -->
                        <div class="col-12">
                            <button type="submit" class="btn btn-query">存檔</button>
                            <button type="reset" class="btn btn-secondary">清除</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>
        $(function () {
            // 點擊職位：高亮並同步隱藏欄位
            $(document).on('click', '.position-item', function (e) {
                e.preventDefault();
                $('.position-item.selected').removeClass('selected');
                $(this).addClass('selected');

                $('#inputDept').val($(this).data('dept'));
                $('#inputSub').val($(this).data('sub') || '');
                $('#inputPos').val($(this).data('pos'));

                $('#selectedDeptId').val($(this).data('deptid'));
                $('#selectedSubId').val($(this).data('subid') || '');
                $('#selectedSub2Id').val($(this).data('sub2id') || '');
                $('#selectedPositionId').val($(this).data('posid'));
            });

            // 表單送出：欄位驗證 + Ajax
            $('form').on('submit', function (e) {
                e.preventDefault();

                const deptId = $('#selectedDeptId').val();
                const posId = $('#selectedPositionId').val();

                if (!deptId) {
                    return Swal.fire({ icon: 'error', title: '發生錯誤', text: '請選擇部門' });
                }
                if (!posId) {
                    return Swal.fire({ icon: 'error', title: '發生錯誤', text: '請選擇職稱' });
                }

                const pwd = $('#password').val();
                const pwd2 = $('#confirmPassword').val();
                if (!pwd || pwd !== pwd2) {
                    return Swal.fire({
                        icon: 'error',
                        title: '密碼不一致',
                        text: '請確認「密碼」與「確認密碼」欄位輸入相同。'
                    });
                }
                const basicPerms = $("input[id^='basic_']:checked")
                    .map((_, cb) => cb.value)
                    .get();
                const adminPerms = $("input[id^='admin_']:checked")
                    .map((_, cb) => cb.value)
                    .get();

                const permissions = basicPerms.concat(adminPerms);

                console.log(permissions)
                const payload = {
                    username: $('#username').val(),
                    employeeNo: $('#employee_no').val(),
                    email: $('#email').val(),
                    loginId: $('#account').val(),
                    password: pwd,
                    departmentId: deptId,
                    subUnitId: $('#selectedSubId').val(),
                    subSubUnitId: $('#selectedSub2Id').val(),
                    positionId: posId,
                    permissions: permissions
                };

                $.ajax({
                    url: '/chyunn/permission/create_user',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload)
                })
                    .done(res => {
                        Swal.fire({
                            icon: 'success',
                            title: '已建立使用者！',
                            text: res.message || '操作成功。',
                            allowOutsideClick: false, // 禁止點擊背景關閉
                            allowEscapeKey: false, // 禁止按下 ESC 鍵關閉
                            allowEnterKey: false, // 禁止按下 Enter 鍵關閉
                        }).then(result => {
                            if (result.isConfirmed) {
                                // 這邊把真正的 loginId 帶進去
                                const loginId = encodeURIComponent(payload.loginId);
                                window.location.href = `/chyunn/permission/update_user?loginId=${loginId}`;
                            }
                        });

                    })
                    .fail(xhr => {
                        Swal.fire({
                            icon: 'error',
                            title: '建立失敗',
                            text: xhr.responseJSON?.message || xhr.responseText
                        });
                    });
            });
        });
    </script>
</body>

</html>
