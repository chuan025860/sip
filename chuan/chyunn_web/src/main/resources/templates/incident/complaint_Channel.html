<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
	<meta charset="UTF-8">
	<title>群運事件問題-員工申訴表單</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
	<div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
	<style>
		.table th {
			text-align: left;
			/* 水平居中 */
			vertical-align: middle;
			/* 垂直居中 */
			width: 120px;
			/* 固定寬度，可根據需要調整 */
			white-space: nowrap;
			/* 防止文字換行 */
		}

		.table td {
			vertical-align: middle;
			/* 垂直居中 */
		}

		.tbody th {
			text-align: left;
			/* 標題內容居中 */
			width: 120px;
			/* 固定寬度，可根據需要調整 */
			white-space: nowrap;
			/* 防止文字換行 */
			padding-top: 11px;
			/* 只影響 th 的上邊距 */
		}

		.flatpickr-input {
			background-color: #fff !important;
			color: #000 !important;
		}

		.custom-btn {
			background-color: #1ab394;
			border-color: #1ab394;
			color: white;
		}

		.custom-btn:hover {
			color: white;
			/* 字體保持白色 */
			text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
			/* 發光效果 */
			background-color: #18a383;
			/* 懸停時略微變化背景色 */
			border-color: #18a383;
		}

		/* 設定 CKEditor 的編輯區域高度 */
		.ck-editor__editable {
			min-height: 400px !important;
			/* 讓編輯區至少有 400px 高 */
		}
	</style>
</head>

<body>
	<div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>

	<!-- Content Start -->
	<div class="content" style="width: auto; margin-top: 100px;">
		<div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
		<form id="reportBullyingForm">
			<table class="table table-bordered text-dark" style="border-color: #ddd;">
				<thead class="bg-danger text-white">
					<tr>
						<th colspan="4" class="text-left">員工申訴表單</th>
					</tr>
				</thead>
				<tbody class="tbody">
					<tr style="background-color: #f9f9f9;">
						<th>申請人姓名/部門</th>
						<td style="width: 400px;"><input type="text" class="form-control text-dark d-inline"
								id="reporter" style="width: 170px;" readonly th:value="${creator}" />
							<select id="department" name="department" class="form-select text-dark d-inline"
								style="width: 170px;" required>
								<option value="" disabled selected>請選擇部門</option>
								<option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">部門</option>
							</select>
						</td>
						<!-- <th>部門</th>
						<td>
						</td> -->
					</tr>
					<tr>
						<th>聯絡信箱</th>
						<td><input type="text" class="form-control text-dark" id="email" style="width: 300px;" />
						</td>
						<th>連絡電話</th>
						<td><input type="text" class="form-control text-dark" id="phone" style="width: 200px;" />
						</td>
					</tr>
					<tr>
						<th>申訴對象(選填)</th>
						<td><input type="text" class="form-control text-dark" id="targetPerson" style="width: 300px;"
								placeholder="如知悉對象請填寫姓名或單位" />
						</td>
						<th>發生日期</th>
						<td><input type="date" class="form-control text-dark" id="incidentDate" style="width: 200px;" />
						</td>
					</tr>
					<tr>
						<th>發生地點(選填)</th>
						<td colspan="3"><input type="text" class="form-control text-dark" id="incidentLocation"
								placeholder="" /></td>
					</tr>
					<tr>
						<th>申訴類別</th>
						<td colspan="3">
							<select class="form-select text-dark" id="supportNeeded">
								<option value="遭受不當差別待遇或不合理工作指派">遭受不當差別待遇或不合理工作指派</option>
								<option value="涉及性別歧視或其他不法侵害事件">涉及性別歧視或其他不法侵害事件</option>
								<option value="遭受不當處分、職場霸凌或管理不當行為">遭受不當處分、職場霸凌或管理不當行為</option>
								<option value="薪資、福利、考核等相關事項認有不當">薪資、福利、考核等相關事項認有不當</option>
								<option value="其他損及工作權益之情形">其他損及工作權益之情形</option>
							</select>
						</td>
					</tr>
					<tr>
						<th>事件描述</th>
						<td colspan="3">
							<textarea id="incidentDescription" class="form-control text-dark" rows="5"
								placeholder="請詳述事件背景、過程、影響與訴求"></textarea>
						</td>
					</tr>

					<tr>
						<th>附件上傳(選填)</th>
						<td colspan="3">
							<small class="text-muted">可上傳圖片、PDF 或語音檔案，單檔最大 10MB</small>
							<input type="file" id="attachment" class="form-control text-dark" multiple
								accept=".pdf,.jpg,.jpeg,.png,.mp3,.wav" />
							<div class="mt-2">
								<ul id="fileList" class="list-group"></ul>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
			<div>
				<button class="btn btn-secondary btn-sm" id="returnButton">返回</button>
				<button id="submit" type="submit" class="btn btn-danger btn-sm">提交(尚無功能)</button>
			</div>
		</form>
	</div>

			<strong>附件：</strong>${attachmentList}
		</div>
	`;
