<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <title>群運事件問題-新增事件</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        .table th {
            text-align: left;
            /* 水平居中 */
            vertical-align: middle;
            /* 垂直居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
        }

        .table td {
            vertical-align: middle;
            /* 垂直居中 */
        }

        .tbody th {
            text-align: left;
            /* 標題內容居中 */
            width: 120px;
            /* 固定寬度，可根據需要調整 */
            white-space: nowrap;
            /* 防止文字換行 */
            padding-top: 11px;
            /* 只影響 th 的上邊距 */
        }

        .flatpickr-input {
            background-color: #fff !important;
            color: #000 !important;
        }

        .custom-btn {
            background-color: #1ab394;
            border-color: #1ab394;
            color: white;
        }

        .custom-btn:hover {
            color: white;
            /* 字體保持白色 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            /* 發光效果 */
            background-color: #18a383;
            /* 懸停時略微變化背景色 */
            border-color: #18a383;
        }

        /* 設定 CKEditor 的編輯區域高度 */
        .ck-editor__editable {
            min-height: 400px !important;
            /* 讓編輯區至少有 400px 高 */
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <!-- <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div> -->
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 100px;">
        <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
        <div class="container mt-5 text-center">
            <h2 class="text-danger">無法編輯事件</h2>
            <p th:text="${errorMessage}">此事件無法編輯。</p>
            <a th:href="@{'/incident/select_incident'}" class="btn btn-primary mt-3">回事件列表</a>
        </div>
    </div>

    <!-- Footer --><!-- Back to Top -->
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <!-- scriptNavbar -->
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <div th:replace="~{backStageNavbar/ckeditor}"></div>
</body>

</html>
