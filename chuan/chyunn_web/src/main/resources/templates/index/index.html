    <style>
        .news-box {
            height: 360px;
            /* 顯示一則訊息 */
            overflow: hidden;
            position: relative;
            border: 1px solid #ddd;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            transition: transform 0.5s ease-in-out;
        }

        .news-item {
            text-align: left;
            display: flex;
            align-items: center;
            padding-left: 16px;
            height: 120px;
            padding: 10px 12px;
            background: #1ab394;
            color: white;
            border-bottom: 1px solid #ddd;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-size: cover;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.4);
            background-blend-mode: overlay;
            color: white;
        }

        .control-btns {
            margin-top: 10px;
        }


        /* 修改標題文字顏色 */
        .fc .fc-toolbar-title {
            font-size: 1.1rem;
            /* 字體縮小一點 */
        }

        /* header toolbar 排版與間距優化 */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* 選中日期顏色 */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        /* 當天日期高亮顏色 */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* 滿版邊框統一 */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* 藍字（連結、日期）變成綠色 */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }

        .swal2-popup img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .text-orange {
            color: orange;
        }

        .text-purple {
            color: purple;
        }
    </style>
</head>

    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');

            // 假事件資料
            const events = [
                { title: '會議1', start: '2025-05-15' },
                { title: '會議2', start: '2025-05-16', end: '2025-05-18' },
                { title: '會議3', start: '2025-05-17' },
                { title: '會議4', start: '2025-05-18' },
                { title: '會議5', start: '2025-05-19' }
            ];

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-tw',
                events: events,
                headerToolbar: {
                    left: 'prev',
                    center: 'title',
                    right: 'next' // 隱藏 today
                },
                height: 'auto'
            });

            calendar.render();

            // 取得接近今天的 3 筆未來事件（包含今天）
            const today = new Date();
            today.setHours(0, 0, 0, 0); // 將時間歸零（只比日期）

            const upcoming = events
                .filter(e => new Date(e.start) >= today)
                .sort((a, b) => new Date(a.start) - new Date(b.start))
                .slice(0, 3);

            const list = document.getElementById('upcoming-events');
            if (upcoming.length === 0) {
                list.innerHTML = `<li class="text-muted">（近期無事件）</li>`;
            } else {
                upcoming.forEach(e => {
                    const li = document.createElement('li');
                    li.innerHTML = `📅 <strong>${e.title}</strong> - ${e.start}`;
                    list.appendChild(li);
                });
            }
        });


        function fetchBulletins() {
            fetch("/chyunn/resource/latest-bulletins")
                .then(response => response.json())
                .then(data => {
                    newsList.innerHTML = ""; // 清空原本內容

                    data.forEach(item => {
                        const div = document.createElement("div");
                        div.className = "news-item text-white";
                        div.style.backgroundImage = `url('${item.background}')`;
                        // 擷取純文字摘要
                        const tempDiv = document.createElement("div");
                        tempDiv.innerHTML = item.content;
                        const summary = tempDiv.textContent
                            .replace(/\s+/g, " ")      // 移除多餘空白
                            .replace(/－+/g, "")       // 可選：移除裝飾用破折號
                            .trim()
                            .substring(0, 50) + "…";   // 取前 50 字（視情況調整）
                        div.innerHTML = `
    <div class="news-text">
        <strong class="fs-5 d-block">${item.title}</strong>
        <p class="mt-2 small">${summary}</p>
    </div>
`;
                        div.addEventListener("click", () => {
                            // 將 content + 附件組成 html 字串
                            let htmlContent = item.content;

                            if (item.files && item.files.length > 0) {
                                let fileLinks = '<hr><div class="text-start"><strong>附件：</strong><ul>';
                                item.files.forEach(file => {
                                    fileLinks += `<li><a href="${file.fileUrl}" target="_blank" style="color: #0d6efd;">${file.fileName}</a></li>`;
                                });
                                fileLinks += '</ul></div>';
                                htmlContent += fileLinks;
                            }

                            Swal.fire({
                                title: item.title,
                                html: htmlContent,
                                width: 800,
                                showCloseButton: true,
                                showConfirmButton: false,
                                scrollbarPadding: false,
                                background: '#f8f9fa',
                                customClass: {
                                    popup: 'swal-wide'
                                }
                            });
                        });

                        newsList.appendChild(div);
                    });

                    initScroll(); // 重啟輪播
                });
        }

        // 輪播初始化函式
        function initScroll() {
            const itemHeight = 120;
            const visibleCount = 3;
            const scrollInterval = 4000;
            let index = 0;
            let interval;

            const totalItems = newsList.children.length;

            for (let i = 0; i < visibleCount; i++) {
                const clone = newsList.children[i].cloneNode(true);
                newsList.appendChild(clone);
            }

            function scrollDown() {
                index++;
                newsList.style.transition = 'transform 0.5s ease-in-out';
                newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                if (index === totalItems) {
                    setTimeout(() => {
                        newsList.style.transition = 'none';
                        newsList.style.transform = 'translateY(0px)';
                        index = 0;
                        requestAnimationFrame(() => {
                            void newsList.offsetWidth;
                            newsList.style.transition = 'transform 0.5s ease-in-out';
                        });
                    }, 500);
                }
            }

            window.scrollDown = scrollDown;

            window.scrollUp = function () {
                if (index === 0) {
                    newsList.style.transition = 'none';
                    index = totalItems;
                    newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                    requestAnimationFrame(() => {
                        index--;
                        newsList.style.transition = 'transform 0.5s ease-in-out';
                        newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                    });
                } else {
                    index--;
                    newsList.style.transition = 'transform 0.5s ease-in-out';
                    newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                }
            }

            window.toggleScroll = function (btn) {
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                    btn.innerText = '▶ 播放';
                } else {
                    interval = setInterval(scrollDown, scrollInterval);
                    btn.innerText = '⏸ 暫停';
                }
            }

            interval = setInterval(scrollDown, scrollInterval);
        }

        // 初始化
        document.addEventListener("DOMContentLoaded", fetchBulletins);
