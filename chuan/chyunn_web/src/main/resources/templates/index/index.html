<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運-首頁</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        .news-box {
            height: 180px;
            /* 顯示一則訊息 */
            overflow: hidden;
            position: relative;
            border: 1px solid #ddd;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            transition: transform 0.5s ease-in-out;
        }

        .news-item {
            height: 60px;
            padding: 10px 12px;
            background: #1ab394;
            color: white;
            border-bottom: 1px solid #ddd;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-btns {
            margin-top: 10px;
        }


        /* 修改標題文字顏色 */
        .fc .fc-toolbar-title {
            font-size: 1.1rem;
            /* 字體縮小一點 */
        }

        /* header toolbar 排版與間距優化 */
        .fc-header-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* 選中日期顏色 */
        .fc-daygrid-event {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        /* 當天日期高亮顏色 */
        .fc-day-today {
            background-color: #e6f7f3 !important;
        }

        /* 滿版邊框統一 */
        .fc {
            --fc-border-color: #d9f3ed;
        }

        /* 藍字（連結、日期）變成綠色 */
        .fc a {
            color: #1ab394 !important;
            text-decoration: none;
        }

        .fc-toolbar-chunk .fc-button {
            background-color: #666666;
            border-color: #666666;
            color: white;
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light text-center rounded p-4">
                <div class="row">
                    <!-- 左側：行事曆 & 搜尋 -->
                    <div class="col-md-4 text-start">
                        <!-- 行事曆（FullCalendar） -->
                        <div class="mb-4 border rounded p-3 bg-white">
                            <h5 class="mb-3">行事曆</h5>
                            <div id="calendar"></div>
                            <div class="mt-3">
                                <h6 class="text-success">即將來臨</h6>
                                <ul id="upcoming-events" class="list-unstyled mb-0">
                                    <!-- 自動填入最近三筆 -->
                                </ul>
                            </div>
                        </div>


                    </div>

                    <!-- 右側：最新消息輪播 -->
                    <div class="col-md-8">
                        <div class="border rounded p-3 bg-white">
                            <h5 class="mb-3">多公告欄</h5>

                            <!-- 輪播本體 -->
                            <div class="news-box" id="newsBox">
                                <div class="news-list" id="newsList">
                                    <div class="news-item"
                                        style="background-image: url('/chyunn/uploads/ckeditor_images/a6ea0a96-ffb2-402f-84b2-e6b2aa6a2277_showEditorImage.png');">
                                        <strong>【職安宣導】</strong> 測試1
                                    </div>
                                    <div class="news-item"><strong>【環保電子報】</strong> 測試2</div>
                                    <div class="news-item"><strong>【職安宣導】</strong> 測試3</div>
                                    <div class="news-item"><strong>【資訊安全】</strong> 測試4</div>
                                    <div class="news-item"><strong>【公告】</strong> 測試5</div>
                                </div>
                            </div>

                            <!-- 控制按鈕 -->
                            <div class="d-flex justify-content-between control-btns">
                                <button class="btn btn-outline-secondary btn-sm" onclick="scrollUp()">↑ 上一則</button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="toggleScroll(this)">⏸
                                    暫停</button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="scrollDown()">↓ 下一則</button>
                            </div>
                        </div>
                        <!-- 官網嵌入 -->
                        <div class="border rounded p-3 bg-white mt-4">
                            <h5 class="mb-3">最新消息</h5>
                            <div class="ratio ratio-16x9">
                                <iframe src="https://www.chyunn.com/blog/" title="公司官網" allowfullscreen
                                    style="border: none;"></iframe>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>

    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');

            // 假事件資料
            const events = [
                { title: '會議1', start: '2025-05-15' },
                { title: '會議2', start: '2025-05-16', end: '2025-05-18' },
                { title: '會議3', start: '2025-05-17' },
                { title: '會議4', start: '2025-05-18' },
                { title: '會議5', start: '2025-05-19' }
            ];

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-tw',
                events: events,
                headerToolbar: {
                    left: 'prev',
                    center: 'title',
                    right: 'next' // 隱藏 today
                },
                height: 'auto'
            });

            calendar.render();

            // 取得接近今天的 3 筆未來事件（包含今天）
            const today = new Date();
            today.setHours(0, 0, 0, 0); // 將時間歸零（只比日期）

            const upcoming = events
                .filter(e => new Date(e.start) >= today)
                .sort((a, b) => new Date(a.start) - new Date(b.start))
                .slice(0, 3);

            const list = document.getElementById('upcoming-events');
            if (upcoming.length === 0) {
                list.innerHTML = `<li class="text-muted">（近期無事件）</li>`;
            } else {
                upcoming.forEach(e => {
                    const li = document.createElement('li');
                    li.innerHTML = `📅 <strong>${e.title}</strong> - ${e.start}`;
                    list.appendChild(li);
                });
            }
        });

        const newsList = document.getElementById('newsList');
        const itemHeight = 60;
        const visibleCount = 3;
        const scrollInterval = 3000;
        let index = 0;
        let interval;

        const totalItems = newsList.children.length;

        // 複製前3條到尾部（多條可見時需這樣）
        for (let i = 0; i < visibleCount; i++) {
            const clone = newsList.children[i].cloneNode(true);
            newsList.appendChild(clone);
        }

        function scrollDown() {
            index++;
            newsList.style.transition = 'transform 0.5s ease-in-out';
            newsList.style.transform = `translateY(-${index * itemHeight}px)`;

            // 無縫重置：滾到尾部虛擬項時，回到原始開頭
            if (index === totalItems) {
                setTimeout(() => {
                    newsList.style.transition = 'none';
                    newsList.style.transform = `translateY(0px)`;
                    index = 0;
                    requestAnimationFrame(() => {
                        // 強制觸發重排，確保下一次 transition 有效
                        void newsList.offsetWidth;
                        newsList.style.transition = 'transform 0.5s ease-in-out';
                    });
                }, 500); // 等動畫跑完
            }
        }

        function scrollUp() {
            if (index === 0) {
                newsList.style.transition = 'none';
                index = totalItems;
                newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                requestAnimationFrame(() => {
                    index--;
                    newsList.style.transition = 'transform 0.5s ease-in-out';
                    newsList.style.transform = `translateY(-${index * itemHeight}px)`;
                });
            } else {
                index--;
                newsList.style.transition = 'transform 0.5s ease-in-out';
                newsList.style.transform = `translateY(-${index * itemHeight}px)`;
            }
        }

        function autoScroll() {
            interval = setInterval(scrollDown, scrollInterval);
        }

        function toggleScroll(btn) {
            if (interval) {
                clearInterval(interval);
                interval = null;
                btn.innerText = '▶ 播放';
            } else {
                autoScroll();
                btn.innerText = '⏸ 暫停';
            }
        }

        // 手動下一則
        function manualScroll() {
            if (interval) clearInterval(interval);
            scrollDown();
        }

        // 初始化
        autoScroll();
    </script>
