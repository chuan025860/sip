<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>群運資產_總明細</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        .final_property_id-column {
            width: 10%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .name-column {
            width: 10%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .custodian-column {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .location-column {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .category-column {
            width: 10%;
            /* word-wrap: break-word; */
            white-space: normal;
        }


        .change_record-column {
            width: 10%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .inventory-date {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light text-center rounded p-4">
                <div class="container-fluid">
                    <form class="row align-items-center g-2">
                        <!-- 關鍵字搜尋 -->
                        <div class="col-md-auto">
                            <label for="searchInput" class="form-label text-dark mb-0">財產搜尋</label>
                        </div>
                        <div class="col-md-4">
                            <input type="search" id="searchInput_Asset" class="form-control text-dark"
                                placeholder="請輸入關鍵字">
                        </div>

                        <!-- 放置處 -->
                        <div class="col-md-auto">
                            <label for="location" class="form-label text-dark mb-0">放置處</label>
                        </div>
                        <div class="col-md-4">
                            <select id="location_Asset" class="form-select text-dark">
                                <option value="">-- 請選擇 --</option>
                                <option th:each="location : ${locations}" th:value="${location.name}"
                                    th:text="${location.name}"></option>
                            </select>
                        </div>
                        <div class="w-100"></div>
                        <!-- 按鈕區 -->
                        <div class="col-md-auto d-flex gap-2 w-100">
                            <div class="d-flex gap-2">
                                <button id="filter-btn" class="btn btn-primary">🔍 搜尋</button>
                                <button id="reset-btn" class="btn btn-secondary">🔄 重置</button>
                                <button id="add-btn" class="btn btn-primary"
                                    th:if="${userRoles != null and (userRoles.contains('ROLE_ADMIN') or userRoles.contains('ROLE_ASSET_ADMIN'))}">
                                    ➕ 新增
                                </button>
                                <button id="downloadExcelBtn" class="btn btn-success">📥 匯出 Excel</button>
                            </div>
                            <div class="ms-auto">
                                <button id="inventorySettingBtn" class="btn btn-warning">⚙️ 設定</button>
                            </div>
                        </div>
                    </form>
                </div>
                <hr>
                <div class="table-responsive border">
                    <table class="table text-start align-middle table-bordered table-hover mb-0">
                        <thead>
                            <tr class="text-dark">
                                <!-- <th scope="col"><input class="form-check-input" type="checkbox"></th> -->
                                <th scope="col">最終財產編號</th>
                                <th scope="col">名稱</th>
                                <th scope="col">保管人</th>
                                <th scope="col">放置處</th>
                                <th scope="col">類別</th>
                                <th scope="col">異動記錄</th>
                                <th scope="col">盤點日期</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryEquipment-table">
                        </tbody>
                    </table>
                    <div id="pagination">
                        <!-- 分頁控制會由 JavaScript 填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="hidden" id="userRoles" th:value="${userRoles}" />
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>
        $(document).ready(function () {
            const rolesRaw = $("#userRoles").val(); // 會是 "[ROLE_USER, ROLE_ASSET_MANAGE]"
            const userRoles = rolesRaw.replace(/[\[\]\s]/g, "").split(",");
            const canEdit = userRoles.includes("ROLE_ADMIN") || userRoles.includes("ROLE_ASSET_ADMIN");
            $("#reset-btn").click(function (event) {
                event.preventDefault();

                // 清空搜尋欄位
                $("#searchInput_Asset").val("");

                // 重置下拉選單
                $("#location_Asset").prop("selectedIndex", 0);

                // 清空 sessionStorage
                sessionStorage.removeItem("AssetCurrentPage");
                sessionStorage.removeItem("selectedLocation_Asset");
                sessionStorage.removeItem("searchInput_Asset");

                // 重新整理頁面
                location.reload();
            });

            // 從 sessionStorage 取得資訊
            var savedPage = sessionStorage.getItem("AssetCurrentPage");
            var storedSearchQuery = sessionStorage.getItem("searchInput_Asset");
            var storedLocation = sessionStorage.getItem("selectedLocation_Asset");
            console.log(savedPage)
            console.log(storedSearchQuery)
            console.log(storedLocation)

            if (storedSearchQuery) {
                $("#searchInput_Asset").val(storedSearchQuery);
            }
            if (storedLocation) {
                $("#location_Asset").val(storedLocation);
            }

            // 判斷該載入哪一種資料
            if (savedPage !== null) {
                load_All_Asset(parseInt(savedPage));
                console.log("1");
            } else if (storedSearchQuery !== null && storedLocation === null) {
                filterByID(storedSearchQuery);
                console.log("2");
            } else if (storedSearchQuery === null && storedLocation !== null) {
                filterByLocation(storedLocation);
                console.log("3");
            } else {
                load_All_Asset(0);
                console.log("4");
            }

            function load_All_Asset(page) {
                $.ajax({
                    type: 'POST',
                    url: '/chyunn/asset/select_All_TAsset',
                    data: { page: page, size: 100 },
                    success: function (response) {
                        var tableBody = $("#inventoryEquipment-table");
                        tableBody.empty();
                        response.content.forEach(function (inventoryEquipment) {
                            var newRow = $("<tr>");
                            newRow.append("<td class='text-dark final_property_id-column'>" +
                                "<a href='#' class='property-id' data-id='" + inventoryEquipment.asset_id + "'>" +
                                inventoryEquipment.asset_id +
                                "</a></td>");
                            newRow.append("<td class='text-dark name-column'>" + inventoryEquipment.name + "</td>");
                            newRow.append("<td class='text-dark custodian-column'>" + inventoryEquipment.custodian + "</td>");
                            newRow.append("<td class='text-dark location-column'>" + inventoryEquipment.storage_location + "</td>");
                            newRow.append("<td class='text-dark category-column'>" + inventoryEquipment.category + "</td>");
                            newRow.append("<td class='text-dark change_record-column'>" + inventoryEquipment.change_log + "</td>");
                            newRow.append("<td class='text-dark inventory-date'>" + (inventoryEquipment.inventory_date ?? "") + "</td>");
                            tableBody.append(newRow);
                        });

                        // 更新分頁控制
                        var pagination = $("#pagination");
                        pagination.empty();

                        // 使用 Bootstrap 樣式的分頁按鈕
                        var paginationContainer = $('<nav aria-label="Page navigation"><ul class="pagination justify-content-center"></ul></nav>');
                        var paginationList = paginationContainer.find('ul');

                        // 上一頁按鈕
                        if (response.currentPage > 0) {
                            paginationList.append('<li class="page-item"><button class="page-link text-dark prev-page">上一頁</button></li>');
                        } else {
                            paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">上一頁</span></li>');
                        }

                        // 當前頁數
                        paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">第 ' + (response.currentPage + 1) + ' 頁 / ' + response.totalPages + ' 頁</span></li>');

                        // 下一頁按鈕
                        if (response.currentPage < response.totalPages - 1) {
                            paginationList.append('<li class="page-item"><button class="page-link text-dark next-page">下一頁</button></li>');
                        } else {
                            paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">下一頁</span></li>');
                        }

                        // 把 Bootstrap 分頁元素加入頁面
                        pagination.append(paginationContainer);

                        // 查詢特定頁數
                        paginationList.append('<li class="page-item"><input type="number" id="pageInput" class="form-control" style="width: 80px; margin-left: 10px;" min="1" max="' + response.totalPages + '" placeholder="頁數"></li>');
                        paginationList.append('<li class="page-item"><button class="page-link text-dark" id="goToPage">跳轉</button></li>');

                        // 把 Bootstrap 分頁元素加入頁面
                        pagination.append(paginationContainer);

                        // 點擊分頁按鈕
                        $(".prev-page").click(function () {
                            load_All_Asset(response.currentPage - 1);
                            sessionStorage.setItem("AssetCurrentPage", response.currentPage - 1);
                        });
                        $(".next-page").click(function () {
                            load_All_Asset(response.currentPage + 1);
                            sessionStorage.setItem("AssetCurrentPage", response.currentPage + 1);
                        });

                        // 點擊跳轉按鈕
                        $("#goToPage").click(function () {
                            var pageInput = $("#pageInput").val();
                            if (pageInput >= 1 && pageInput <= response.totalPages) {
                                load_All_Asset(pageInput - 1);  // 分頁從0開始
                                sessionStorage.setItem("AssetCurrentPage", pageInput - 1);
                            } else {
                                alert("請輸入有效的頁數！");
                            }
                        });
                    },
                    error: function (xhr, status, error) {
                        console.error("錯誤回應: ", xhr.responseText); // 打印錯誤回應
                    }

                });
            }

            $("#filter-btn").on("click", function (event) {
                event.preventDefault();
                let searchQuery = $("#searchInput_Asset").val().trim(); // 取得搜尋框的輸入內容
                if (searchQuery.length > 0) {
                    filterByID(searchQuery); // 進行第一次搜尋並從第 1 頁開始
                } else {
                    $("#inventoryEquipment-table").empty(); // 若輸入框為空，清空表格
                    $("#pagination").empty(); // 清空分頁控制
                }
            });

            function filterByID(searchQuery = '') {
                $.ajax({
                    type: "POST",
                    url: "/chyunn/asset/search_general_catalog",
                    data: {
                        final_property_id: searchQuery,
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            let assets = response.data;
                            // 清空表格
                            $("#inventoryEquipment-table").empty();

                            if (assets.length > 0) {
                                let tableBody = $("#inventoryEquipment-table");

                                assets.forEach(function (asset) {
                                    var newRow = $("<tr>");
                                    newRow.append("<td class='text-dark final_property_id-column'>" +
                                        "<a href='#' class='property-id' data-id='" + asset.asset_id + "'>" +
                                        asset.asset_id +
                                        "</a></td>");
                                    newRow.append("<td class='text-dark name-column'>" + asset.name + "</td>");
                                    newRow.append("<td class='text-dark custodian-column'>" + asset.custodian + "</td>");
                                    newRow.append("<td class='text-dark location-column'>" + asset.storage_location + "</td>");
                                    newRow.append("<td class='text-dark category-column'>" + asset.category + "</td>");
                                    newRow.append("<td class='text-dark change_record-column'>" + asset.change_log + "</td>");
                                    newRow.append("<td class='text-dark inventory-date'>" + (asset.inventory_date ?? "") + "</td>");
                                    tableBody.append(newRow);
                                });
                            }
                            sessionStorage.setItem("searchInput_Asset", searchQuery);
                            sessionStorage.removeItem("AssetCurrentPage");
                            sessionStorage.removeItem("selectedLocation_Asset");
                            $("#location_Asset").val("");
                            let pagination = $("#pagination");
                            pagination.empty();

                        } else {
                            console.error("查詢失敗:", response.message);
                        }
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "發生錯誤，請稍後再試";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            } else {
                                errorMessage = xhr.responseText || errorMessage;
                            }
                        }

                        Swal.fire({
                            icon: 'error',
                            title: '操作失敗',
                            text: errorMessage,
                        });
                    }
                });
            }

            $('#location_Asset').change(function () {
                var selectedLocation = $(this).val();
                sessionStorage.setItem("selectedLocation_Asset", selectedLocation);  // 存進 sessionStorage
                sessionStorage.removeItem("AssetCurrentPage");
                filterByLocation(selectedLocation, 0);  // 預設從第 0 頁開始
            });

            function filterByLocation(selectedLocation) {
                if (!selectedLocation) {
                    load_All_Asset(0)
                };
                console.log(selectedLocation)
                $.ajax({
                    type: 'GET',
                    url: '/chyunn/asset/filterLocation_general_catalog',
                    data: { location: selectedLocation },
                    success: function (response) {
                        console.log(response.data)
                        if (response.code === 200) {
                            let assets = response.data;
                            let tableBody = $("#inventoryEquipment-table");
                            tableBody.empty();

                            if (assets.length > 0) {
                                assets.forEach(function (asset) {
                                    var newRow = $("<tr>");
                                    newRow.append("<td class='text-dark final_property_id-column'>" +
                                        "<a href='#' class='property-id' data-id='" + asset.asset_id + "'>" +
                                        asset.asset_id +
                                        "</a></td>");
                                    newRow.append("<td class='text-dark name-column'>" + asset.name + "</td>");
                                    newRow.append("<td class='text-dark custodian-column'>" + asset.custodian + "</td>");
                                    newRow.append("<td class='text-dark location-column'>" + asset.storage_location + "</td>");
                                    newRow.append("<td class='text-dark category-column'>" + asset.category + "</td>");
                                    newRow.append("<td class='text-dark change_record-column'>" + asset.change_log + "</td>");
                                    newRow.append("<td class='text-dark inventory-date'>" + (asset.inventory_date ?? "") + "</td>");
                                    tableBody.append(newRow);
                                });
                            } else {
                                tableBody.html(`<tr><td colspan="6" class="text-center text-muted">查無資料</td></tr>`);
                            }

                            // 更新 sessionStorage
                            sessionStorage.setItem("selectedLocation_Asset", selectedLocation);
                            sessionStorage.removeItem("searchInput_Asset");
                            sessionStorage.removeItem("AssetCurrentPage");
                            $("#searchInput_Asset").val("");

                            // 建立分頁元件
                            let pagination = $("#pagination");
                            pagination.empty();

                        } else {
                            console.error("查詢失敗:", response.message);
                        }
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "發生錯誤，請稍後再試";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            } else {
                                errorMessage = xhr.responseText || errorMessage;
                            }
                        }

                        Swal.fire({
                            icon: 'error',
                            title: '操作失敗',
                            text: errorMessage,
                        });
                    }
                });
            }
            $("#downloadExcelBtn").click(function () {
                event.preventDefault();
                $.ajax({
                    type: "GET",
                    url: "/chyunn/asset/exportExcel_Asset",
                    xhrFields: {
                        responseType: 'blob'
                    },
                    success: function (response, status, xhr) {

                        const blob = response;
                        const link = document.createElement("a");
                        link.href = URL.createObjectURL(blob);
                        link.download = "財產清單_總目錄.xlsx";  // 設定下載的檔案名稱
                        link.click();
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "匯出 Excel 失敗，請稍後再試！";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            }
                        }
                        Swal.fire({
                            icon: 'error',
                            title: '匯出失敗',
                            text: errorMessage,
                        });
                    }
                });
            });

            $("#add-btn").click(function () {
                event.preventDefault();
                $.ajax({
                    type: "GET",
                    url: "/chyunn/asset/locations",
                    success: function (response) {
                        if (response.code === 200) {
                            let locations = response.data;
                            console.log(locations)
                            let locationOptions = '<option value="">-- 請選擇 --</option>';
                            locations.forEach(function (location) {
                                locationOptions += `<option value="${location.name}">${location.name}</option>`;
                            });

                            Swal.fire({
                                title: "&nbsp;&nbsp;財產資訊",
                                html: `
                            <div class="container text-center">
                            <div class="form-group mb-3 row">
                            <div class="col-md-6">
                                <label class="text-dark text-start d-block">名稱</label>
                                <input type="text" id="sw-name" class="form-control text-dark" >
                            </div>
                            <div class="col-md-6">
                                <label class="text-dark text-start d-block">類別</label>
                                <input type="text" id="sw-category" class="form-control text-dark" >
                            </div>
                            </div>

                            <div class="form-group mb-3 row">
                            <div class="col-md-4">
                                <label class="text-dark text-start d-block">財產編號</label>
                                <input type="text" " class="form-control text-dark"  id="sw-property_id">
                            </div>
                            <div class="col-md-4">
                                <label class="text-dark text-start d-block">型號</label>
                                <input type="text" " class="form-control text-dark"  id="sw-model">
                            </div>
                          
                            </div>
                                              <div class="form-group mb-3 row">
                            <div class="col-md-4">
                            <label class="text-dark text-start d-block">放置處</label>
                            <select id="sw-location" class="form-select text-dark">
                            ${locationOptions}
                            </select>
                            </div>
                            <div class="col-md-4">
                            <label class="text-dark text-start d-block">保管人</label>
                            <input type="text" id="sw-custodian" class="form-control text-dark" >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">聯絡窗口</label>
                            <input type="text" id="sw-contact_window" class="form-control text-dark" >
                        </div>
                    </div>

                    <div class="form-group mb-3 row">
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">購買日期</label>
                            <input type="text" id="sw-purchase_date" class="form-control text-dark"  >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">購買金額</label>
                            <input type="text" id="sw-purchase_amount" class="form-control text-dark"  >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">稅金</label>
                            <input type="text" id="sw-tax" class="form-control text-dark" >
                        </div>
                    </div>

                    <div class="form-group mb-3 row">
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">購入廠商</label>
                            <input type="text" id="sw-supplier" class="form-control text-dark" >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">尺寸/序號</label>
                            <input type="text" id="sw-size_serial" class="form-control text-dark"  >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">數量/單位</label>
                            <input type="text" id="sw-quantity_unit" class="form-control text-dark"  >
                        </div>
                    </div>
                    <div class="form-group mb-3 row">
                        <div class="col-md-12">
                            <label class="text-dark text-start d-block">異動記錄</label>
                             <textarea class="form-control text-dark" id="sw-change_record" rows="4" ></textarea>
                        </div>
                    </div>
                </div>
                         `,
                                allowOutsideClick: false,
                                showCloseButton: true,
                                allowEscapeKey: false,
                                allowEnterKey: false,
                                focusConfirm: false,
                                showCancelButton: true,
                                confirmButtonText: '確定新增',
                                cancelButtonText: '取消',
                                width: 800,
                                customClass: {
                                    title: 'text-start w-100 px-4'
                                },

                                preConfirm: () => {
                                    const property_id = document.getElementById("sw-property_id").value.trim();


                                    if (!property_id) {
                                        Swal.showValidationMessage("財產編號為必填");
                                        return false;
                                    }
                                    let locationValue = document.getElementById("sw-location").value;
                                    if (locationValue === "custom") {
                                        locationValue = document.getElementById("custom-location").value;
                                    }
                                    if (!locationValue) {
                                        Swal.showValidationMessage("放置處為必選");
                                        return false;
                                    }
                                    return {
                                        name: document.getElementById("sw-name").value,
                                        asset_id: document.getElementById("sw-property_id").value,
                                        category: document.getElementById("sw-category").value,
                                        model: document.getElementById("sw-model").value,
                                        storage_location: document.getElementById("sw-location").value,
                                        custodian: document.getElementById("sw-custodian").value,
                                        contact: document.getElementById("sw-contact_window").value,
                                        purchase_date: document.getElementById("sw-purchase_date").value,
                                        purchase_price: document.getElementById("sw-purchase_amount").value,
                                        tax: document.getElementById("sw-tax").value,
                                        supplier: document.getElementById("sw-supplier").value,
                                        serial_or_size: document.getElementById("sw-size_serial").value,
                                        quantity_or_unit: document.getElementById("sw-quantity_unit").value,
                                        change_log: document.getElementById("sw-change_record").value,
                                    };
                                }
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    console.log(result.value)
                                    let newProperty = result.value;
                                    $.ajax({
                                        type: 'POST',
                                        url: '/chyunn/asset_manage/addProperty_All',
                                        contentType: "application/json",
                                        data: JSON.stringify(newProperty),
                                        success: function (response) {
                                            if (response.code === 200) {
                                                const item = response.data;
                                                let content = `
                            <div class="text-start">

                                        text: res.message || '目前沒有可供盤點的項目',
                                        icon: 'question',
                                        showCancelButton: true,
                                        showCloseButton: true,
                                        confirmButtonText: '開始新一輪盤點',
                                        cancelButtonText: '取消'
                                    }).then((result) => {
                                        if (result.isConfirmed) {
                                            $.post('/chyunn/asset/resetInventory_All', function (res) {
                                                Swal.fire('完成', res.message || '已開始新一輪盤點', 'success');
                                            }).fail(function (xhr) {
                                                const msg = xhr.responseJSON?.message || '重製失敗，請稍後再試';
                                                Swal.fire('錯誤', msg, 'error');
                                            });
                                        }
                                    })
                                } else {
                                    Swal.fire('錯誤', '伺服器錯誤，請稍後再試', 'error');
                                }
                            }
                        });
                    }
                });
            });

        });
    </script>
</body>

</html>
