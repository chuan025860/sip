<body>

    <!-- Content Start -->

                    </div>

                                <!-- <th scope="col"><input class="form-check-input" type="checkbox"></th> -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>


        var savedPage = sessionStorage.getItem("currentPage");
        var filterPage = sessionStorage.getItem("filterPage");
        var filterRecentPage = sessionStorage.getItem("filterRecentPage");
        console.log(savedPage)
        console.log(filterPage)
        console.log(filterRecentPage)
        if (savedPage !== null) {
            load_ITAsset(parseInt(savedPage));
            console.log("1")
        } else if (savedPage === null && filterPage !== null && filterRecentPage === null) {
            filterIncidents(parseInt(filterPage));
            console.log("2")
        } else if (savedPage === null && filterPage === null && filterRecentPage !== null) {
            filterRecentReports(parseInt(filterRecentPage));
            console.log("3")
        } else {
            load_ITAsset(0);
            console.log("4")
        }

        function load_ITAsset(page) {
            const token = localStorage.getItem('authToken');  // 從 localStorage 獲取 token
            $.ajax({
                type: 'POST',
                url: '/chyunn/asset/select_ITAsset',
                data: { page: page, size: 100 },
                headers: {
                    'Authorization': token
                },
                success: function (response) {
                    var tableBody = $("#inventoryEquipment-table");
                    tableBody.empty();
                    response.content.forEach(function (inventoryEquipment) {
                        var newRow = $("<tr>");
                        newRow.append("<td class='text-dark final_property_id-column'>" +
                            "<a href='#' class='property-id' data-id='" + inventoryEquipment.final_property_id + "'>" +
                            inventoryEquipment.final_property_id +
                            "</a></td>");
                        newRow.append("<td class='text-dark name-column'>" + inventoryEquipment.name + "</td>");
                        newRow.append("<td class='text-dark' custodian-column>" + inventoryEquipment.custodian + "</td>");
                        newRow.append("<td class='text-dark' location-column>" + inventoryEquipment.location + "</td>");
                        newRow.append("<td class='text-dark remarks-column'>" + inventoryEquipment.remarks + "</td>");
                        newRow.append("<td class='text-dark change_record-column'>" + inventoryEquipment.change_record + "</td>");

                        tableBody.append(newRow);
                    });

                    // 更新分頁控制
                    var pagination = $("#pagination");
                    pagination.empty();

                    // 使用 Bootstrap 樣式的分頁按鈕
                    var paginationContainer = $('<nav aria-label="Page navigation"><ul class="pagination justify-content-center"></ul></nav>');
                    var paginationList = paginationContainer.find('ul');

                    // 上一頁按鈕
                    if (response.currentPage > 0) {
                        paginationList.append('<li class="page-item"><button class="page-link text-dark prev-page">上一頁</button></li>');
                    } else {
                        paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">上一頁</span></li>');
                    }

                    // 當前頁數
                    paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">第 ' + (response.currentPage + 1) + ' 頁 / ' + response.totalPages + ' 頁</span></li>');

                    // 下一頁按鈕
                    if (response.currentPage < response.totalPages - 1) {
                        paginationList.append('<li class="page-item"><button class="page-link text-dark next-page">下一頁</button></li>');
                    } else {
                        paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">下一頁</span></li>');
                    }

                    // 把 Bootstrap 分頁元素加入頁面
                    pagination.append(paginationContainer);

                    // 查詢特定頁數
                    paginationList.append('<li class="page-item"><input type="number" id="pageInput" class="form-control" style="width: 80px; margin-left: 10px;" min="1" max="' + response.totalPages + '" placeholder="頁數"></li>');
                    paginationList.append('<li class="page-item"><button class="page-link text-dark" id="goToPage">跳轉</button></li>');

                    // 把 Bootstrap 分頁元素加入頁面
                    pagination.append(paginationContainer);

                    // 點擊分頁按鈕
                    $(".prev-page").click(function () {
                        load_ITAsset(response.currentPage - 1);
                        sessionStorage.setItem("currentPage", response.currentPage - 1);
                    });
                    $(".next-page").click(function () {
                        load_ITAsset(response.currentPage + 1);
                        sessionStorage.setItem("currentPage", response.currentPage + 1);
                    });

                    // 點擊跳轉按鈕
                    $("#goToPage").click(function () {
                        var pageInput = $("#pageInput").val();
                        if (pageInput >= 1 && pageInput <= response.totalPages) {
                            load_ITAsset(pageInput - 1);  // 分頁從0開始
                            sessionStorage.setItem("currentPage", pageInput - 1);
                        } else {
                            alert("請輸入有效的頁數！");
                        }
                    });
                },
                error: function (xhr, status, error) {
                    console.error("無法獲取事件數量");
                    console.error("錯誤回應: ", xhr.responseText); // 打印錯誤回應

                    // 如果錯誤狀態為 401（未授權），則移除 token 並跳轉到登入頁
                    if (xhr.status === 401) {
                        localStorage.removeItem('authToken');
                        window.location.href = "/chyunn/login"; // 跳轉到登入頁
                    }
                }

            });
        }
        // 使用事件委託來綁定 `property-id` 的點擊事件
        $(document).on("click", ".property-id", function (event) {
            console.log("test");
            event.preventDefault();
            let propertyId = $(this).data("id");
            // 透過 AJAX 獲取完整的財產資訊
            $.ajax({
                type: 'POST',
                url: '/chyunn/asset/getPropertyDetails', // 這是你用來取得財產詳細資料的 API URL
                data: { id: propertyId },
                headers: {
                    'Authorization': localStorage.getItem('authToken') // 假設 token 在 localStorage 中
                },
                success: function (response) {
                    // 假設回應中的資料為完整的財產資料
                    let propertyData = response.data;

                    Swal.fire({
                        title: "&nbsp;&nbsp;財產資訊",
                        html: `
            <div class="container text-center">
                <div class="form-group mb-3 row">
                    <div class="col-md-6">
                        <label class="text-dark text-start d-block">名稱</label>
                        <input type="text" id="sw-name" class="form-control text-dark" value="${propertyData.name}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="text-dark text-start d-block">類別</label>
                        <input type="text" class="form-control text-dark" value="${propertyData.category}" readonly>
                    </div>
                </div>
                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">財產編號</label>
                        <input type="text" id="sw-property_id" class="form-control text-dark" value="${propertyData.property_id}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">列管編號</label>
                        <input type="text" class="form-control text-dark" value="${propertyData.management_id}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">最終財產編號</label>
                        <input type="text" class="form-control text-dark" value="${propertyData.final_property_id}" readonly>
                    </div>
                </div>
                <div class="form-group mb-3 row">
                            <div class="col-md-4">
                <label class="text-dark text-start d-block">放置處</label>
                <input type="text" class="form-control text-dark" value="${propertyData.location}" >
                </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">保管人</label>
                        <input type="text" id="sw-custodian" class="form-control text-dark" value="${propertyData.custodian}">
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">聯絡窗口</label>
                        <input type="text" id="sw-contact_window" class="form-control text-dark" value="${propertyData.contact_window}">
                    </div>
                </div>
                        <!-- 第三列：購買日期、購買金額、稅金 -->
 <div class="form-group mb-3 row">
           <div class="col-md-4">
                <label class="text-dark text-start d-block">購買日期</label>
                <input type="text" class="form-control text-dark" value="${propertyData.purchase_date}" readonly>
            </div>
            <div class="col-md-4">
                <label class="text-dark text-start d-block">購買金額</label>
                <input type="text" class="form-control text-dark" value="${propertyData.purchase_amount}" readonly>
            </div>
                 <div class="col-md-4">
                <label class="text-dark text-start d-block">稅金</label>
                <input type="text" class="form-control text-dark" value="${propertyData.tax}" readonly>
            </div>
        </div>

        <!-- 第四列：購入廠商、尺寸/序號、數量/單位 -->
        <div class="form-group mb-3 row">
           <div class="col-md-4">
                <label class="text-dark text-start d-block">購入廠商</label>
                <input type="text" class="form-control text-dark" value="${propertyData.supplier}" readonly>
            </div>
                   <div class="col-md-4">
                <label class="text-dark text-start d-block">尺寸/序號</label>
                <input type="text" class="form-control text-dark" value="${propertyData.size_serial}" readonly>
            </div>
            <div class="col-md-4">
                <label class="text-dark text-start d-block">數量/單位</label>
                <input type="text" class="form-control text-dark" value="${propertyData.quantity_unit}" readonly>
            </div>
       
        </div>
                <div class="form-group mb-3 row">
                    <div class="col-md-12">
                        <label class="text-dark text-start d-block">異動記錄</label>
                        <input type="text" id="sw-change_record" class="form-control text-dark" value="${propertyData.change_record}">
                    </div>
                </div>
            </div>
        `,
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        allowEnterKey: false,
                        focusConfirm: false,
                        showCancelButton: true,
                        confirmButtonText: '更新',
                        cancelButtonText: '取消',
                        width: 800,
                        customClass: {
                            title: 'text-start w-100 px-4'
                        },
                        preConfirm: () => {
                            return {
                                id: $("#sw-id").val(),
                                name: $("#sw-name").val(),
                                keeper: $("#sw-keeper").val(),
                                contact: $("#sw-contact").val(),
                                history: $("#sw-history").val()
                            };
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            let updatedData = result.value;

                            // 更新表格內容
                            let $row = $(this).closest("tr");
                            $row.find("td:eq(1)").text(updatedData.name);
                            $row.find("td:eq(3)").text(updatedData.keeper);
                            $row.find("td:eq(4)").text(updatedData.contact);
                            $row.find("td:eq(5)").text(updatedData.history);

                            Swal.fire("更新成功！", "資料已更新", "success");
                        }
                    });
                },
                error: function (xhr, status, error) {
                    console.error("無法獲取財產詳細資料");
                    console.error("錯誤回應: ", xhr.responseText);

                    // 處理錯誤，例如跳轉到登入頁
                    if (xhr.status === 401) {
                        localStorage.removeItem('authToken');
                        window.location.href = "/chyunn/login"; // 跳轉到登入頁
                    }
                }
            });
        });
    </script>
</body>
