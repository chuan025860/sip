<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <title>財務-固定資產</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <div th:replace="~{backStageNavbar/backStageNavbar_1}"></div>
    <div th:replace="~{incidentNavBar/incidentNavBar_1}"></div>
    <style>
        .final_property_id-column {
            width: 3%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .name-column {
            width: 11%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .custodian-column {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .location-column {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .remarks-column {
            width: 30%;
            /* word-wrap: break-word; */
            white-space: normal;
        }


        .change_record-column {
            width: 10%;
            /* word-wrap: break-word; */
            white-space: normal;
        }

        .inventory-date {
            width: 5%;
            /* word-wrap: break-word; */
            white-space: normal;
        }
    </style>
</head>

<body>
    <div th:replace="~{backStageNavbar/backStageNavbar_2}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_3}"></div>
    <!-- Content Start -->
    <div class="content" style="width: auto; margin-top: 80px;">
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light text-center rounded p-4">
                <div class="container-fluid">
                    <form class="row align-items-center g-2">
                        <!-- 關鍵字搜尋 -->
                        <div class="col-md-auto">
                            <label for="searchInput" class="form-label text-dark mb-0">財產搜尋</label>
                        </div>
                        <div class="col-md-4">
                            <input type="search" id="searchInput" class="form-control text-dark" placeholder="請輸入關鍵字">
                        </div>

                        <!-- 放置處 -->
                        <div class="col-md-auto">
                            <label for="location" class="form-label text-dark mb-0">放置處</label>
                        </div>
                        <div class="col-md-4">
                            <select id="location" class="form-select text-dark">
                                <option value="">-- 請選擇 --</option>
                                <option th:each="location : ${locations}" th:value="${location.name}"
                                    th:text="${location.name}"></option>
                            </select>
                        </div>
                        <div class="w-100"></div>
                        <!-- 按鈕區 -->
                        <div class="col-md-auto d-flex gap-2 w-100">
                            <div class="d-flex gap-2">
                                <button id="filter-btn" class="btn btn-primary">🔍 搜尋</button>
                                <button id="reset-btn" class="btn btn-secondary">🔄 重置</button>
                                <button id="add-btn" class="btn btn-primary"
                                    th:if="${userRoles != null and (userRoles.contains('ROLE_ADMIN') or userRoles.contains('ROLE_ASSET_ADMIN'))}">
                                    ➕ 新增
                                </button>
                                <button id="downloadExcelBtn" class="btn btn-success">📥 匯出 Excel</button>
                            </div>
                            <!-- <div class="ms-auto">
                                <button id="inventorySettingBtn" class="btn btn-warning">⚙️ 設定</button>
                            </div> -->
                        </div>
                    </form>
                </div>
                <hr>
                <div class="table-responsive border">
                    <table class="table text-start align-middle table-bordered table-hover mb-0">
                        <thead>
                            <tr class="text-dark">
                                <!-- <th scope="col"><input class="form-check-input" type="checkbox"></th> -->
                                <th scope="col">財產細項編號</th>
                                <th scope="col">名稱</th>
                                <th scope="col">保管人</th>
                                <th scope="col">放置處</th>
                                <th scope="col">備註</th>
                                <th scope="col">盤點日期</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryEquipment-table">
                        </tbody>
                    </table>
                    <div id="pagination">
                        <!-- 分頁控制會由 JavaScript 填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="hidden" id="userRoles" th:value="${userRoles}" />
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    <div th:replace="~{backStageNavbar/backStageNavbar_4}"></div>
    <div th:replace="~{backStageNavbar/backStageNavbar_5}"></div>
    <script>
        $(document).ready(function () {
            const rolesRaw = $("#userRoles").val(); // 會是 "[ROLE_USER, ROLE_ASSET_MANAGE]"
            const userRoles = rolesRaw.replace(/[\[\]\s]/g, "").split(",");
            const canEdit = userRoles.includes("ROLE_ADMIN") || userRoles.includes("ROLE_ASSET_ADMIN");
            $("#reset-btn").click(function (event) {
                event.preventDefault();

                // 清空搜尋欄位
                $("#searchInput").val("");

                // 重置下拉選單
                $("#location").prop("selectedIndex", 0);

                // 清空 sessionStorage
                sessionStorage.removeItem("FixedAssetCurrentPage");
                sessionStorage.removeItem("selectedFixedAssetLocation");
                sessionStorage.removeItem("searchFixedAssetInput");

                // 重新整理頁面
                location.reload();
            });

            // 從 sessionStorage 取得資訊
            var savedPage = sessionStorage.getItem("FixedAssetCurrentPage");
            var storedSearchQuery = sessionStorage.getItem("searchFixedAssetInput");
            var storedLocation = sessionStorage.getItem("selectedFixedAssetLocation");
            console.log(savedPage)
            console.log(storedSearchQuery)
            console.log(storedLocation)

            if (storedSearchQuery) {
                $("#searchInput").val(storedSearchQuery);
            }
            if (storedLocation) {
                $("#location").val(storedLocation);
            }

            // 判斷該載入哪一種資料
            if (savedPage !== null) {
                load_ITAsset(parseInt(savedPage));
                console.log("1");
            } else if (storedSearchQuery !== null && storedLocation === null) {
                filterByID(storedSearchQuery || '');
                console.log("2");
            } else if (storedSearchQuery === null && storedLocation !== null) {
                filterByLocation(storedLocation || '');
                console.log("3");
            } else {
                load_ITAsset(0);
                console.log("4");
            }

            function load_ITAsset(page) {
                $.ajax({
                    type: 'POST',
                    url: '/chyunn/asset/select_FixedAsset',
                    data: { page: page, size: 100 },
                    success: function (response) {
                        var tableBody = $("#inventoryEquipment-table");
                        tableBody.empty();
                        response.content.forEach(function (fixedAssetDto) {
                            var newRow = $("<tr>");
                            newRow.append("<td class='text-dark final_property_id-column'>" +
                                "<a href='#' class='property-id' data-id='" + fixedAssetDto.sub_category_id + "'>" +
                                fixedAssetDto.sub_category_id +
                                "</a></td>");
                            newRow.append("<td class='text-dark name-column'>" + fixedAssetDto.sub_category_name + "</td>");
                            newRow.append("<td class='text-dark custodian-column'>" + fixedAssetDto.custodian_name + "</td>");
                            newRow.append("<td class='text-dark location-column'>" + fixedAssetDto.fixed_location + "</td>");
                            newRow.append("<td class='text-dark remarks-column'>" + fixedAssetDto.remark + "</td>");
                            newRow.append("<td class='text-dark inventory-date'>" + (fixedAssetDto.inventory_date ?? "") + "</td>");
                            tableBody.append(newRow);
                        });

                        // 更新分頁控制
                        var pagination = $("#pagination");
                        pagination.empty();

                        // 使用 Bootstrap 樣式的分頁按鈕
                        var paginationContainer = $('<nav aria-label="Page navigation"><ul class="pagination justify-content-center"></ul></nav>');
                        var paginationList = paginationContainer.find('ul');

                        // 上一頁按鈕
                        if (response.currentPage > 0) {
                            paginationList.append('<li class="page-item"><button class="page-link text-dark prev-page">上一頁</button></li>');
                        } else {
                            paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">上一頁</span></li>');
                        }

                        // 當前頁數
                        paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">第 ' + (response.currentPage + 1) + ' 頁 / ' + response.totalPages + ' 頁</span></li>');

                        // 下一頁按鈕
                        if (response.currentPage < response.totalPages - 1) {
                            paginationList.append('<li class="page-item"><button class="page-link text-dark next-page">下一頁</button></li>');
                        } else {
                            paginationList.append('<li class="page-item disabled"><span class="page-link text-dark">下一頁</span></li>');
                        }

                        // 把 Bootstrap 分頁元素加入頁面
                        pagination.append(paginationContainer);

                        // 查詢特定頁數
                        paginationList.append('<li class="page-item"><input type="number" id="pageInput" class="form-control" style="width: 80px; margin-left: 10px;" min="1" max="' + response.totalPages + '" placeholder="頁數"></li>');
                        paginationList.append('<li class="page-item"><button class="page-link text-dark" id="goToPage">跳轉</button></li>');

                        // 把 Bootstrap 分頁元素加入頁面
                        pagination.append(paginationContainer);

                        // 點擊分頁按鈕
                        $(".prev-page").click(function () {
                            load_ITAsset(response.currentPage - 1);
                            sessionStorage.setItem("FixedAssetCurrentPage", response.currentPage - 1);
                        });
                        $(".next-page").click(function () {
                            load_ITAsset(response.currentPage + 1);
                            sessionStorage.setItem("FixedAssetCurrentPage", response.currentPage + 1);
                        });

                        // 點擊跳轉按鈕
                        $("#goToPage").click(function () {
                            var pageInput = $("#pageInput").val();
                            if (pageInput >= 1 && pageInput <= response.totalPages) {
                                load_ITAsset(pageInput - 1);  // 分頁從0開始
                                sessionStorage.setItem("FixedAssetCurrentPage", pageInput - 1);
                            } else {
                                alert("請輸入有效的頁數！");
                            }
                        });
                    },
                    error: function (xhr, status, error) {
                        console.error("錯誤回應: ", xhr.responseText); // 打印錯誤回應
                    }

                });
            }

            $("#filter-btn").on("click", function (event) {
                event.preventDefault();
                let searchQuery = $("#searchInput").val().trim(); // 取得搜尋框的輸入內容
                if (searchQuery.length > 0) {
                    filterByID(searchQuery); // 進行第一次搜尋並從第 1 頁開始
                } else {
                    $("#inventoryEquipment-table").empty(); // 若輸入框為空，清空表格
                    $("#pagination").empty(); // 清空分頁控制
                }
            });

            function filterByID(searchQuery = '') {
                $.ajax({
                    type: "POST",
                    url: "/chyunn/asset/searchFixedAsset",
                    data: {
                        sub_category_id: searchQuery,
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            let assets = response.data;
                            // 清空表格
                            $("#inventoryEquipment-table").empty();

                            if (assets.length > 0) {
                                let tableBody = $("#inventoryEquipment-table");

                                assets.forEach(function (asset) {
                                    var newRow = $("<tr>");
                                    newRow.append("<td class='text-dark final_property_id-column'>" +
                                        "<a href='#' class='property-id' data-id='" + asset.sub_category_id + "'>" +
                                        asset.sub_category_id +
                                        "</a></td>");
                                    newRow.append("<td class='text-dark name-column'>" + asset.sub_category_name + "</td>");
                                    newRow.append("<td class='text-dark custodian-column'>" + asset.custodian_name + "</td>");
                                    newRow.append("<td class='text-dark location-column'>" + asset.fixed_location + "</td>");
                                    newRow.append("<td class='text-dark remarks-column'>" + asset.remark + "</td>");

                                    newRow.append("<td class='text-dark inventory-date'>" + (asset.inventory_date ?? "") + "</td>");
                                    tableBody.append(newRow);
                                });
                            }
                            sessionStorage.setItem("searchFixedAssetInput", searchQuery);
                            sessionStorage.removeItem("FixedAssetCurrentPage");
                            sessionStorage.removeItem("selectedFixedAssetLocation");
                            $("#location").val("");
                            let pagination = $("#pagination");
                            pagination.empty();

                        } else {
                            console.error("查詢失敗:", response.message);
                        }
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "發生錯誤，請稍後再試";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            } else {
                                errorMessage = xhr.responseText || errorMessage;
                            }
                        }

                        Swal.fire({
                            icon: 'error',
                            title: '操作失敗',
                            text: errorMessage,
                        });
                    }
                });
            }

            $('#location').change(function () {
                var selectedFixedAssetLocation = $(this).val();
                sessionStorage.setItem("selectedFixedAssetLocation", selectedFixedAssetLocation);  // 存進 sessionStorage
                sessionStorage.removeItem("FixedAssetCurrentPage");
                filterByLocation(selectedFixedAssetLocation);
            });

            function filterByLocation(selectedFixedAssetLocation) {
                if (!selectedFixedAssetLocation) {
                    load_ITAsset(0)
                };
                console.log(selectedFixedAssetLocation)
                $.ajax({
                    type: 'GET',
                    url: '/chyunn/asset/filterFixedAssetLocation',
                    data: { location: selectedFixedAssetLocation },
                    success: function (response) {
                        console.log(response.data)
                        if (response.code === 200) {
                            let assets = response.data;

                            let tableBody = $("#inventoryEquipment-table");
                            tableBody.empty();

                            if (assets.length > 0) {
                                assets.forEach(function (asset) {
                                    var newRow = $("<tr>");
                                    newRow.append("<td class='text-dark final_property_id-column'>" +
                                        "<a href='#' class='property-id' data-id='" + asset.sub_category_id + "'>" +
                                        asset.sub_category_id +
                                        "</a></td>");
                                    newRow.append("<td class='text-dark name-column'>" + asset.sub_category_name + "</td>");
                                    newRow.append("<td class='text-dark custodian-column'>" + asset.custodian_name + "</td>");
                                    newRow.append("<td class='text-dark location-column'>" + asset.fixed_location + "</td>");
                                    newRow.append("<td class='text-dark remarks-column'>" + asset.remark + "</td>");
                                    newRow.append("<td class='text-dark inventory-date'>" + (asset.inventory_date ?? "") + "</td>");
                                    tableBody.append(newRow);

                                    let pagination = $("#pagination");
                                    pagination.empty();
                                });
                            } else {
                                tableBody.html(`<tr><td colspan="6" class="text-center text-muted">查無資料</td></tr>`);
                            }

                            // 更新 sessionStorage
                            sessionStorage.setItem("selectedFixedAssetLocation", selectedFixedAssetLocation);  // 存進 sessionStorage
                            sessionStorage.removeItem("searchFixedAssetInput");
                            $("#searchInput").val("");

                        } else {
                            console.error("查詢失敗:", response.message);
                        }
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "發生錯誤，請稍後再試";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            } else {
                                errorMessage = xhr.responseText || errorMessage;
                            }
                        }

                        Swal.fire({
                            icon: 'error',
                            title: '操作失敗',
                            text: errorMessage,
                        });
                    }
                });
            }
            $("#downloadExcelBtn").click(function () {
                event.preventDefault();
                $.ajax({
                    type: "GET",
                    url: "/chyunn/asset/FixedAsset_exportExcel",
                    xhrFields: {
                        responseType: 'blob'
                    },
                    success: function (response, status, xhr) {

                        const blob = response;
                        const link = document.createElement("a");
                        link.href = URL.createObjectURL(blob);
                        link.download = "財務_固定資產.xlsx";  // 設定下載的檔案名稱
                        link.click();
                    },
                    error: function (xhr, status, error) {
                        let errorMessage = "匯出 Excel 失敗，請稍後再試！";
                        try {
                            let response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            if (xhr.responseText && xhr.responseText.includes('<!DOCTYPE')) {
                                errorMessage = "伺服器未回應或發生錯誤。";
                            }
                        }
                        Swal.fire({
                            icon: 'error',
                            title: '匯出失敗',
                            text: errorMessage,
                        });
                    }
                });
            });

            $("#add-btn").click(function () {
                event.preventDefault();
                $.ajax({
                    type: "GET",
                    url: "/chyunn/asset/FixedAssetLocation",
                    success: function (response) {
                        if (response.code === 200) {
                            let locations = response.data;
                            console.log(locations)
                            let locationOptions = '<option value="">-- 請選擇 --</option>';
                            locations.forEach(function (location) {
                                locationOptions += `<option value="${location.name}">${location.name}</option>`;
                            });

                            Swal.fire({
                                title: "&nbsp;&nbsp;財產資訊",
                                html: `
                        <div class="container text-center">
                        <div class="form-group mb-3 row">
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">財產大類編號</label>
                            <input type="text" id="sw-major_category_id" class="form-control text-dark" >
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">財產大類名稱</label>
                            <input type="text" id="sw-major_category_name" class="form-control text-dark" >
                        </div>
                          <div class="col-md-4">
                            <label class="text-dark text-start d-block">財產細項編號</label>
                            <input type="text" id="sw-sub_category_id" class="form-control text-dark" >
                        </div>
                        </div>

                        <div class="form-group mb-3 row">
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">財產細項名稱</label>
                            <input type="text" " class="form-control text-dark"  id="sw-sub_category_name">
                        </div>
                        <div class="col-md-4">
                            <label class="text-dark text-start d-block">單位</label>
                            <input type="text" id="sw-unit" class="form-control text-dark">
                        </div>
                        </div>
                        <div class="form-group mb-3 row">
                        <div class="col-md-4">
                        <label class="text-dark text-start d-block">所在地</label>
                        <select id="sw-fixed_location" class="form-select text-dark">
                        ${locationOptions}
                        </select>
                        </div>
                        <div class="col-md-4">
                        <label class="text-dark text-start d-block">保管人</label>
                        <input type="text" id="sw-custodian_id" class="form-control text-dark" >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">保管人名稱</label>
                        <input type="text" id="sw-custodian_name" class="form-control text-dark" >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">耐用年數-原表</label>
                        <input type="text" id="sw-useful_life_original" class="form-control text-dark"  >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">耐用年數-新表</label>
                        <input type="text" id="sw-useful_life_new" class="form-control text-dark" >
                    </div>
                     <div class="col-md-4">
                        <label class="text-dark text-start d-block">耐用年數-換算</label>
                        <input type="text" id="sw-useful_life_converted" class="form-control text-dark"  >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">取得時間</label>
                        <input type="text" id="sw-acquisition_date" class="form-control text-dark" >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">截止提列日期</label>
                        <input type="text" id="sw-depreciation_end_date" class="form-control text-dark"  >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">數量/單位</label>
                        <input type="text" id="sw-quantity" class="form-control text-dark"  >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">取得原價</label>
                        <input type="text" id="sw-acquisition_cost" class="form-control text-dark" >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">改良或修理</label>
                        <input type="text" id="sw-improvement_cost" class="form-control text-dark"  >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">預留殘值</label>
                        <input type="text" id="sw-salvage_value" class="form-control text-dark"  >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">取得原價減預留殘值</label>
                        <input type="text" id="sw-net_acquisition_cost" class="form-control text-dark" >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">本期提列數</label>
                        <input type="text" id="sw-current_period_depreciation" class="form-control text-dark"  >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">截至本期累計數</label>
                        <input type="text" id="sw-accumulated_depreciation" class="form-control text-dark"  >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">未折減餘額</label>
                        <input type="text" id="sw-net_book_value" class="form-control text-dark" >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">改良修理序號</label>
                        <input type="text" id="sw-improvement_serial_no" class="form-control text-dark"  >
                    </div>
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">設備或生財器具名稱</label>
                        <input type="text" id="sw-equipment_name" class="form-control text-dark"  >
                    </div>
                </div>

                <div class="form-group mb-3 row">
                    <div class="col-md-4">
                        <label class="text-dark text-start d-block">財產目錄大類名稱</label>
                        <input type="text" id="sw-catalog_major_name" class="form-control text-dark" >
                    </div>
