<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 封裝共用函式：根據路徑開啟對應的 dropdown
        function expandDropdownIfMatch(pathPrefix, dropdownId) {
            if (window.location.pathname.startsWith(pathPrefix)) {
                const dropdown = document.getElementById(dropdownId);
                const toggleLink = dropdown?.previousElementSibling;
                dropdown?.classList.add('show');
                toggleLink?.classList.add('show');
                toggleLink?.setAttribute('aria-expanded', 'true');
            }
        }
        // 多組呼叫
        expandDropdownIfMatch('/chyunn/resource', 'resourceDropdownMenu');
        expandDropdownIfMatch('/chyunn/incident', 'incidentDropdownMenu');
        expandDropdownIfMatch('/chyunn/asset', 'assetDropdownMenu');
        expandDropdownIfMatch('/chyunn/permission', 'permissionDropdownMenu');
    });
</script>
