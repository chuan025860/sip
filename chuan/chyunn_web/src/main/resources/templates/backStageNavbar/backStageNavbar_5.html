<script>
    $(document).ready(function () {
        $('#logoutBtn').click(function () {
            // 從 localStorage 中取得 token
            var token = localStorage.getItem('authToken');

            if (token) {
                $.ajax({
                    url: '/chyunn/user/logout',  // 登出 API 路徑
                    type: 'POST',  // 使用 POST 請求
                    headers: {
                        'Authorization': token // 加入 token 作為 Authorization header
                    },
                    success: function (response) {
                        // 登出成功後的處理
                        console.log('登出成功');
                        // 你可以根據需求清除 localStorage 或 sessionStorage
                        localStorage.removeItem('authToken');
                        window.location.href = '/chyunn/login';  // 重新導向到登入頁面
                    },
                    error: function (error) {
                        console.log('登出失敗:', error);
                    }
                });
            } else {
                console.log('未找到 token');
            }
        });
    });
</script>
